name: ingest-french-bot-avatars
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: dry
        options: [dry, apply]
permissions:
  contents: read
jobs:
  ingest:
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ingest reviewed avatars in active production container
        run: |
          set -euo pipefail
          DIR="${BOM_DEPLOY_DIR:-/home/ubuntu/greenfield}"
          ACTIVE="$(sed -n '1p' "$DIR/active-slot")"
          FLAG=""
          [ "${{ inputs.mode }}" = "apply" ] && FLAG="--apply"
          docker cp backend/scripts/ingest-french-bot-avatars.ts "$ACTIVE":/app/backend/scripts/ingest-french-bot-avatars.ts
          docker exec -w /app/backend "$ACTIVE" node --import tsx scripts/ingest-french-bot-avatars.ts $FLAG
