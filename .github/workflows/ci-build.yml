name: ci-build

# Build gate (2026-09-08 security audit, H2): compile backend + CRA + Next on every
# PR and on pushes to the main branches, mirroring the Dockerfile build steps. Catches
# build breaks (e.g. a stale import) BEFORE they reach the `prod` branch — the prod
# deploy build had been failing silently on exactly that. Runs on GitHub-HOSTED runners
# (never the self-hosted prod runner). To gate deploys, make "build" a required status
# check on `prod` in branch protection.
on:
  pull_request:
  push:
    branches: [dev, prod, main]

# Least-privilege token: this only reads the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      # Mirror Dockerfile: npm ci + npm run build for each workspace. A failure here
      # is the same failure the prod image build would hit.
      - name: Build backend (tsc)
        run: cd backend && npm ci && npm run build
      - name: Build frontend (frontend/webapp)
        # Vite, since react-scripts was removed. CI/GENERATE_SOURCEMAP are no
        # longer meaningful: those were react-scripts knobs (CI=true made its
        # bundled eslint fail the build on warnings). Lint now runs as its own
        # step below instead of inside the bundler.
        run: cd frontend/webapp && npm ci && npm run build
      - name: Lint frontend source
        # Application source only — test files are excluded because
        # eslint-config-react-app/jest no longer loads (its jest env fails under
        # eslint 8.57 now that react-scripts does not pin the chain). Source is
        # at 0 errors, so this gates on real breakage (undefined identifiers,
        # unresolved or phantom imports) while its ~650 warnings stay advisory.
        run: cd frontend/webapp && npm run lint
      - name: Build Next (frontend/next)
        run: cd frontend/next && npm ci && npm run build
