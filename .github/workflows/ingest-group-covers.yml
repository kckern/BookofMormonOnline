name: ingest-group-covers

# Manual one-off: rehost every group cover image to our own S3
# (groups/<channel>.jpg) so runtime never depends on an external image domain.
# Runs scripts/ingest-group-covers.mjs INSIDE the active prod container. Executes
# via a GitHub-hosted runner -> OIDC -> SSM (audit H3); dispatch from the `prod`
# branch (the OIDC role trust is locked to prod). Default mode `dry`.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = report only, apply = write S3 + DB'
        type: choice
        default: dry
        options: [dry, apply]

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
      - name: Run group-cover ingest in the active container via SSM
        env:
          IID: ${{ secrets.PROD_INSTANCE_ID }}
          MODE: ${{ inputs.mode }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APPLY=""; [ "$MODE" = "apply" ] && APPLY="--apply"
          CMD="$(printf '%s\n' \
            'set -eu' \
            'ACTIVE="$(sed -n 1p /home/ubuntu/greenfield/active-slot)"' \
            'docker container inspect "$ACTIVE" >/dev/null' \
            "docker exec \"\$ACTIVE\" node /app/backend/scripts/ingest-group-covers.mjs $APPLY")"
          CMDB64="$(printf '%s' "$CMD" | base64 -w0)"
          CID="$(aws ssm send-command --region us-west-2 --instance-ids "$IID" \
            --document-name bom-ingest --parameters "Ref=${REF},CmdB64=${CMDB64}" \
            --query Command.CommandId --output text)"
          echo "SSM command: $CID (mode=$MODE)"
          ST=Pending
          for _ in $(seq 1 90); do
            ST="$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$ST" in
              Success) break ;;
              Failed|Cancelled|TimedOut) echo "::error::ingest $ST"; aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardErrorContent --output text || true; exit 1 ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text || true
          [ "$ST" = Success ] || { echo "::error::ingest not Success ($ST)"; exit 1; }
