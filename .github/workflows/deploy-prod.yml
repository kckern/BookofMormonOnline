# CI/CD — on push to `prod`, build the Docker image on GitHub's hosted runners
# (free for public repos), push to Docker Hub, then trigger the blue-green deploy
# on the EC2 box via a self-hosted runner (outbound HTTPS only — no open SSH port).
#
# Required GitHub Actions secrets:
#   DOCKERHUB_TOKEN        — Docker Hub access token for `kckern`
#   CLICKY_JS_PATH         — obfuscated path for the Clicky JS proxy
#   CLICKY_BEACON_PATH     — obfuscated path for the Clicky beacon proxy
#
# Self-hosted runner: installed on the prod EC2 box at ~/actions-runner,
# labelled 'prod'. Connects to GitHub outbound (port 443) — no inbound SSH needed.

name: deploy-prod

on:
  push:
    branches: [prod]
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: kckern
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            kckern/bookofmormon-online:prod
            kckern/bookofmormon-online:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_CLICKY_SITE_ID=66488278
            REACT_APP_CLICKY_JS_PATH=${{ secrets.CLICKY_JS_PATH }}
            CLICKY_JS_PATH=${{ secrets.CLICKY_JS_PATH }}
            CLICKY_BEACON_PATH=${{ secrets.CLICKY_BEACON_PATH }}

  deploy:
    needs: build-push
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@v4
      - name: Blue-green deploy
        run: |
          install -m 0755 ops/production/deploy-blue-green.sh /home/ubuntu/greenfield/deploy-blue-green.sh
          cd /home/ubuntu/greenfield
          bash deploy-blue-green.sh
