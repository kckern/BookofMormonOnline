# CI/CD — on push to `prod`, build the Docker image on GitHub's hosted runners
# (free for public repos), push to Docker Hub, then trigger the blue-green deploy
# on the EC2 box via a self-hosted runner (outbound HTTPS only — no open SSH port).
#
# Required GitHub Actions secrets:
#   DOCKERHUB_TOKEN        — Docker Hub access token for `kckern`
#   CLICKY_JS_PATH         — obfuscated path for the Clicky JS proxy
#   CLICKY_BEACON_PATH     — obfuscated path for the Clicky beacon proxy
#
# Self-hosted runner: installed on the prod EC2 box at ~/actions-runner,
# labelled 'prod'. Connects to GitHub outbound (port 443) — no inbound SSH needed.

name: deploy-prod

on:
  push:
    branches: [prod]
  workflow_dispatch: {}

# Least-privilege GITHUB_TOKEN: this pipeline authenticates to Docker Hub with
# DOCKERHUB_TOKEN and deploys via the self-hosted runner, so the workflow token
# only needs to read the repo (2026-09-08 security audit).
permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: kckern
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            kckern/bookofmormon-online:prod
            kckern/bookofmormon-online:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_CLICKY_SITE_ID=66488278
            REACT_APP_CLICKY_JS_PATH=${{ secrets.CLICKY_JS_PATH }}
            CLICKY_JS_PATH=${{ secrets.CLICKY_JS_PATH }}
            CLICKY_BEACON_PATH=${{ secrets.CLICKY_BEACON_PATH }}

  deploy:
    needs: build-push
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Blue-green deploy
        run: |
          install -m 0755 ops/production/deploy-blue-green.sh /home/ubuntu/greenfield/deploy-blue-green.sh
          # Pin the exact digest CI just built (audit H4). The box — and the 5-min
          # reconcile timer — deploy this immutable ref, never the mutable :prod tag.
          echo "kckern/bookofmormon-online@${{ needs.build-push.outputs.digest }}" > /home/ubuntu/greenfield/desired-image
          cd /home/ubuntu/greenfield
          bash deploy-blue-green.sh
