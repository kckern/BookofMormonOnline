# Auto-deploy — build the prod image on push to `prod`, push to Docker Hub.
# The EC2 box redeploys itself via Watchtower (watches the moving `:prod` tag),
# so nothing here touches the box directly — pull-based, no inbound access.
#
# Runs on GitHub's free hosted runners (public repo = unlimited minutes), so the
# 3.8 GB prod box never carries the build.
#
# STATUS: scaffold. Goes live once BOTH:
#   1. the greenfield Dockerfile exists (today the only one is _deprecated/Dockerfile), and
#   2. this file is present on the `prod` branch.
#
# Secrets used:
#   secrets.DOCKERHUB_TOKEN — Docker Hub access token for `kckern` (already set)
#   When the greenfield Dockerfile takes build args (e.g. the Clicky obfuscated
#   paths REACT_APP_CLICKY_*), add them as secrets and pass via build-args below,
#   so those values are injected at build time and never committed to the repo.

name: deploy-prod

on:
  push:
    branches: [prod]
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: kckern
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # file: ./Dockerfile          # greenfield Dockerfile — create during cutover
          push: true
          tags: |
            kckern/bookofmormon-online:prod
            kckern/bookofmormon-online:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # build-args: |               # uncomment when the Dockerfile consumes them
          #   REACT_APP_CLICKY_JS_PATH=${{ secrets.REACT_APP_CLICKY_JS_PATH }}
          #   REACT_APP_CLICKY_SITE_ID=${{ secrets.REACT_APP_CLICKY_SITE_ID }}
