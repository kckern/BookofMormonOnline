# CI/CD — build the prod image on push to `prod`, push to Docker Hub,
# then SSH into the EC2 box and run deploy-blue-green.sh for a zero-downtime
# blue-green swap.
#
# Runs on GitHub's free hosted runners (public repo = unlimited minutes), so the
# EC2 box never carries the build load.
#
# Required GitHub Actions secrets:
#   DOCKERHUB_TOKEN        — Docker Hub access token for `kckern`
#   EC2_HOST               — public IP or hostname of the prod EC2 box
#   EC2_SSH_KEY            — PEM private key for ubuntu@ on that box
#   CLICKY_JS_PATH         — obfuscated path for the Clicky JS proxy
#   CLICKY_BEACON_PATH     — obfuscated path for the Clicky beacon proxy

name: deploy-prod

on:
  push:
    branches: [prod]
  workflow_dispatch: {}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: kckern
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            kckern/bookofmormon-online:prod
            kckern/bookofmormon-online:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_CLICKY_SITE_ID=66488278
            REACT_APP_CLICKY_JS_PATH=${{ secrets.CLICKY_JS_PATH }}
            CLICKY_JS_PATH=${{ secrets.CLICKY_JS_PATH }}
            CLICKY_BEACON_PATH=${{ secrets.CLICKY_BEACON_PATH }}

      - name: Deploy via blue-green swap
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/greenfield
            bash deploy-blue-green.sh
