# Ad-hoc test against the real, bot-populated "Reformers Discuss the Book of
# Mormon" group. Posting a question triggers the async botResponder, which has a
# reformer reply (one bot per human message, by design) generated by the live
# LLM within a couple of seconds.
#
#   node scripts/study.cli.mjs run scripts/study/scenarios/reformers.yaml
#
# NOTE on membership: this group is NOT open-enrollment, so joinOpenGroup fails
# and the sim users never become members — which means they are NOT in the
# channel's socket room and do NOT receive live message_received broadcasts
# (--watch will stay quiet). We therefore POLL the reply over HTTP (the `msgs`
# step) after a short delay instead of watching the socket. For a full LIVE
# multi-user socket demo where members DO receive broadcasts, see demo.yaml.
users: [visitor, seeker]
settle: 1500
steps:
  - as: visitor
    do: request                                    # correct verb for a non-open group (pending approval)
    url: "36eddcfa954553c01a2b8bacb6ff86f4"
  - as: visitor
    do: channel
    group: "36eddcfa954553c01a2b8bacb6ff86f4"
  - as: visitor
    do: post
    group: "36eddcfa954553c01a2b8bacb6ff86f4"
    text: "Reformers — what do you make of Alma 32:21 on faith and things not seen?"
    as_var: q
  - delay: 12000                                   # let the botResponder's LLM reply land
  - as: visitor
    do: msgs                                        # poll: shows our question + the reformer's reply
    group: "36eddcfa954553c01a2b8bacb6ff86f4"
    limit: 4
