# Included by Nginx Proxy Manager at the top of the http context, before its
# generated proxy server blocks.
# Keep the Cloudflare list synchronized with https://api.cloudflare.com/client/v4/ips.

# ALB appends its immediate client to X-Forwarded-For. The rightmost address is
# therefore the Cloudflare edge for proxied traffic, or the direct client for
# traffic that bypasses Cloudflare and reaches the ALB.
map $http_x_forwarded_for $bom_alb_source {
  default "";
  ~^(?:.*,\s*)?([^,\s]+)\s*$ $1;
}

# NPM enables real_ip_header globally. Use the original socket peer here so a
# caller-supplied X-Real-IP value cannot influence ingress trust.
geo $realip_remote_addr $bom_private_peer {
  default 0;
  10.0.0.0/8 1;
  172.16.0.0/12 1;
  192.168.0.0/16 1;
  fc00::/7 1;
  fe80::/10 1;
}

geo $bom_alb_source $bom_cloudflare_peer {
  default 0;
  173.245.48.0/20 1;
  103.21.244.0/22 1;
  103.22.200.0/22 1;
  103.31.4.0/22 1;
  141.101.64.0/18 1;
  108.162.192.0/18 1;
  190.93.240.0/20 1;
  188.114.96.0/20 1;
  197.234.240.0/22 1;
  198.41.128.0/17 1;
  162.158.0.0/15 1;
  104.16.0.0/13 1;
  104.24.0.0/14 1;
  172.64.0.0/13 1;
  131.0.72.0/22 1;
  2400:cb00::/32 1;
  2606:4700::/32 1;
  2803:f800::/32 1;
  2405:b500::/32 1;
  2405:8100::/32 1;
  2a06:98c0::/29 1;
  2c0f:f248::/32 1;
}

map "$bom_private_peer:$bom_cloudflare_peer" $bom_ingress {
  default direct_ec2;
  "1:0" direct_alb;
  "1:1" cloudflare;
}

# This include is global to NPM. Emit the dedicated log only for the production
# content hosts, never for the NPM admin UI or unrelated proxy hosts.
map $host $bom_telemetry_enabled {
  default 0;
  ~(^|\.)bookofmormon\.online$ 1;
  ~(^|\.)libromormon\.es$ 1;
  ~(^|\.)livredemormon\.fr$ 1;
  ~(^|\.)buchmormon\.de$ 1;
  ~(^|\.)sachmacmon\.vn$ 1;
  ~(^|\.)mormonovaknjiga\.si$ 1;
  ~(^|\.)xn--289a67xla\.kr$ 1;
  ~(^|\.)xn--80aahtjpadfibw\.net$ 1;
}

# Deliberately excludes query strings, cookies, authorization, request bodies,
# and referrers. Raw addressing fields expire after seven days.
log_format bom_telemetry escape=json
  '{"timestamp":"$time_iso8601","cf_ray":"$http_cf_ray","host":"$host",'
  '"uri":"$uri","method":"$request_method","protocol":"$server_protocol",'
  '"status":"$status","upstream_status":"$upstream_status","bytes":"$body_bytes_sent",'
  '"request_time":"$request_time","upstream_connect_time":"$upstream_connect_time",'
  '"upstream_response_time":"$upstream_response_time","cache_status":"$upstream_cache_status",'
  '"render_mode":"$upstream_http_x_bom_render_mode","client_class":"$upstream_http_x_bom_client_class",'
  '"language":"$upstream_http_x_resolved_lang","user_agent":"$http_user_agent",'
  '"country":"$http_cf_ipcountry","ingress":"$bom_ingress","socket_peer":"$realip_remote_addr",'
  '"remote_addr":"$remote_addr",'
  '"alb_source":"$bom_alb_source","x_forwarded_for":"$http_x_forwarded_for",'
  '"cf_connecting_ip":"$http_cf_connecting_ip"}';
