# Feature-flag config. Hand-edited; scripts/gen-features.js compiles it to
# src/config/features.generated.json at build time (prestart/prebuild).
#
# All flags below are HONORED IN PRODUCTION BUILDS ONLY (NODE_ENV=production).
# In dev (npm start) and tests everything is shown regardless of these values.
# NOTE: one prod build serves both staging and prod, so STAGING ALSO applies
# these (accepted).

homeNav:      { hidden: false, seo: remove,  paths: [/home] }   # Discover is in the nav (2026-10-23); /home itself stays out of sitemaps
mattersNav:   { hidden: true, seo: remove,  paths: [/matters] }
historyNav:   { hidden: true, seo: noindex, paths: [/history] }
searchSeo:    { seo: noindex, paths: [/search] }
userSeo:      { seo: noindex, paths: [/user] }
passageNotes: { hidden: true }   # reader panel — no SSR/crawl surface; SSR ignores it

# Site root (/): first-time visitors (no login, nothing read yet) see Discover; everyone else sees Read. All envs.
frontDoor:    { firstVisitDiscover: true }
