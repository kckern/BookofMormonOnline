      <!-- Simple error detection for missing main bundle -->
      <script type="text/javascript">
        window.hasReloaded = false;
        
        // Only handle the specific case of main bundle syntax errors
        window.addEventListener('error', function(e) {
          if (window.hasReloaded) return;
          
          // Check if this is the main bundle syntax error (HTML served instead of JS)
          if (e.message && e.filename && 
              e.filename.includes('main.') && 
              e.filename.includes('.js') && 
              e.message.includes('Unexpected token')) {
            
            console.error('Main bundle returned HTML instead of JS, forcing cache refresh...');
            window.hasReloaded = true;
            
            // Clear all caches and force reload
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (let name of names) {
                  caches.delete(name);
                }
                window.location.reload(true);
              });
            } else {
              window.location.reload(true);
            }
          }
        });
      </script>

    <script type="text/javascript">
      const defaultTitle = "Book of Mormon Online";
      window.lastPath = window.location.pathname;
      window.titleObserver = new MutationObserver(function(mutations) {
        const newTitle = mutations[0].target.outerText.replace(/\s*[\|][^\|]+$/,'');
        if(window.lastTitle === newTitle) return false; 
        if(window.lastPath === window.location.pathname) return false;
        if(defaultTitle === newTitle) return false;
        if(/^http/.test(newTitle)) return false;
        const path = window.location.pathname;
        if(newTitle) {
          window.dispatchEvent(new CustomEvent('bom:analytics-pageview', {
            detail: { path: path, title: newTitle }
          }));
        }
        window.lastTitle = newTitle;
        window.lastPath = path;
      }).observe( document.querySelector('title'), { subtree: true, characterData: true, childList: true });

    </script>
