# HomeSampler — aggregate seeded random samples for the /home sampler page.
# New surface (post-legacy contract). Design: docs/plans/2026-07-15-home-sampler-redesign-design.md
# Adding a tile type: add a field here + a sampler fn in src/graphql/resolvers/homesampler.ts.
extend type Query {
  homesampler(seed: Int): HomeSampler
  mybookmark(token: String): Bookmark
}

type Bookmark {
  slug: String
  pageSlug: String
  pagetitle: String
  heading: String
  latest: Int
}

type HomeSampler {
  seed: Int
  people: [People]
  places: [Place]
  fax: Fax
  commentary: Commentary
  commentaries: [Commentary]
  contents: Division
  section: Section
  sectionNext: Section
  history: HistoricalDocument
  text: TextBlock
  faxPages: [FaxPageRef]
  faxMore: [Fax]
  art: [ArtImage]
  witnesses: [Witness]
  notes: [Commentary]
  peopleCount: Int
  placesCount: Int
}

type FaxPageRef {
  page: Int
  ref: String
}

type ArtImage {
  id: Int
  title: String
  artist: String
  width: Int
  height: Int
  ref: String
}

type Witness {
  slug: String
  witnessSlug: String
  principal: String
  statement: String
  source: String
}
