# HomeSampler — aggregate seeded random samples for the /home sampler page.
# New surface (post-legacy contract). Design: docs/plans/2026-07-15-home-sampler-redesign-design.md
# Adding a tile type: add a field here + a sampler fn in src/graphql/resolvers/homesampler.ts.
extend type Query {
  homesampler(seed: Int): HomeSampler
  mybookmark(token: String): Bookmark
}

type Bookmark {
  slug: String
  pageSlug: String
  pagetitle: String
  heading: String
  latest: Int
}

type HomeSampler {
  seed: Int
  people: [People]
  places: [Place]
  fax: Fax
  commentary: Commentary
  commentaries: [Commentary]
  contents: Division
  section: Section
  sectionNext: Section
  history: HistoricalDocument
  text: TextBlock
  faxPages: [FaxPageRef]
  faxMore: [Fax]
  art: [ArtImage]
  witnesses: [Witness]
  notes: [Commentary]
  faxVerse: FaxVersePage
  crossrefs: CrossRefSet
  relationship: Relationship
  mapstory: MapStorySample
  peopleCount: Int
  placesCount: Int
}

type CrossRefSet {
  srcRef: String
  srcVerseId: Int
  refs: [CrossRef]
}

type CrossRef {
  ref: String
  verseId: Int
}

type Relationship {
  hubType: String
  hubSlug: String
  hubName: String
  hubTitle: String
  edges: [RelEdge]
}

type RelEdge {
  rel: String
  dstType: String
  dstSlug: String
  dstName: String
  dstTitle: String
  note: String
  ref: String
}

type MapStorySample {
  slug: String
  title: String
  description: String
  moves: [MapMoveSample]
}

type MapMoveSample {
  seq: Int
  start: String
  end: String
  # Display names from bom_places.name — the slugs above stay as image keys.
  startName: String
  endName: String
  travelers: String
  people: [MoveTraveler]
  description: String
  duration: String
  ref: String
  startLat: Float
  startLng: Float
  endLat: Float
  endLng: Float
}

type MoveTraveler {
  slug: String
  name: String
}

type FaxEdition {
  version: String!
  title: String
  page: Int!
}

type FaxVersePage {
  version: String
  title: String
  format: String
  page: Int
  verseId: Int
  ref: String
  selector: String
  editions: [FaxEdition!]!
}

type FaxPageRef {
  page: Int
  ref: String
}

type ArtImage {
  id: Int
  title: String
  artist: String
  width: Int
  height: Int
  ref: String
}

type Witness {
  slug: String
  witnessSlug: String
  principal: String
  moneyQuote: String
  speaker: String
  isWitnessVoice: Boolean
  source: String
}
