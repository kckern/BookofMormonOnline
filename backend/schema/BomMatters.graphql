extend type Query {
  matter(slug: [String]): [Matter]
}

type Matter {
  guid: String
  slug: String
  name: String
  subtitle: String
  category: String
  kind: String
  specificity: String
  usage: String
  era: String
  provenance: String
  status: String
  aliases: String
  tags: String
  node_link: String
  description: String
  verse_id: Int
  weight: Int
  index: [Index]
  xrels: [Xrel]
}

type Xrel {
  rel: String
  srcweight: Int
  dst_type: String
  dst_slug: String
  dst_name: String
  dst_title: String
  note: String
  verse_id: Int
  """
  'src' when this entity is the row's source (matter popups),
  'dst' when the row points AT this entity and dst_* carry the other party
  (people/place popups) — render name-before-verb for 'dst'.
  """
  direction: String
}
