extend type Query {
  labels: [Label]
  menu(slug: [String]): [Menu]
  books(seed: String): [Book]
  search(query: String): [SearchResult]
  shortlink(hash: [String]): Shortlinks
  markdown(slug: [String]): [Markdown]
  scripture(ref: String, verse_ids: [Int], version: String): ScriptureResults
  verses(verse_ids: [Int]): [Scripture]
  versehighlights(verse_pairs: [[Int]]): [ScriptureHighlights]
}

extend type Mutation {
  shortlink(string: String): Shortlinks
  # Analytics pageview beacon (replaces the legacy POST /ping Clicky forwarder).
  # `data` is the base64 query-string payload the stats.js beacon builds.
  ping(data: String): Boolean
}

type Label {
  key: String
  val: String
}

type ScriptureResults {
  ref: String
  passages: [Passage]
  verses: [Scripture]
}

type Passage {
  reference: String
  heading: String
  meta: [SectionMeta]
  verses: [Scripture]
}

type Scripture {
  verse_id: Int
  heading: String
  reference: String
  version: String
  book: String
  chapter: Int
  verse: Int
  text: String
}

type ScriptureHighlights {
  bom_verse_id: Int
  bible_verse_id: Int
  bom_highlight: [String]
  bible_highlight: [String]
  isQuote: Boolean
}

type SearchResult {
  reference: String
  text: String
  section: String
  page: String
  narration: String
  slug: String
  speaker: String
  voice: String
  lang: String
}

type Markdown {
  slug: String
  markdown: String
}

type Shortlinks {
  hash: String
  string: String
}

type Menu {
  label: String
  link: String
}

type Book {
  book: String
  chapters: [Int]
}
