                        notes:
                          - id: '1496119301'
                            text: This was the sign foretold by Samuel at Hel 14.3–4. According to Samuel, the extraordinary illumination would be the effect of “great lights in heaven,” though further details are not provided here. It is somewhat surprising that the BoM never cites Zech 14.7 as a prooftext for this event. Alternatively, Jer 33.19–22 could have been alluded to as an indication of the end of God’s covenants with the house of David and the Levitical priests; see 3 Nephi 1:24 below.
