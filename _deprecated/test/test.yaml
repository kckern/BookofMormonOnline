                      description: After some controversy, {Helaman|helaman3}, the son of {Helaman|helaman2}, is chosen as chief judge of [Zarahemla|zarahemla].
                      text:
                        guid: 4becc78226152
                        slug: gadianton/1
                        heading: Helaman 2:1–2
                        content: <p>And it came to pass in the forty and second year of the reign of the judges, after Moronihah had established again peace between the Nephites and the Lamanites, [c]1448416501[/c] behold there was no one to fill the judgment–seat; therefore there began to be a contention [c]1448416502[/c] again among the people concerning who should fill the judgment–seat. [c]1448417103[/c] [c]1448404601[/c] [c]1448404101[/c] And it came to pass that Helaman, who was the son of Helaman, [c]1448518101[/c] [c]1448417102[/c] [c]1448405301[/c] [c]1448513101[/c] was appointed to fill the judgment–seat, [c]1448404801[/c] [c]1448411101[/c] [c]1448512101[/c] [c]1448504601[/c] by the voice of the people. [i]3301[/i] [c]1448504101[/c] </p>
                        chrono: roj|42
