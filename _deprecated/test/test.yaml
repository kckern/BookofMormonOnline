                            text: As is typical in the BoM, Nephite dissenters stir up the Lamanites to violence, though in this case it is a small group of Lamanites who prey upon their own people as well as the Nephites.
                          - id: '1479419302'
                            title: “Taken upon themselves the name of Lamanites”
                            text: By this point in the BoM, the division between Nephites and Lamanites has started to become more a matter of politics, culture, and religion than of genealogy; cf. 3 Ne 2.12–16.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: These guerillas assume the identity of {Gadianton|gadianton} robbers, and pose a large problem for the {Nephites|nephites}.
                      text:
                        guid: 4becc78231875
                        slug: gadianton/92
                        heading: Helaman 11:26–27
                        content: <p>And thus in time, yea, even in the space of not many years, they became an exceedingly great band of robbers; [c]1479404801[/c] and they did search out all the secret plans of Gadianton; and thus they became robbers of Gadianton. [c]1479404601[/c] Now behold, these robbers did make great havoc, yea, even great destruction among the people of Nephi, [c]1479704601[/c] [c]1479704101[/c] and also among the people of the Lamanites. [i]1774[/i]</p>
