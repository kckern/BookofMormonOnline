                  - weight: 5
                    type: 'N'
                    narration:
                      description: '{Nephi|nephi2} and {Lehi|lehi4}, keeping the faith, go on a preaching circuit, beginning in [Bountiful|city-of-bountiful], and going through [Gid|gid], [Mulek|mulek], and even into the territories within [Zarahemla|land-of-zarahemla] occupied by {Lamanites|lamanites}.'
                      text:
                        guid: 4becc7822b7a5
                        slug: gadianton/46
                        heading: Helaman 5:14–16
                        content: <p>And they did remember his words; [c]1457407201[/c] and therefore they went forth, [c]1457407202[/c] keeping the commandments of God, to teach the word of God among all the people of Nephi, [c]1457404101[/c] beginning at the city Bountiful; [c]1457404801[/c] [c]1457417102[/c] [c]1457413101[/c] And from thenceforth to the city of Gid; and from the city of Gid to the city [c]1457516501[/c] of Mulek; [c]1457504601[/c] [c]1457413102[/c] </p> <p>And even from one city to another, [c]1457604601[/c] [c]1457504101[/c] [c]1457311101[/c] until they had gone forth among all the people of Nephi who were in the land southward; and from thence into the land of Zarahemla, [c]1457604101[/c] among the Lamanites.</p>
