                            name: Lamanites
                            title: Descendant of Laman1, later any person who rejects the gospel
                          - slug: nephites
                            name: Nephites
                            title: Descendants of Nephi1 and his followers, later any person who accepts gospel
                        places: []
                        refs:
                          - verse_id: 35938
                            ref: hel 13:1
                            type: xref
                            significant: 0
                        notes:
                          - id: '1461319201'
                            title: “the sixty and second year of the reign of the judges had ended”
                            text: −30 years; see Hel 4.18
                          - id: '1461319301'
                            text: The majority of Lamanites have now become more righteous than the Nephites.
                          - id: '1461319302'
                            title: “Become…a righteous people”
                            text: Similar phrasing is consistently used to describe Lamanite conversions; see Alma 19.35;23.7;25.14.
                          - id: '1461319303'
                            title: “Because of their firmness and their steadiness in the faith”
                            text: It was difficult to convert the Lamanites, but once they had turned to God their faithfulness was legendary, as with the Anti-Nephi-Lehies; see Alma 23.6;24.19;3 Ne 6.14. This theme will be taken up at length by Samuel in ch. 15. Note that variants of the phrase “firm and steadfast,” which was part of Lehi’s hope for Lemuel at 1 Ne 2.10, are applied to faithful Lamanites here and also at Hel 15.8, 10; 3 Ne 6.14.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: Many {Nephites|nephites} abandon their faith, yet the church continues to grow because of the continuous flow of {Lamanite|lamanites} converts.
                      text:
                        guid: 4becc7822e987
                        slug: gadianton/71
                        heading: Helaman 6:2–3
                        content: <p>For behold, there were many of the Nephites who had become hardened and impenitent and grossly wicked, [i]3319[/i] [c]1461404101[/c] insomuch that they did reject the word of God and all the preaching and prophesying which did come among them. [c]1461416501[/c] </p> <p>Nevertheless, the people of the church did have great joy because of the conversion of the Lamanites, [c]1461304801[/c] [c]1461517101[/c] [c]1461311101[/c] [c]1461306401[/c] yea, because of the church of God, which had been established among them. [c]1461317102[/c] [c]1461516501[/c] And they did fellowship one with another and did rejoice one with another, [c]1461511101[/c] [c]1461504101[/c] and did have great joy. [c]1461404601[/c] [c]1461512101[/c] </p>
                        duration: 31
                        quotes: []
                        people:
