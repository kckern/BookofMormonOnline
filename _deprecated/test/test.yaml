                      text:
                        guid: 4becc78230dd7
                        slug: gadianton/88
                        heading: Helaman 6:32–33
                        content: <p>And it came to pass that all these iniquities did come unto them in the space of not many years, [c]1464404101[/c] [c]1464407201[/c] insomuch that a more part of it had come unto them in the sixty and seventh year of the reign of the judges over the people of Nephi. [c]1464416501[/c]</p> <p>And they did grow in their iniquities in the sixty and eighth year also, to the great sorrow and lamentation of the righteous. [c]1464311101[/c] [c]1464404601[/c] </p>
