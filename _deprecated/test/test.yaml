                            title: “Frustrated”
                            text: 'WB: “rendered vain or null.”'
                          - id: '1496319301'
                            text: As prophesied at Hel 14.7.
                  - weight: 3
                    type: 'N'
                    narration:
                      description: The whole night passes without any darkness, and a new star appears, all according to prophecy.
                      text:
                        guid: 4becc7823521e
                        slug: gadianton/118
                        heading: 3 Nephi 1:19–21
                        content: <p>And it came to pass that there was no darkness in all that night, [c]1496504801[/c] [i]2995[/i] but it was as light as though it was mid–day. [c]1496513102[/c] And it came to pass that the sun did rise in the morning again, according to its proper order; [c]1496104801[/c] [i]1799[/i] and they knew that it was the day that the Lord should be born, [c]1496513101[/c] because of the sign which had been given. [c]1496518101[/c] And it had come to pass, yea, all things, every whit, according to the words of the prophets. [c]1496717101[/c] And it came to pass also that a new star did appear, [v]38[/v] [i]1215[/i] [i]2997[/i] [i]3345[/i] [i]1800[/i] [c]1496611101[/c] [c]1496504601[/c] [c]1496712101[/c] [c]1496713101[/c] according to the word. [c]1496504101[/c] </p>
