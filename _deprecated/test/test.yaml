                          - id: '1497419301'
                            text: Both the Nephites and Lamanites are losing people who defect to the robbers.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: Some {Lamanites|lamanites} also dissent and join the {Gadianton band|gadianton-robbers}.
                      text:
                        guid: 4becc78235b59
                        slug: gadianton/122
                        heading: 3 Nephi 1:29–30
                        content: <p>And there was also a cause of much sorrow among the Lamanites; [c]1497504101[/c] [c]1497607201[/c] for behold, they had many children who did grow up and began to wax strong in years, [c]1497512101[/c] that they became for themselves, [c]1497518101[/c] [c]1497516501[/c] [c]1497612101[/c] and were led away by some who were Zoramites, by their lyings and their flattering words, to join those Gadianton robbers. [c]1497404801[/c] [c]1497516502[/c] [c]1497416501[/c] And thus were the Lamanites afflicted also, [c]1497607203[/c] and began to decrease as to their faith and righteousness, [c]1497616501[/c] because of the wickedness of the rising generation. [c]1497618101[/c] [c]1496808201[/c] [c]1497504601[/c] [c]1497501201[/c] [c]1497607202[/c] </p>
