                  - weight: 10
                    type: 'N'
                    narration:
                      description: The non-believers, angry that they cannot hit {Samuel|samuel}, declare that he is possessed by the {devil|satan}, and order that he be apprehended.
                      text:
                        guid: 4becc7823329f
                        slug: gadianton/104
                        heading: Helaman 16:6
                        content: <p>But the more part of them did not believe in the words of Samuel; [c]1492712101[/c] therefore when they saw that they could not hit him with their stones and their arrows, they cried unto their captains, saying:</p> <blockquote><p>“Take this fellow and bind him, for behold he hath a devil; [c]1492718101[/c] [c]1492704101[/c] [c]1492704601[/c] and because of the power of the devil which is in him we cannot hit him with our stones and our arrows; [c]1492705301[/c] therefore take him and bind him, and away with him.”</p> </blockquote>
