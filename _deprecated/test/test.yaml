                        refs: []
                        notes:
                          - id: '1454319301'
                            text: Once again we see, in the space of two verses, major historical developments that would have been covered over the course of many chapters in the book of Alma.
                          - id: '1454419301'
                            text: <i>“Regaining half their possessions”</i> in a single year is remarkable.
              - title: Nephite Losses and Victories
                slug: gadianton/nephite-losses-and-victories
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: The {Nephite|nephites} losses were a result of {Nephite|nephites} pride, selfishness, and boasting.
                      text:
                        guid: 4becc78229e5e
                        slug: gadianton/29
                        heading: Helaman 4:11–13
                        content: <p>Now this great loss of the Nephites, and the great slaughter which was among them, [c]1454505301[/c] [c]1454608201[/c] would not have happened had it not been for their wickedness and their abomination which was among them; [c]1454618101[/c] [c]1454516501[/c] [c]1454604601[/c] [c]1454604101[/c] [c]1454512101[/c] yea, and it was among those also who professed to belong to the church of God. [c]1454504801[/c] [c]1454512102[/c] </p> <p>And it was because of the pride of their hearts, [c]1454607201[/c] [c]1454503101[/c] [c]1454505302[/c] because of their exceeding riches, [c]1454518101[/c] [c]1454612101[/c] yea, it was because of their oppression to the poor, [c]1454505303[/c] [c]1454612102[/c] withholding their food from the hungry, [c]1454505306[/c] withholding their clothing from the naked, and smiting their humble brethren upon the [c]1454616501[/c] cheek, making a mock of that which was sacred, [c]1454505304[/c] [c]1454612103[/c] denying the spirit of prophecy and of revelation, [c]1454612104[/c] [c]1454504601[/c] [c]1454505305[/c] murdering, plundering, lying, stealing, committing adultery, [c]1454505308[/c] rising up in great contentions, [c]1454616502[/c] [c]1454505309[/c] and deserting away into the land of Nephi, among the Lamanites— [c]1454616503[/c]</p> <p>And because of this their great wickedness, and their boastings in their own strength, [c]1454718101[/c] [c]1454505307[/c] they were left in their own strength; [c]1454704601[/c] [c]1454704101[/c] [c]1454713101[/c] [c]1454505310[/c] [c]1454712101[/c] therefore they did not prosper, [c]1454504101[/c] but were afflicted and smitten, and driven before the Lamanites, until they had lost possession of almost all their lands. [c]1454617101[/c]</p>
