                            type: xref
                            significant: 0
                        notes: []
                  - weight: 6
                    type: 'N'
                    narration:
                      description: A horrific battle ensues, many people die, but the {Nephites|nephites} are ultimately victorious.
                      text:
                        guid: 4becc7823923f
                        slug: gadianton/152
                        heading: 3 Nephi 4:11–12
                        content: <p>And the battle commenced in this the sixth month; and great and terrible was the battle thereof, [c]1503218101[/c] yea, great and terrible was the slaughter thereof, insomuch that there never was known so great a slaughter among all the people of Lehi since he left Jerusalem. [c]1503104101[/c] And notwithstanding the threatenings and the oaths which Giddianhi had made, behold, the Nephites did beat them, insomuch that they did fall back [c]1503316501[/c] from before them.</p>
                        duration: 26
                        quotes: []
                        people:
                          - slug: nephites
                            name: Nephites
                            title: Descendants of Nephi1 and his followers, later any person who accepts gospel
                        places:
                          - slug: jerusalem-1
                            name: Jerusalem1
                            info: Capital of the kingdom of Judah
                        refs: []
                        notes: []
                  - weight: 7
                    type: 'N'
                    narration:
                      description: '{Gidgiddoni|gidgiddoni} and the robbers are chased out to the borders of the land; {Giddianhi|giddianhi}, tired from the fight, loses ground, and is killed.'
                      text:
                        guid: 4becc78239446
                        slug: gadianton/153
                        heading: 3 Nephi 4:13–14
                        content: <p>And it came to pass that Gidgiddoni commanded that his armies should pursue them as far as [c]1503416501[/c] the borders of the wilderness, and that they should not spare any that should fall into their hands by the way; and thus they did pursue them and did slay them, [c]1503404601[/c] to the borders of the wilderness, even until they had fulfilled the commandment of Gidgiddoni. [c]1503204801[/c] [c]1503211101[/c] And it came to pass that Giddianhi, who had stood and fought with boldness, was pursued as he fled; and being weary because of his much fighting he was overtaken and slain. And thus was the end of Giddianhi the robber. [i]3364[/i] [c]1503404101[/c] </p>
                        duration: 35
                        quotes: []
                        people:
                          - slug: giddianhi
                            name: Giddianhi
                            title: Chief of Gadianton robbers
                          - slug: gidgiddoni
                            name: Gidgiddoni
                            title: Nephite commander, prophet
                        places: []
