                      text:
                        guid: 4becc78231c9a
                        slug: gadianton/94
                        heading: Helaman 11:32–35
                        content: <p>And the robbers did still increase and wax strong, [c]1480404601[/c] [c]1480204101[/c] insomuch that they did defy the whole armies of the Nephites, and also of the Lamanites; [c]1479418101[/c] [c]1480216501[/c] and they did cause great fear to come unto the people upon all the face of the land.</p> <p>Yea, for they did visit many parts of the land, and did do great destruction unto them; [c]1479704801[/c] yea, did kill many, and did carry away others captive into the wilderness, [c]1480204601[/c] yea, and more especially their women and their children. [i]3332[/i] [c]1479911101[/c] Now this great evil, which came unto the people because of their iniquity, [c]1480416502[/c] did stir them up again in remembrance of the Lord their God. [c]1480416501[/c] [c]1480404101[/c] And thus ended the eighty and first year of the reign of the judges.</p>
