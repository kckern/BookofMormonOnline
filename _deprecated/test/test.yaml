                        notes:
                          - id: '1461619301'
                            text: In a reversal of roles, Lamanite missionaries now attempt to bring Nephites to the truth. Zarahemla had recently been given back to the Nephites (Helaman 5.52).
                          - id: '1461719301'
                            title: “Many did preach with exceedingly great power and authority”
                            text: As Nephi and Lehi had at Helaman 5.18.
                  - weight: 4
                    type: 'N'
                    narration:
                      description: '{Nephi|nephi2} and {Lehi|lehi4} go to the northern lands to preach.'
                      text:
                        guid: 4becc7822ed60
                        slug: gadianton/73
                        heading: Helaman 6:6
                        content: <p>And it came to pass that many of the Lamanites did go into the land northward; [c]1461804101[/c] and also Nephi and Lehi went into the land northward, to preach unto the people. [c]1461804601[/c] And thus ended the sixty and third year.</p>
