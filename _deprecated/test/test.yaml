                    narration:
                      description: Consequently, the {Nephites|nephites} morally deteriorate, and turn their attention to riches.
                      text:
                        guid: 4becc78230bea
                        slug: gadianton/87
                        heading: Helaman 6:31
                        content: <p>And now behold, he had got great hold upon the hearts of the Nephites; [c]1464004801[/c] [c]1464304601[/c] [c]1464304101[/c] [c]1464307201[/c] yea, insomuch that they had become exceedingly wicked; yea, the more part of them had turned out of the way of righteousness, and did trample under their feet the commandments of God, and did turn unto their own ways, and did build up unto themselves idols of [c]1464316501[/c] their gold and their silver.</p>
