                        notes:
                          - id: '1512619301'
                            title: “Repentance and remission of sins through faith”
                            text: Here remission of sins comes before baptism (see 3 Nephi 7:23–25;Hel 14.13); in other passages it comes afterward (3 Ne 30.2), especially in conjunction with baptism by fire and the Holy Ghost (2 Ne 31.17; 3 Ne 12.2), or fulfilling God’s commandments (Moro 8.11, 25).
                          - id: '1512719301'
                            title: “A part of them would not suffice”
                            text: It is perhaps disappointing that Mormon does not reveal more about Nephi<sub >3</sub>’s ministry, since he is portrayed as an extraordinary miracle worker with daily access to angels.
                          - id: '1512719302'
                            title: “With power and with great authority”
                            text: Nephi<sub >3</sub>, along with the rest of the twelve disciples Jesus calls, will receive additional power and authority at 3 Nephi 12.1.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: Despite the people’s anger with him, {Nephi|nephi3} preaches and ministers with power and authority; {his brother|timothy} dies, but he raises him from the dead in the name of {Jesus|jesus-christ}.
                      text:
                        guid: 4becc7823d581
                        slug: gadianton/183
                        heading: 3 Nephi 7:18–20
                        content: <p>And it came to pass that they were angry with him, even because he had greater power than they, [c]1512802701[/c] [c]1512704101[/c] for it were not possible that they could disbelieve his words, [c]1512805401[/c] for so great was his faith on the Lord Jesus Christ that angels did minister unto him daily. [c]1512918101[/c] [c]1512803101[/c] [c]1512807201[/c] [c]1512809101[/c] And in the name of Jesus did he cast out devils and unclean spirits; [c]1512717101[/c] [c]1512912101[/c] and even his brother did he raise from the dead, [c]1513018101[/c] [c]1512905401[/c] [c]1512904101[/c] after he had been stoned and suffered death by the people. [i]3382[/i] And the people saw it, and did witness of it, and were angry with him because of his power; [c]1513005401[/c] and he did also do many more miracles, [c]1512811101[/c] [c]1512904601[/c] in the sight of the people, in the name of Jesus. </p>
                        duration: 37
                        quotes: []
                        people:
