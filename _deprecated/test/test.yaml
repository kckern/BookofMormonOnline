                        slug: gadianton/20
                        heading: Helaman 3:31–32
                        content: <p>And in this year there was continual rejoicing [c]1451401101[/c] in the land of Zarahemla, [c]1452816501[/c] and in all the regions round about, even in all the land which was possessed by the Nephites. [c]1452813101[/c] And it came to pass that there was peace and exceedingly great joy in the remainder of the forty and ninth year; yea, and also there was continual peace and great joy in the fiftieth year of the reign of the judges. [c]1452916501[/c] [c]1452411101[/c] [c]1452804101[/c] </p>
