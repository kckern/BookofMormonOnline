                      description: The {Nephite|nephites} civilization continues to grow and develop, but faces some problems with pride.
                      text:
                        guid: 4becc78227329
                        slug: gadianton/9
                        heading: Helaman 3:1–2
                        content: <p>And now it came to pass in the forty and third year of the reign of the judges, there was no contention among the people of Nephi save it were a little pride which was in the church, which did cause some little [c]1449816501[/c] dissensions among the people, which affairs were settled in the ending of the forty and third year. And there was no contention among the people in the forty and fourth year; [c]1449804601[/c] [c]1449804101[/c] neither was there much contention in the forty and fifth year. [c]1449804801[/c] [c]1449811101[/c] [c]1449805301[/c] </p>
