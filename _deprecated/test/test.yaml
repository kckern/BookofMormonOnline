                            title: “who”
                            text: '&#119979; <em>which</em>; 1837 who [The earlier reading suggests that it was “faith in Christ” that was taught.]'
                          - id: '1460119202'
                            text: The people in the prison must have been Zoramites<sup>2</sup>; see Alma 31.6–7 (cf. Hel 5.27).
                          - id: '1460119301'
                            text: Given the fact that they had been taught by Alma, Amulek, and Zeezrom, the Nephite dissenters in the prison (Helaman 5:27) must have been Zoramites, since that mission was the only time the three preached together, some 45 years prior; see Alma 31.6–7. Echoes of that episode can be found in the question <i>what shall we do</i> (see Alma 32.5,9) and the advice to <i>cry unto</i> the voice (repeated six times in Alma 34.18–25).
