                  - weight: 2
                    type: 'N'
                    narration:
                      description: The church again begins to disintegrate, and only a select few remain faithful.
                      text:
                        guid: 4becc7823b3cf
                        slug: gadianton/168
                        heading: 3 Nephi 6:14
                        content: <p>And thus there became a great [c]1509416501[/c] inequality in all the land, [c]1509407201[/c] [c]1509404601[/c] [c]1509404101[/c] insomuch that the church began to be broken up; [c]1509304801[/c] [c]1509403101[/c] [c]1509402701[/c] [c]1509407202[/c] yea, insomuch that in the thirtieth year the church was broken up in all the land save it were among a few of the Lamanites who were converted unto the true faith; and they would not depart from it, for they were firm, and steadfast, and immovable, willing with all diligence to keep the [c]1509416502[/c] commandments of the Lord. [c]1509411101[/c] [c]1509405401[/c] </p>
                        duration: 26
                        quotes: []
                        people:
                          - slug: lamanites
                            name: Lamanites
                            title: Descendant of Laman1, later any person who rejects the gospel
                        places: []
                        refs:
                          - verse_id: 29806
                            ref: 1tim 6:17
                            type: xref
                            significant: -1
                          - verse_id: 35649
                            ref: hel 4:12
                            type: xref
                            significant: -1
                          - verse_id: 36015
                            ref: hel 15:8
                            type: xref
                            significant: 0
                        notes:
                          - id: '1509419301'
                            text: The Nephite church has gone from overwhelming strength (implied at 3 Nephi 5.1–3) to near dissolution in just eight years, with <i>inequality</i> as the primary cause. (The collapse of the government will quickly follow.) The faithfulness of converted Lamanites, perhaps including those mentioned in 3 Nephi 6:3, is a motif in the BoM (see Alma 23.6n), which is regularly ascribed to their being <i>steadfast and immovable</i> (see Hel 6.1n). The combination <i>firm</i>, <i>steadfast</i>, and <i>immovable</i> occurs only here and 1 Ne 2.10, in Lehi’s wish for his son Lemuel.
                  - weight: 3
                    type: 'N'
                    narration:
                      description: '{Satan|satan} is the cause of the {Nephite|nephites} moral decay.'
                      text:
                        guid: 4becc7823b5c7
                        slug: gadianton/169
                        heading: 3 Nephi 6:15–16
                        content: <p>Now the cause of this iniquity of the people was this—Satan had great power, [c]1509512101[/c] [c]1509604101[/c] unto the stirring up of the people to do all manner of iniquity, [c]1509502701[/c] and to the puffing them up with pride, tempting them to seek for power, and authority, and riches, and the vain things of the world. [c]1509516501[/c] [c]1509003101[/c] [c]1509504601[/c] [c]1509504101[/c] And thus Satan did lead away the hearts of the people to do all manner of iniquity; [c]1509518101[/c] [c]1509604601[/c] therefore they had enjoyed peace but a few years. [c]1509616501[/c] [c]1509607201[/c] [c]1509009101[/c] </p>
                        duration: 25
                        quotes: []
