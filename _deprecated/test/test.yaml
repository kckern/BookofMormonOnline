                        notes:
                          - id: '1498819301'
                            title: “Compelled…to take up arms”
                            text: It is not clear whether the compulsion came from the dire circumstances or from the Nephites, but in either case this marks the end of the pacifism that characterized the Anti-Nephi-Lehite converts and their spiritual followers (Alma 24.5–27; Hel 5.51; 15.9).
                          - id: '1499019301'
                            text: After taking up weapons (in contrast to Alma 53.14–15), these Lamanite converts will become indistinguishable from the Nephites. Once again, lighter skin color is associated with righteousness, or at least with the religious heritage of the Nephites—since the Nephites themselves have not always been righteous; cf. 3 Nephi 2:18. The fact that the transformation seems more pronounced among their children suggests that intermarriage was a factor in ethnic assimilation.
                          - id: '1499019302'
                            title: “Their curse”
                            text: See 2 Ne 5.21–23;Alma 3.6–10.
                          - id: '1499205401'
                            title: “And Were Called Nephites”
                            text: <p>Were called Nephites] See Jacob 1:14.</p>
                          - id: '1499219201'
                            title: “And thus ended the thirteenth year”
                            text: +13 years; see v. 11 above
                  - weight: 3
                    type: 'N'
                    narration:
