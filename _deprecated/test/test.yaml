              - title: Zemnarihah and the Gadianton Demise
                slug: gadianton/zemnarihah-and-the-gadianton-demise
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: A few years pass, and the {Gadianton robbers|gadianton-robbers} appoint a new leader, {Zemnarihah|zemnarihah}, who leads his people to the {Nephites|nephites}, surrounds their city, and plans to cut them off from all outside resources.
                      text:
                        guid: 4becc7823971e
                        slug: gadianton/154
                        heading: 3 Nephi 4:15–17
                        content: <p>And it came to pass that the armies of the Nephites did return again to their place of security. And it came to pass that this nineteenth year did pass away, and the robbers did not come again to battle; neither did they come [c]1503616501[/c] again in the twentieth year.</p> <p>And in the twenty and first year they did not come up to battle, but they came up on all sides to lay siege round about the people of Nephi; [c]1503604801[/c] [c]1503616502[/c] [c]1503713101[/c] [c]1503604601[/c] [c]1503604101[/c] [c]1503602701[/c] for they did suppose that if they should cut off the people of Nephi from their lands, and should hem them in on every side, and if they should cut them off from all their outward privileges, that they could cause them to yield themselves [c]1503716502[/c] up according to their wishes. [c]1503716501[/c] [c]1503511101[/c] Now they had appointed unto themselves another leader, whose name was Zemnarihah; therefore it was Zemnarihah that did cause that this siege should take place.</p>
                        duration: 47
                        quotes: []
                        people:
