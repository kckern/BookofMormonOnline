                  - weight: 3
                    type: 'N'
                    narration:
                      description: The church is decaying, and the {Lord|god} is no longer protecting the {Nephites|nephites} like he had previously—thus, the {Nephites|nephites} are no better off than the {Lamanites|lamanites}.
                      text:
                        guid: 4becc7822a6f1
                        slug: gadianton/33
                        heading: Helaman 4:23–26
                        content: <p>And because of their iniquity the church had begun to dwindle; [c]1456008201[/c] and they began to disbelieve in the spirit of prophecy and in the spirit of revelation; [c]1455705301[/c] and the judgments of God did stare them in the face. </p> <p>And they saw that they had become [c]1455816502[/c] weak, [c]1455511101[/c] like unto their brethren, the Lamanites, and that the Spirit of the Lord did no more preserve them; yea, it had withdrawn from them because the Spirit of the Lord doth not dwell in unholy temples— [c]1455807201[/c] </p> <p>Therefore the Lord did cease to preserve them by his miraculous and matchless power, [c]1455718101[/c] [c]1455504801[/c] for they had fallen into a state of unbelief and awful wickedness; [c]1455706401[/c] and they saw that the Lamanites were [c]1455916501[/c] exceedingly more numerous than they, and except they should cleave unto the Lord their God, they must unavoidably perish. [c]1455907201[/c] </p> <p>For behold, they saw that the strength of the Lamanites was as great as their strength, [c]1455907202[/c] even man for man. [c]1455818101[/c] And thus had they fallen into this great transgression; yea, thus had they become weak, [c]1455805301[/c] because of their transgression, [c]1455808201[/c] in the space of not many years. [c]1455811101[/c] [c]1455907203[/c] </p>
                        duration: 67
                        quotes: []
                        people:
