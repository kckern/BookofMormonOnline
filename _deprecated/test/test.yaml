                      text:
                        guid: 4becc7822ca41
                        slug: gadianton/55
                        heading: Helaman 5:30–31
                        content: <p>And it came to pass when they heard this voice, [c]1458911101[/c] [c]1458904101[/c] and beheld that it was not a voice of thunder, [c]1458904601[/c] neither was it a voice of a great tumultuous noise, but behold, it was a still voice of perfect mildness, [c]1459016501[/c] [c]1459005301[/c] as if it had been a whisper, and it did pierce even to the very soul— [c]1459018101[/c] [i]1758[/i] And notwithstanding the mildness of the voice, behold the earth shook exceedingly, [c]1459104101[/c] and the walls of the prison trembled again, as if it were about to tumble to the earth; and behold the cloud of darkness, which had overshadowed them, did not disperse— [c]1459009101[/c] </p>
