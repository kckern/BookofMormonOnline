                            text: In contrast to the OT, references to worshiping idols are relatively uncommon in the BoM. The combination <i>turned out of the way…</i>[against] <i>the commandments of God…build up unto themselves idols of their gold</i> is an allusion to the incident of the golden calf at Ex 32.8; cf. Deut 9.12 (both verses include “turned aside quickly out of the way”; the BoM adds “out of the way <i>of righteousness</i>”).
                          - id: '1464319302'
                            title: “Turn unto their own ways”
                            text: Isa 53.6.
                  - weight: 6
