                            title: “The forty and sixth year of the reign of the judges ended”
                            text: −46 years; see v. 3 above
                          - id: '1451519301'
                            text: As is typical in Hel, the narrator provides few details about the causes of this <i>great contention</i>, which lasted for three years.
                          - id: '1451619203'
                            text: Or <span class="footnote-reference3">[17]</span> <em>Therefore, what I have spoken had passed. After there had been great contentions, and disturbances, and wars, and dissensions among the people of Nephi, </em><span class="verse-number-in-notes">18</span><em> the forty and sixth year of the reign of the judges ended. </em><span class="verse-number-in-notes">19</span><em> And it came to pass</em>
                          - id: '1451719301'
                            title: “Equity”
                            text: Impartiality. The combination of <i>statutes</i> and <i>judgments</i>, and <i>commandments</i> is a characteristic expression of Deut, where it appears seven times; it also occurs seven times in the BoM. The pairing of <i>statutes</i> and <i>commandments</i> is even more common in Deut and the Deuteronomistic History, as is the phrase <i>do that which was right in the sight of God/the Lord</i>.
                          - id: '1451719302'
                            text: <i>“Walk after the ways of his father”</i> is a trope describing hereditary rulers in Kings and Chr; it is unexpected here since Helaman’s father was not a chief judge.
