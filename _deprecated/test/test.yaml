                      text:
                        guid: 4becc78232166
                        slug: gadianton/96
                        heading: Helaman 13:1
                        content: <p>And now it came to pass in the eighty and sixth year, [c]1483517106[/c] [i]3333[/i] the Nephites did still remain in wickedness, [i]2977[/i] yea in great wickedness, while the Lamanites did observe strictly to keep the commandments of God, [c]1483516501[/c] [i]1775[/i] [c]1483504601[/c] [c]1483504101[/c] according to the law of Moses. [i]2978[/i] [c]1483511101[/c] </p>
