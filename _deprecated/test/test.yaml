                          - id: '1502819301'
                            title: “Skin about their loins”
                            text: and <i>heads were shorn” The appearance of the robbers echoes descriptions of Lamanite warriors at Enos 1.20; Alma 3.5.
                          - id: '1502819302'
                            title: “Lamb-skin”
                            text: Unique here; one wonders about the origins of these garments if the robbers did not have flocks or herds.
                  - weight: 5
                    type: 'N'
                    narration:
                      description: '{Giddianhi|giddianhi}’s troops see the {Nephites|nephites} fall to the ground, and begin to cheer, thinking that they are surrendering; but when they fully approach, the {Nephites|nephites} are ready for them.'
                      text:
                        guid: 4becc78239029
                        slug: gadianton/151
                        heading: 3 Nephi 4:9–10
                        content: <p>And it came to pass that when the armies of Giddianhi saw this they began to shout with a loud voice, because of their joy, for they had supposed that the Nephites had fallen with fear because of the terror of their armies. [c]1503118101[/c] </p> <p>But in this thing they were disappointed, for the Nephites did not fear them; [c]1502904801[/c] [i]3363[/i] but they did fear their God and did supplicate him for protection; [c]1503101201[/c] [c]1503112101[/c] [c]1503107202[/c] therefore, when the armies of Giddianhi did rush upon them they were prepared to meet them; [c]1503104601[/c] yea, in the strength of the Lord they did receive them. [c]1503011101[/c] [c]1503107201[/c] </p>
                        duration: 32
                        quotes: []
