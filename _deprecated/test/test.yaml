                      text:
                        guid: 4becc78234ad9
                        slug: gadianton/115
                        heading: 3 Nephi 1:9
                        content: <p>Now it came to pass that there was a day set apart by the unbelievers, [i]1792[/i] [c]1495508201[/c] that all those who believed in those traditions should be put to death [c]1495505401[/c] [c]1495404601[/c] except the sign should come to pass, [c]1495518101[/c] [c]1495511101[/c] [c]1495512101[/c] which had been given by Samuel the prophet. [i]2992[/i] </p>
