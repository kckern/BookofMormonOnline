                  - weight: 7
                    type: 'N'
                    narration:
                      description: '{Gidgiddoni|gidgiddoni} and the robbers are chased out to the borders of the land; {Giddianhi|giddianhi}, tired from the fight, loses ground, and is killed.'
                      text:
                        guid: 4becc78239446
                        slug: gadianton/153
                        heading: 3 Nephi 4:13–14
                        content: <p>And it came to pass that Gidgiddoni commanded that his armies should pursue them as far as [c]1503416501[/c] the borders of the wilderness, and that they should not spare any that should fall into their hands by the way; and thus they did pursue them and did slay them, [c]1503404601[/c] to the borders of the wilderness, even until they had fulfilled the commandment of Gidgiddoni. [c]1503204801[/c] [c]1503211101[/c] And it came to pass that Giddianhi, who had stood and fought with boldness, was pursued as he fled; and being weary because of his much fighting he was overtaken and slain. And thus was the end of Giddianhi the robber. [i]3364[/i] [c]1503404101[/c] </p>
                        duration: 35
                        quotes: []
