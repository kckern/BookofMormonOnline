                  - weight: 6
                    type: 'N'
                    narration:
                      description: '{Alma|alma2} had specifically warned about this kind of organization and the dangers which accompany it.'
                      text:
                        guid: 4becc7823009d
                        slug: gadianton/82
                        heading: Helaman 6:25
                        content: <p>Now behold, it is these secret oaths and covenants which Alma commanded his son should not go forth unto the world, [c]1463716501[/c] [c]1463705301[/c] [c]1463703101[/c] lest they should be a means of bringing down the people unto destruction. </p>
                        duration: 12
                        quotes: []
                        people:
