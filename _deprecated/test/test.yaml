              - title: Nephite Weakening
                slug: gadianton/nephites-weakening
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: '{Moronihah|moronihah1} determines that any additional attempts to regain territory would be futile, so he focuses on maintaining current possessions.'
                      text:
                        guid: 4becc7822a323
                        slug: gadianton/31
                        heading: Helaman 4:18–19
                        content: <p>And it came to pass in the sixty and second year of the reign of the judges, that Moronihah could obtain no more possessions over the Lamanites. [c]1455104101[/c] Therefore they did abandon their design to obtain the remainder of their lands, for so numerous were the Lamanites that it became impossible for the Nephites to obtain more power over them; [c]1455318101[/c] [c]1455204801[/c] therefore Moronihah did employ all his armies in maintaining those parts which he had taken. [c]1455104601[/c] </p>
                        chrono: roj|62
                        duration: 26
                        quotes: []
                        people:
                          - slug: moronihah1
                            name: Moronihah1
                            title: Righteous Nephite general, son of Moroni1
                        places: []
                        refs:
                          - verse_id: 35715
                            ref: hel 5:52
                            type: xref
                            significant: 0
                        notes:
                          - id: '1455319301'
                            text: The Lamanites have always outnumbered the Nephites, but now the population imbalance seems particularly dire. Perhaps the dissenters of Helaman 4:2 and 4 made up a substantial percentage of the Nephites.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: Fearful of the large number of {Lamanites|lamanites}, the {Nephites|nephites} begin to remember past prophesies, and realize that their weakness is related to their abandonment of {God|god}.
                      text:
                        guid: 4becc7822a50b
                        slug: gadianton/32
                        heading: Helaman 4:20–22
                        content: <p>And it came to pass, because of the greatness of the number of the Lamanites the Nephites were in great fear, lest they should be overpowered, and trodden down, and slain, and destroyed. [c]1455111101[/c] Yea, they began to remember the prophecies of Alma, and also the words of Mosiah; [c]1455518101[/c] [c]1455206401[/c] and they saw that they had been a stiffnecked people, [c]1455601201[/c] and that they had set at naught the commandments of God.</p> <p>And that they had altered and trampled under their feet the laws of Mosiah, [c]1455613101[/c] [c]1455612101[/c] or that which the Lord commanded him to give unto the people; and they saw that their laws had become corrupted, and that they had become a wicked people, insomuch that they were wicked even [c]1455616501[/c] like unto the Lamanites. [c]1455516501[/c] [c]1455404601[/c] [c]1455404101[/c] </p>
