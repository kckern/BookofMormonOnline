                      text:
                        guid: 4becc78232759
                        slug: gadianton/99
                        heading: Helaman 13:4
                        content: <p>And it came to pass that they would not suffer that he should enter into the city; [c]1483804101[/c] therefore he went and got upon the wall thereof, [c]1483717101[/c] [i]3335[/i] [i]1188[/i] [c]1483812101[/c] and stretched forth his hand and cried with a loud voice, [i]2981[/i] and prophesied unto the people whatsoever things the Lord put into his heart. [i]1779[/i] [i]1121[/i] [c]1483811101[/c] [c]1483812102[/c]</p>
