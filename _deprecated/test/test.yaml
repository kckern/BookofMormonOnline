                        notes:
                          - id: '1505819301'
                            text: This course of action follows precedents set by Captain Moroni (see Alma 44.19–20;50.36;62.16–17), with the addition of preaching, and repentance as a condition of release. The resettlement program for these former robbers is described at 3 Nephi 6.3.
                          - id: '1505919301'
                            text: <i>“Secret murders”</i> is a phrase closely associated with secret combinations such as the Gadianton robbers. Punished according to the law, probably executed, as at Alma 62.9–10.
                  - weight: 10
                    type: 'N'
                    narration:
                      description: Many marvelous things occur, and cannot all be included in this account.
                      text:
                        guid: 4bexx82e8038
                        slug: gadianton/163
                        heading: 3 Nephi 5:7–8
                        content: <p>And thus had the twenty and second year passed away, and the twenty and third year also, and the twenty and fourth, and the twenty and fifth; and thus had twenty and five years passed away. And there [c]1506016501[/c] had many things transpired which, in the eyes of some, would be great and marvelous; nevertheless, they cannot all be written in this book; [c]1506217101[/c] yea, this book cannot contain even a hundredth part of what was done among so many people in the space of twenty and five years; [c]1506218101[/c] </p>
