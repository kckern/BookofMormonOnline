                            title: “by the voice of the people”
                            text: The office of chief judge was transferred from Alma<sup>2</sup> to Nephihah and his descendants at Alma 4.20; here it reverts to the lineage of Alma<sup>2</sup>. Helaman<sup>3</sup>’s son Nephi<sup>2</sup> will give up the judgeship to yet another family at Hel 5.1.
                          - id: '1448519301'
                            text: Helaman is the third chief judge in two years. The office of chief judge was transferred from Alma to Nephihah and his descendants at Alma 4.20; here it reverts to the lineage of Alma. Helaman<sub >3</sub>’s son Nephi<sub >2</sub> will yield the judgeship to yet another family at Helaman 5.1.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: '{Kishkumen|kishkumen}, along with a man named {Gadianton|gadianton}, promise their followers prominent government positions if they would support {Gadianton|gadianton}’s ascent to the judgment seat; {Kishkumen|kishkumen} plans to kill {Helaman|helaman3}.'
                      text:
                        guid: 4becc7822638c
                        slug: gadianton/2
                        heading: Helaman 2:3–5
                        content: <p>But behold, Kishkumen, who had murdered Pahoran, did lay wait to destroy Helaman also; [c]1448717101[/c] [c]1448613101[/c] and he was upheld by his band, who had entered into a covenant that no one should know his wickedness. For there was one Gadianton, [c]1448503101[/c] who was exceedingly expert in many words, [c]1448716501[/c] [c]1448713101[/c] [c]1448704101[/c] and also in his craft, [c]1448718101[/c] [c]1448705301[/c] to carry on the secret work of murder and [c]1448716502[/c] of robbery; [c]1448712101[/c] therefore he became the leader of the band of Kishkumen. [c]1448604801[/c] </p> <p>Therefore he did flatter them, and also Kishkumen, that if they would place him in the judgment–seat he would grant unto those who belonged to his band that they should be placed in power and authority among the people; therefore Kishkumen sought to destroy Helaman. [c]1448604601[/c] [c]1448604101[/c] [c]1448406401[/c] [c]1448704601[/c] </p>
