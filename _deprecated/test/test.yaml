                    narration:
                      description: A horrific battle ensues, many people die, but the {Nephites|nephites} are ultimately victorious.
                      text:
                        guid: 4becc7823923f
                        slug: gadianton/152
                        heading: 3 Nephi 4:11–12
                        content: <p>And the battle commenced in this the sixth month; and great and terrible was the battle thereof, [c]1503218101[/c] yea, great and terrible was the slaughter thereof, insomuch that there never was known so great a slaughter among all the people of Lehi since he left Jerusalem. [c]1503104101[/c] And notwithstanding the threatenings and the oaths which Giddianhi had made, behold, the Nephites did beat them, insomuch that they did fall back [c]1503316501[/c] from before them.</p>
                        duration: 26
                        quotes: []
