                      text:
                        guid: 4becc7822d7bd
                        slug: gadianton/62
                        heading: Helaman 5:41
                        content: <p>And Aminadab said unto them:</p> <blockquote><p>“You must repent, and cry unto the voice, [c]1460105301[/c] [c]1460113101[/c] [c]1460104101[/c] <br />_even until ye shall have faith in Christ, [c]1459718101[/c] [c]1460116501[/c] [c]1460008201[/c] [c]1460104601[/c] <br />_who was taught unto you <br />_by Alma, and Amulek, and Zeezrom; [c]1460116502[/c] [c]1460105302[/c] [c]1460103101[/c] [c]1460112101[/c] <br />_and when ye shall do this, the cloud of darkness <br />_shall be removed from overshadowing you.” [c]1460116503[/c]</p> </blockquote>
