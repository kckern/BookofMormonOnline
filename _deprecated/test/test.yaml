                            title: “Even His Brother Did He Raise from the Dead”
                            text: This was his brother Timothy, a man later chosen to serve as one of the Nephite Twelve (see 3 Nephi 19:4).
                          - id: '1512919201'
                            title: “after he had been stoned and suffered death by the people”
                            text: Timothy; see 3 Ne 19.4
                          - id: '1512919301'
                            text: Nephi<sub >3</sub> is one of the most spirit-infused prophets in the BoM (cf. 3 Nephi 8.1), and also one of the least successful (3 Nephi 7:21). The only references to exorcism among the Nephites in the entire BoM occur in 3 Nephi 7:19 and 22.
