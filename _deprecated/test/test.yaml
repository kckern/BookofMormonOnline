                          - id: '1497819301'
                            text: <i>“Imagining up…in their hearts”</i> and <i>“foolish and vain thing”</i> closely parallels Hel 16.22; cf. Alma 30.13.
                  - weight: 4
                    type: 'N'
                    narration:
                      description: Unbelief leads them in wickedness and moral corruption.
                      text:
                        guid: 4becc78235f92
                        slug: gadianton/124
                        heading: 3 Nephi 2:3–4
                        content: <p>And it came to pass that the people began to wax strong in wickedness and abominations; [c]1497708201[/c] and they did not believe that there should be any more signs or wonders given; [c]1497917101[/c] [c]1497911101[/c] [c]1497804601[/c] [c]1497701202[/c] and Satan did go about, leading away the hearts of the people, tempting them and causing them that they should do great wickedness in the land. And thus did pass away the ninety and sixth year; and also the ninety and seventh year; and also the ninety and eighth year; and also the ninety and ninth year;</p>
