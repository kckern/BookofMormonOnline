                      text:
                        guid: 4becc78226e11
                        slug: gadianton/7
                        heading: Helaman 2:10–11
                        content: <p>And it came to pass that Helaman did send forth to take this band of robbers and secret murderers, that they might be executed according to the law. But behold, when Gadianton had found that Kishkumen did not return he feared lest that he should be destroyed; therefore he caused that his band should follow him. And they took their flight out of the land, [c]1449304801[/c] [c]1449304101[/c] by a secret way, [c]1449304601[/c] into the wilderness; [i]3303[/i] and thus when Helaman sent forth to take them they could nowhere be found.</p>
