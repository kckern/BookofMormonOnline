                        slug: gadianton/119
                        heading: 3 Nephi 1:22–23
                        content: <p>And it came to pass that from this time forth there began to be lyings sent forth among the people, [c]1496804101[/c] [c]1496811101[/c] by Satan, [c]1496816501[/c] [c]1496804601[/c] [c]1496805401[/c] to harden their hearts, [c]1496818101[/c] to the intent that they might not believe in those signs and wonders which they had seen; [c]1494701202[/c] [c]1496807201[/c] [c]1496813101[/c] but notwithstanding these lyings and deceivings the more part of the people did believe, [c]1496804801[/c] [i]1801[/i] and were converted unto the Lord. [c]1496816502[/c] [c]1496805402[/c] [c]1496904101[/c] And it came to pass that Nephi went forth among the people, and also many others, baptizing unto repentance, [i]3346[/i] [i]1802[/i] in the which there was a great remission of sins. [i]2998[/i] And thus the people began again to have peace in the land. [c]1496717101[/c] [c]1496904601[/c] </p>
                        duration: 35
