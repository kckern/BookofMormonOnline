                        notes:
                          - id: '1457719301'
                            text: Baptism being linked to confession of sins was the pattern set by John the Baptist at Mt 3.6 and Mk 1.5; the same combination recurs in the BoM at Hel 16.1, 5.
                          - id: '1457719302'
                            title: “Repair…the wrongs which they had done”
                            text: Alma 39.13 (the reading from O); cf. Mos 27.35; Alma 27.8n.
                  - weight: 7
                    type: 'N'
                    narration:
                      description: 8,000 {Lamanites|lamanites} are baptized, and converted unto the {Lord|god} as a result of {Nephi|nephi2} and {Lehi|lehi4}’s efforts.
                      text:
                        guid: 4becc7822bb79
                        slug: gadianton/48
                        heading: Helaman 5:18–19
                        content: <p>And it came to pass that Nephi and Lehi did preach unto the Lamanites with such great power and authority, [c]1457406401[/c] for they had power and authority, given unto them that they might speak, [c]1457817101[/c] [c]1457812101[/c] and they also had what they should speak given unto them— [i]3312[/i] [c]1457807201[/c] [c]1457805301[/c]</p> <p>Therefore they did speak unto the great astonishment of the Lamanites, [c]1457818101[/c] to the convincing them, insomuch that there were eight thousand of the Lamanites who were in the land of Zarahemla and round about baptized unto repentance, [c]1457704801[/c] [i]1752[/i] [c]1457804101[/c] and were convinced of the wickedness of the traditions of their fathers. [c]1457804601[/c] </p>
                        duration: 32
