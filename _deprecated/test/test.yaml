                  - weight: 4
                    type: 'N'
                    narration:
                      description: '{Nephi|nephi3} continues preaching, and despite the overall unbelief of the people, there are many that believe, repent, and are baptized.'
                      text:
                        guid: 4becc7823d941
                        slug: gadianton/185
                        heading: 3 Nephi 7:23–26
                        content: <p>Thus passed away the thirty and second year also. [c]1513316501[/c] And Nephi did cry unto the people in the commencement of the thirty and third year; [c]1513304101[/c] and he did preach unto them repentance and remission of sins. [c]1513604101[/c] Now I would have you to remember also, that there were none who were brought unto repentance who were not baptized with water. [c]1513416501[/c] [c]1513405402[/c] [c]1513302701[/c]</p> <p>Therefore, there were ordained of Nephi, men unto this ministry, that all such as should come unto them should be baptized with water, [c]1513318101[/c] [c]1513516501[/c] [c]1513404101[/c] and this as a witness and a testimony before God, and unto the people, [c]1513607201[/c] that they had repented and received a remission of their sins. [c]1513508201[/c] [c]1513405401[/c] [c]1513404601[/c] And there were many in the commencement of this year that were baptized unto repentance; [i]3383[/i] [c]1513604601[/c] and thus the more part of the year did pass away.</p>
                        duration: 45
                        quotes: []
