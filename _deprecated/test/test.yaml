                      text:
                        guid: 4becc78226811
                        slug: gadianton/4
                        heading: Helaman 2:7
                        content: <p>And it came to pass that he met Kishkumen, and he gave unto him a sign; [c]1448904801[/c] [c]1449004101[/c] therefore Kishkumen made known unto him the object of his desire, [c]1449004601[/c] desiring that he would conduct him to the judgment–seat that he might murder Helaman.</p>
