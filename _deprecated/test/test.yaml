                      description: As they go towards the judgment seat, where {Helaman|helaman3} is, {Helaman’s servant|helamans-servant} stabs {Kishkumen|kishkumen}, who dies; he then runs back to {Helaman|helaman3} and tells him everything that happened.
                      text:
                        guid: 4becc78226c12
                        slug: gadianton/6
                        heading: Helaman 2:9
                        content: <p>Now this did please Kishkumen exceedingly, for he did suppose that he should accomplish his design; but behold, the servant of Helaman, [c]1449116502[/c] [c]1449104601[/c] as they were going forth unto the judgment–seat, did stab Kishkumen even to the heart, [i]3302[/i] [c]1449104101[/c] [c]1448906401[/c] that he fell dead without a groan. And he ran and told Helaman all the things which he had seen, [c]1448911101[/c] and heard, and done.</p>
