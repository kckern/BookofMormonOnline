                            title: “For there was one Gadianton”
                            text: '&#120030; <em>Gaddianton</em>'
                          - id: '1448719301'
                            title: “Craft”
                            text: 'WB: “cunning, art or skill, in a bad sense, or applied to bad purposes.” The word was historically associated with Freemasonry, and when combined with the secrecy, oaths, extralegal protections afforded to others in the brotherhood, infiltration of government offices, and identifying signs all seen in this chapter, many early readers of the BoM assumed that the text had an anti-masonic message.'
                  - weight: 3
                    type: 'N'
                    narration:
                      description: Meanwhile, {one of Helaman’s servants|helamans-servant} had gone undercover into the {Gadianton band|gadianton-robbers}, and had learned about the plot against {Helaman|helaman3}.
                      text:
                        guid: 4becc782265b2
                        slug: gadianton/3
                        heading: Helaman 2:6
                        content: <p>And it came to pass as he went forth towards the judgment–seat to destroy Helaman, behold one of the servants of Helaman, [c]1448904101[/c] having been out by night, [c]1448904601[/c] and having obtained, through disguise, a knowledge of those plans which had been laid by [c]1448916501[/c] this band to destroy Helaman— [c]1448912101[/c] </p>
