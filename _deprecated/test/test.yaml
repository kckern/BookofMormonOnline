                            ref: alma 47:36
                            type: xref
                            significant: 0
                        notes: []
                  - weight: 4
                    type: 'N'
                    narration:
                      description: Seeing the savage appearance of the approaching army of {Giddianhi|giddianhi}, the {Nephites|nephites} fall to the ground and pray.
                      text:
                        guid: 4becc78238e22
                        slug: gadianton/150
                        heading: 3 Nephi 4:7–8
                        content: <p>And it came to pass that they did come up to battle; [c]1502813101[/c] and it was in the sixth month; and behold, great and terrible was the day that they did come up to battle; [c]1502604801[/c] and they were girded about after the manner of robbers; and they had a lamb–skin about their loins, [c]1502816501[/c] [c]1502813102[/c] and they were dyed in blood, and their heads were shorn, and they had head–plates upon them; and great and terrible was the appearance of the armies of Giddianhi, [c]1502804101[/c] because of their armor, and because of their being dyed in blood. [c]1502804601[/c] </p> <p>And it came to pass that the armies of the Nephites, when they saw the appearance of the army of [c]1502916501[/c] Giddianhi, had all fallen to the earth, [c]1502818101[/c] [c]1502904601[/c] and did lift their cries to the Lord their God, [c]1502904101[/c] that he would spare them and deliver them out of the [c]1502916502[/c] hands of their enemies. [c]1502611101[/c] </p>
                        duration: 42
                        quotes: []
                        people:
                          - slug: giddianhi
                            name: Giddianhi
                            title: Chief of Gadianton robbers
                          - slug: nephites
                            name: Nephites
                            title: Descendants of Nephi1 and his followers, later any person who accepts gospel
                        places: []
                        refs: []
                        notes:
                          - id: '1502819301'
                            title: “Skin about their loins”
                            text: and <i>heads were shorn” The appearance of the robbers echoes descriptions of Lamanite warriors at Enos 1.20; Alma 3.5.
                          - id: '1502819302'
                            title: “Lamb-skin”
                            text: Unique here; one wonders about the origins of these garments if the robbers did not have flocks or herds.
                  - weight: 5
                    type: 'N'
                    narration:
                      description: '{Giddianhi|giddianhi}’s troops see the {Nephites|nephites} fall to the ground, and begin to cheer, thinking that they are surrendering; but when they fully approach, the {Nephites|nephites} are ready for them.'
                      text:
                        guid: 4becc78239029
                        slug: gadianton/151
                        heading: 3 Nephi 4:9–10
                        content: <p>And it came to pass that when the armies of Giddianhi saw this they began to shout with a loud voice, because of their joy, for they had supposed that the Nephites had fallen with fear because of the terror of their armies. [c]1503118101[/c] </p> <p>But in this thing they were disappointed, for the Nephites did not fear them; [c]1502904801[/c] [i]3363[/i] but they did fear their God and did supplicate him for protection; [c]1503101201[/c] [c]1503112101[/c] [c]1503107202[/c] therefore, when the armies of Giddianhi did rush upon them they were prepared to meet them; [c]1503104601[/c] yea, in the strength of the Lord they did receive them. [c]1503011101[/c] [c]1503107201[/c] </p>
                        duration: 32
                        quotes: []
                        people:
                          - slug: giddianhi
                            name: Giddianhi
                            title: Chief of Gadianton robbers
                          - slug: nephites
                            name: Nephites
                            title: Descendants of Nephi1 and his followers, later any person who accepts gospel
                        places: []
