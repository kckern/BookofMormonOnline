                      text:
                        guid: 4becc78232a9f
                        slug: gadianton/100
                        heading: Helaman 16:1
                        content: <p>And now, it came to pass that there were many who heard the words of Samuel, the Lamanite, which he spake upon the walls of the city. [c]1492216501[/c] [c]1492213101[/c] And as many as believed on his word went forth and sought for Nephi; [c]1492216502[/c] [i]1780[/i] [c]1492204101[/c] [c]1492204601[/c] and when they had come [c]1492216503[/c] forth and found him they confessed unto him their sins [c]1492205301[/c] and denied not, [c]1492205302[/c] desiring that they might be baptized unto the Lord. [i]2988[/i] [c]1492201101[/c] [c]1492211101[/c]</p>
