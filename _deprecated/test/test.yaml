                      text:
                        guid: 4becc78233498
                        slug: gadianton/105
                        heading: Helaman 16:7
                        content: <p>And as they went forth to lay their hands [c]1492816501[/c] on him, [c]1492504801[/c] [i]1784[/i] behold, he did cast himself down from the wall, [i]1785[/i] and did flee out [c]1492716501[/c] of their lands, [i]2987[/i] [c]1492804101[/c] [c]1492804601[/c] [c]1492813101[/c] yea, even unto his own country, [i]3339[/i] and began to preach and to prophesy among his own people. [i]1786[/i]</p>
