                        notes:
                          - id: '1494705402'
                            title: “Lachoneus Was the Chief Judge”
                            text: Lachoneus will serve as governor or chief judge for approximately thirty years (see 3 Nephi 6:19).
                          - id: '1494719301'
                            text: The last chief judge mentioned in the narrative was Seezoram, who had been murdered by his brother some twenty years earlier, see Hel 9.23–27. Lachoneus’s background is unknown.
                          - id: '1494919201'
                            title: “and his son Nephi did keep the records”
                            text: '&#119979; <em>record</em>'
                          - id: '1494919301'
                            text: Nephi<sub >2</sub>’s demise, like Alma<sub >2</sub>’s, is somewhat mysterious; see Alma 45.17–19. The phrase <i>no man knoweth</i> may be an allusion to Moses’s enigmatic death (Deut 34.6). On the other hand, there seems to have been some expectation that Nephi<sub >2</sub> might return from his unknown travels; see 3 Nephi 2.9.
                          - id: '1498519201'
                            title: “and could nowhere be found in all the land”
                            text: The departure of Nephi<sup>2</sup> was recorded at 3 Ne 1.2–3.
                          - id: '1498519301'
                            text: The departure of Nephi<sub >2</sub> was recorded at 3 Nephi 1.2–3.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: Many of {Samuel|samuel}’s prophesied signs and miracles come to pass, but even so, some naysayers insist that the believers’ faith is in vain.
                      text:
                        guid: 4becc782346b2
                        slug: gadianton/113
                        heading: 3 Nephi 1:4–6
                        content: <p>And it came to pass that in the commencement of the ninety and second year, behold, the prophecies of the prophets began to be fulfilled more fully; [c]1495018101[/c] [c]1495002701[/c] [c]1495004601[/c] [c]1495004101[/c] for there began to be greater signs [c]1495005401[/c] and greater miracles wrought among the people. [i]2990[/i] [i]1788[/i] [c]1495012101[/c] [c]1495008201[/c] [c]1495001101[/c] But there were some who began to say that the time was past for the words to be fulfilled, [c]1494917101[/c] [c]1495204101[/c] which were spoken by Samuel, the Lamanite. And they began to rejoice over their brethren, saying:</p> <blockquote><p>“Behold the time is past, [i]1789[/i] [c]1495111101[/c] <br />_and the words of Samuel are not fulfilled; [c]1495105401[/c] [c]1494701201[/c] <br />_therefore, your joy and your faith concerning this thing [c]1495216501[/c] <br />_hath been vain.” [c]1495216502[/c] [c]1495212101[/c] </p> </blockquote>
