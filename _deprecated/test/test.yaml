                  - weight: 1
                    type: 'N'
                    narration:
                      description: '{Nephi|nephi2} and {Lehi|lehi4} travel to the [land of Nephi|land-of-nephi], where {Lamanite|lamanites} militants capture them, imprison them, and sentence them to death.'
                      text:
                        guid: 4becc7822be24
                        slug: gadianton/49
                        heading: Helaman 5:20–22
                        content: <p>And it came to pass that Nephi and Lehi did proceed from thence to go to the land of Nephi. [c]1458105301[/c] [c]1458004601[/c] [c]1458004101[/c] And it came to pass that they were taken by an army of the Lamanites and cast into prison; [i]3313[/i] [c]1458204101[/c] [c]1458204601[/c] yea, even in that same prison in which Ammon and his brethren were cast by the servants of Limhi. [c]1458004801[/c] [c]1458017102[/c] [c]1458103101[/c] [c]1458113101[/c] And after they had been cast into prison many days without food, behold, they went forth into the prison to take them that they might slay them. [c]1458116501[/c] [i]1753[/i]</p>
                        duration: 26
                        quotes: []
