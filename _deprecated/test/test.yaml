                            text: Seeing the heavens open and angels descending had precedents at 1 Ne 1.8–10 (Lehi<sub >1</sub>) and Helaman 11.14, 30 (Nephi<sub >1</sub>), and prefigures the experience of the Nephites and Lamanites at Bountiful at 3 Ne 17.24.
