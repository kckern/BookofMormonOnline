                        slug: gadianton/86
                        heading: Helaman 6:30
                        content: <p>And behold, it is he who is the author of all sin. [c]1464205301[/c] [c]1464204101[/c] [c]1464004601[/c] And behold, he doth carry on his works of darkness and secret murder, and doth hand down their plots, and their oaths, and their covenants, and their plans of awful wickedness, from generation to generation according as he can get hold upon the hearts of the children of men. [c]1464011101[/c] </p>
