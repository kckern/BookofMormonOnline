                            text: Two opposite responses to Samuel’s preaching are described. They may have been happening simultaneously, but the first (finding Nephi and confessing sins) would have taken longer than the second (throwing stones and shooting arrows).
                  - weight: 7
                    type: 'N'
                    narration:
                      description: Those who do not believe {Samuel|samuel} throw rocks and shoot arrows at him, but {Samuel|samuel} is protected by {God|god}, and is not hit.
                      text:
                        guid: 4becc78232c93
                        slug: gadianton/101
                        heading: Helaman 16:2
                        content: <p>But as many as there were who did not believe in the words of Samuel were angry with him; [c]1492218101[/c] [c]1492305301[/c] [c]1492206401[/c] and they cast stones at him upon the wall, [i]2986[/i] [c]1492301202[/c] [c]1492312101[/c] and also many shot arrows at him [i]1120[/i] as he stood upon the wall; [c]1492311102[/c] [c]1492304101[/c] but the Spirit of the Lord was with him, insomuch that they could not hit him [c]1492316501[/c] with their stones neither with their arrows. [c]1492204801[/c] [c]1492217102[/c] [i]1781[/i] [c]1492311101[/c] [c]1492304601[/c] [c]1492301201[/c] [c]1492309101[/c]</p>
