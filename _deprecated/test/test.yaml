                  - weight: 9
                    type: 'N'
                    narration:
                      description: '{Nephi|nephi2} baptizes many of the converts, and reiterates {Samuel|samuel}’s words.'
                      text:
                        guid: 4becc78233086
                        slug: gadianton/103
                        heading: Helaman 16:4–5
                        content: <p>For behold, Nephi was baptizing, and prophesying, [i]1783[/i] and preaching, [c]1492511102[/c] [c]1492504101[/c] [c]1492504601[/c] crying repentance unto the people, [c]1492516501[/c] showing signs and wonders, working miracles among the people, that they might know that the Christ must shortly come— [c]1492518101[/c] Telling them of things which must shortly come, [c]1492511101[/c] that they might know and remember at the time of their coming that they had been made known unto them beforehand, [c]1492604601[/c] [c]1492604101[/c] to the intent that they might believe; therefore as many as believed on the words of Samuel went forth unto him to be baptized, [c]1492505301[/c] [c]1492607201[/c] for they came repenting and confessing their sins. [c]1492417101[/c]</p>
