              - title: Prophetic Rejection and Government Conspiracy
                slug: gadianton/prophetic-rejection-and-government-conspiracy
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: '{Lachoneus|lachoneus1}’ son, also named {Lachoneus|lachoneus2}, assumes the judgment seat, all while the {Nephites|nephites} collapse into a state of willful sin.'
                      text:
                        guid: 4becc7823b8a7
                        slug: gadianton/170
                        heading: 3 Nephi 6:17–19
                        content: <p>And thus, in the commencement of the thirtieth year—the people having been delivered up for the space of a long time to be carried about by the temptations of the devil whithersoever he desired to carry them, [c]1509718101[/c] [c]1509712101[/c] and to do whatsoever iniquity he desired they should—and thus in the commencement of this, the thirtieth year, they were in a state of awful wickedness. [c]1509701101[/c]</p> <p>Now they did not sin ignorantly, [c]1509802701[/c] for they knew the will of God concerning them, [c]1509809101[/c] [c]1509804101[/c] for it had been taught unto them; therefore they did wilfully rebel against God. [c]1509818101[/c] [c]1509608201[/c] [c]1509805401[/c] [c]1509511101[/c] [c]1509812101[/c] [c]1509804601[/c] [c]1509501201[/c] And now it was in the days of Lachoneus, [c]1509907201[/c] the son of Lachoneus, for Lachoneus did fill the seat of his father and did govern the people that year. [c]1509904601[/c] [c]1509809102[/c] [c]1509904101[/c] </p>
                        duration: 42
                        quotes: []
                        people:
                          - slug: lachoneus1
                            name: Lachoneus1
                            title: Nephite chief judge
                          - slug: lachoneus2
                            name: Lachoneus2
                            title: Son of Lachoneus1
                          - slug: nephites
                            name: Nephites
                            title: Descendants of Nephi1 and his followers, later any person who accepts gospel
                        places: []
                        refs:
                          - verse_id: 4181
                            ref: num 15:27
                            type: xref
                            significant: 0
                          - verse_id: 32862
                            ref: mosiah 3:11
                            type: xref
                            significant: 0
                          - verse_id: 36050
                            ref: 3ne 1:1
                            type: xref
                            significant: 0
                        notes:
                          - id: '1509719301'
                            text: This verse features a quick example of resumptive repetition. Being <i>carried about</i> by the devil was referred to at Alma 30.42, with regard to Korihor.
                          - id: '1509819201'
                            title: “therefore they did wilfully rebel against God”
                            text: The fate of those who “wilfully rebel against God” was a concern of both Abinadi (Mos 15.26) and Mormon<sup>2</sup> (Morm 1.16); cf. Heb 10.26; Mos 3.11–12.
                          - id: '1509819301'
                            text: The fate of those who “wilfully rebel against God” was a concern of both Abinadi and Mormon (Mos 15.26–27; Morm 1.16; cf. Heb 10.26), but the phrase <i>sin ignorantly</i> makes this verse an allusion to Benjamin’s warning at Mos 3.11–12.
                  - weight: 2
                    type: 'N'
