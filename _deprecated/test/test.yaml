                      description: '{Samuel|samuel}, a {Lamanite|lamanites} prophet, arrives in [Zarahemla|land-of-zarahemla] and preaches, but is rejected, and turns around to go home.'
                      text:
                        guid: 4becc78232362
                        slug: gadianton/97
                        heading: Helaman 13:2
                        content: <p>And it came to pass that in this year there was one Samuel, [c]1483613101[/c] a Lamanite, [i]2979[/i] [c]1483605301[/c] [c]1483604101[/c] [c]1483604601[/c] [c]1483612101[/c] [c]1483607201[/c] came into the land of Zarahemla, [c]1483506401[/c] and began to preach unto the people. [c]1483504801[/c] [c]1483517105[/c] [c]1483517107[/c] [c]1483517104[/c] [c]1483517103[/c] [i]1776[/i] And it came to pass that he did preach, many days, repentance unto the people, [c]1483618101[/c] [c]1483504802[/c] [c]1483517106[/c] [c]1483616501[/c] and they did cast him out, [i]1777[/i] and he was about to return to his own land. [c]1483608201[/c] </p>
