              - title: Issues with Pride
                slug: gadianton/issues-with-pride
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: The increased prosperity leads to pride and ostracism among church members.
                      text:
                        guid: 4becc78228d4a
                        slug: gadianton/21
                        heading: Helaman 3:33–34
                        content: <p>And in the fifty and first year of the reign of the judges there was peace also, save it were the pride which began to enter into the church— [c]1452804601[/c] [c]1453006401[/c] not into the church of God, [c]1453018101[/c] [c]1452804801[/c] but into the hearts of the people who professed to belong to the church of God— [c]1453012101[/c] And they were lifted up in pride, [c]1453001201[/c] [c]1453107201[/c] even to the persecution of many of their brethren. [c]1453105301[/c]</p>
                        chrono: roj|51
                        duration: 20
                        quotes: []
                        people:
                          - slug: saints-of-the-church
                            name: Saints of the Church
                            title: Devout Followers of Christ
                        places: []
                        refs: []
                        notes:
                          - id: '1453019301'
                            text: As is so often the case in the BoM, pride is one of the first signs of trouble.
                          - id: '1453019302'
                            text: The narrator draws a distinction between true and false Christians, both of whom may belong to the church.
                          - id: '1453019303'
                            title: “Great persecutions”
                            text: Apparently from other church members rather than from outsiders.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: The more humble members suffer greatly, yet are comforted and sanctified by the power of {Christ|jesus-christ}.
                      text:
                        guid: 4becc78228f43
                        slug: gadianton/22
                        heading: Helaman 3:34–35
                        content: <p>Now this was a great evil, [c]1453104101[/c] which did cause the more humble part of the people to suffer great persecutions, [c]1453116501[/c] and to wade through much affliction. [c]1453017101[/c] [c]1453011101[/c] </p> <p>Nevertheless they did fast and pray oft, [c]1453208201[/c] [c]1453209101[/c] [c]1453212101[/c] [c]1453207201[/c] and did wax stronger and stronger in their humility, [c]1453218101[/c] [c]1453201201[/c] [c]1453104601[/c] [c]1453207203[/c] and firmer and firmer in the faith of Christ, [c]1453201202[/c] unto the filling their souls with joy and consolation, [c]1453205301[/c] yea, even to the purifying and the sanctification of their hearts, which sanctification cometh because of their yielding their hearts unto God. [c]1453001101[/c] [c]1453205302[/c] [c]1453207202[/c] [c]1453201203[/c] [c]1453212102[/c]</p>
                        duration: 33
                        quotes: []
