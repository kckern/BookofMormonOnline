                  - weight: 2
                    type: 'N'
                    narration:
                      description: Continued persuasion efforts on the part of the dissenters finally succeed, and the {Lamanites|lamanites} initiate a strike on the {Nephites|nephites}, and successfully occupy the [land of Zarahemla|land-of-zarahemla].
                      text:
                        guid: 4becc782297bd
                        slug: gadianton/26
                        heading: Helaman 4:4–5
                        content: <p>But it came to pass in the fifty and sixth year of the reign of the judges, there were dissenters who went up from the Nephites unto the Lamanites; [c]1453611101[/c] and they succeeded with those others in stirring them up to anger against the Nephites; [c]1453518101[/c] [c]1453704101[/c] and they were all that year preparing for war. [c]1453904601[/c] </p> <p>And in the fifty and seventh year they did come down against the Nephites to battle, and they did commence the work of death; [c]1453904101[/c] yea, insomuch that in the fifty and eighth year of the reign of the judges they succeeded in obtaining possession of the land of Zarahemla; [c]1453918101[/c] [c]1453912101[/c] yea, and also all the lands, even unto the land which was near the land Bountiful. [c]1453913101[/c] [c]1453506401[/c] </p>
