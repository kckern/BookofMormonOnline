                  - weight: 3
                    type: 'N'
                    narration:
                      description: They repent, live righteously, and live all together in one body, all while preparing for the {Gadianton|gadianton-robbers} strike.
                      text:
                        guid: 4becc78238518
                        slug: gadianton/146
                        heading: 3 Nephi 3:25–26
                        content: <p>And they did fortify themselves against their enemies; and they did dwell in one land, and in one body, [c]1502004601[/c] [c]1502004101[/c] and they did fear the words which had been spoken by Lachoneus, [c]1502018101[/c] [c]1502004801[/c] insomuch that they did repent of all their sins; [c]1501704801[/c] and they did put up their prayers unto the Lord their God, [c]1502107201[/c] that he would deliver them in the time that their enemies should come down against them to battle.</p> <p>And they were exceedingly sorrowful because of their enemies. And Gidgiddoni did cause that they should make weapons of war of every kind, [c]1502116502[/c] and they should be strong with armor, and with shields, and with bucklers, [c]1502113101[/c] after the manner of his instruction. [c]1502116503[/c] [i]3359[/i] </p>
