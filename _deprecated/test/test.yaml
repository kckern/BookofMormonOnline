                            title: “For there was one Gadianton”
                            text: '&#120030; <em>Gaddianton</em>'
                          - id: '1448719301'
                            title: “Craft”
                            text: 'WB: “cunning, art or skill, in a bad sense, or applied to bad purposes.” The word was historically associated with Freemasonry, and when combined with the secrecy, oaths, extralegal protections afforded to others in the brotherhood, infiltration of government offices, and identifying signs all seen in this chapter, many early readers of the BoM assumed that the text had an anti-masonic message.'
