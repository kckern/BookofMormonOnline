                  - weight: 7
                    type: 'N'
                    narration:
                      description: The {Spirit of God|holy-spirit} withdraws from the {Nephites|nephites}, but is poured out abundantly among the {Lamanites|lamanites}.
                      text:
                        guid: 4becc78230fb8
                        slug: gadianton/89
                        heading: Helaman 6:34–36
                        content: <p>And thus we see that the Nephites did begin to dwindle in unbelief, [c]1464804601[/c] [c]1464804101[/c] and grow in wickedness and abominations, while the Lamanites began to grow exceedingly in the knowledge of their God; [i]3322[/i] [c]1464608201[/c] yea, they did begin to keep his statutes and commandments, and to walk in truth and uprightness before him. And thus we see that the Spirit of the Lord began to withdraw from the Nephites, [c]1464704601[/c] [c]1464704101[/c] [c]1464707201[/c] because of the wickedness and the hardness of their hearts. And thus we see that the Lord began to pour out his Spirit upon the Lamanites, [c]1464611101[/c] [c]1464812101[/c] because of their easiness and willingness to believe in his [c]1464816501[/c] words. [c]1464818101[/c] [c]1464711101[/c] [c]1464809101[/c] </p>
