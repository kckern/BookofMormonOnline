                        content: <p>And the people who were in the land northward did dwell in tents, and in houses of cement, [c]1450504801[/c] [v]56[/v] and they did suffer whatsoever tree should spring up [c]1450616501[/c] upon the face of the land that it should grow up, that in time they might have timber to build their houses, [c]1450604101[/c] yea, their cities, and their temples, and their synagogues, and their sanctuaries, and all manner of their buildings. [c]1450604601[/c] </p>
