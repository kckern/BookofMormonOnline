                        slug: gadianton/92
                        heading: Helaman 11:26–27
                        content: <p>And thus in time, yea, even in the space of not many years, they became an exceedingly great band of robbers; [c]1479404801[/c] and they did search out all the secret plans of Gadianton; and thus they became robbers of Gadianton. [c]1479404601[/c] Now behold, these robbers did make great havoc, yea, even great destruction among the people of Nephi, [c]1479704601[/c] [c]1479704101[/c] and also among the people of the Lamanites. [i]1774[/i]</p>
