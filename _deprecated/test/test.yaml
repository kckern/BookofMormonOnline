                        notes:
                          - id: '1456119301'
                            text: The allusion to Mos 29.26–27 in these verses suggests that rather than voluntarily resigning as chief judge, as Alma did at Alma 4.11–20, Nephi has been forced out by the voice of the people. There is no evidence that Nephi handpicked Cezoram as his successor, as happened with Nephihah, though Nephi does follow Alma’s example in devoting the rest of his life to preaching.
                          - id: '1456219301'
                            text: <i>“Ripening for destruction”</i> will become a refrain in Hel, tracking the downward spiritual spiral of the Nephites; see Helaman 6.40;8.26;11.37;13.14. The only previous use of the phrase was at Alma 10.19, referring to a prophecy of King Mosiah. This is also the last mention of the <i>“voice of the people”</i> in the BoM.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: '{Nephi|nephi2} joins his brother {Lehi|lehi4}, and the two set out to preach to the word of {God|god} to the {Nephites|nephites}.'
                      text:
                        guid: 4becc7822ab7a
                        slug: gadianton/35
                        heading: Helaman 5:4
                        content: <p>And it came to pass that Nephi had become weary because of their iniquity; and he yielded up the judgment–seat, [c]1456404101[/c] [c]1456412101[/c] and took it upon him to preach the word of God all the remainder of his days, [c]1456117102[/c] [c]1456404601[/c] [c]1456407201[/c] [c]1456111101[/c] and his brother Lehi also, [c]1456405301[/c] all the remainder of his days;</p>
                        duration: 14
                        quotes: []
