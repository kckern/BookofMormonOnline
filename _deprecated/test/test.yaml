                        notes:
                          - id: '1455719301'
                            title: “Dwindle”
                            text: 'WB: “to diminish; to shrink.” This is the only instance in which “the church” is said to <i>dwindle</i>, a verb that everywhere else in the BoM is modified by “in unbelief.”'
                          - id: '1455819301'
                            text: A fulfillment of King Benjamin’s prophecy at Mos 1.13.
                          - id: '1455819302'
                            title: “They had become weak”
                            text: See Helaman 4:13 above.
                          - id: '1455819303'
                            title: “Spirit of the Lord…withdrawn…doth not dwell in unholy temples”
                            text: Mos 2.36–37.
                          - id: '1456019201'
                            title: “in the space of not many years”
                            text: Several phrases in common suggest that vv. 24–26 are a fulfillment of the prophecy at Mos 1.13.
                          - id: '1456019301'
                            title: “In the space of not many years”
                            text: Note that “great prosperity in the church” had been reported as recently as Helaman 3.24–25, just thirteen years earlier.
              - title: Nephi’s Resignation as Judge
                slug: gadianton/nephis-resignation-as-judge
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: '{Nephi|nephi2} resigns from his office as judge, and entrusts the position to a man named {Cezoram|cezoram}.'
                      text:
                        guid: 4becc7822a99a
                        slug: gadianton/34
                        heading: Helaman 5:1–3
                        content: <p>And it came to pass that in [c]1456116501[/c] this same year, behold, Nephi delivered up the judgment–seat to a man whose name was Cezoram. [c]1456118101[/c] [i]3311[/i] [c]1456108201[/c] [c]1456106401[/c] [c]1456207201[/c] [c]1456104101[/c] for as their laws and their [c]1456216501[/c] governments were established by the voice of the people, [c]1456201201[/c] and they who chose evil were more numerous than they who chose good, [c]1456216502[/c] [c]1456207202[/c] [c]1456208201[/c] [c]1456212101[/c] therefore they were ripening for destruction, [c]1456218101[/c] [c]1456105301[/c] [c]1456104601[/c] for the laws had become corrupted. [c]1456218102[/c] [c]1456104801[/c] [c]1456304601[/c] [c]1456213101[/c] Yea, and this was not all; they were a stiffnecked people, insomuch that they could not be governed by the law nor justice, [c]1456304101[/c] save it were to their destruction. [c]1456305301[/c] </p>
                        duration: 31
                        quotes: []
