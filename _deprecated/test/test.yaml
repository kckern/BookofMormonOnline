                        content: <p>But it came to pass in the ninetieth year of the reign of the judges, [c]1493316501[/c] there were great signs given unto the people, [c]1493411101[/c] and wonders; [c]1493416501[/c] [c]1493406401[/c] and the words of the prophets began to be fulfilled. [c]1493418101[/c] And angels did appear unto men, [c]1493305301[/c] [c]1493404601[/c] [c]1493404101[/c] wise men, and did declare unto them glad tidings of great joy; [c]1493516501[/c] thus in this year the scriptures began to be fulfilled. [c]1493516502[/c]</p>
