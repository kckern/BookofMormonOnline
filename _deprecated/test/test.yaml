                  - weight: 4
                    type: 'N'
                    narration:
                      description: '{Lachoneus|lachoneus1} receives a letter from {Giddianhi|giddianhi}, the {Gadianton|gadianton-robbers} leader, inviting him and his people to join the {Gadianton band|gadianton-robbers} and threatening to destroy him and his people should he refuse.'
                      text:
                        guid: 4becc78236b07
                        slug: gadianton/129
                        heading: 3 Nephi 3:1–10
                        content: '<p>And now it came to pass that in the sixteenth year from the coming of Christ, Lachoneus, the governor of the land, [c]1499618101[/c] [c]1499602701[/c] received an epistle from the leader and the governor of this band of robbers; [c]1499617102[/c] [c]1499616502[/c] [c]1499616501[/c] [i]3351[/i] [c]1499605401[/c] [c]1499611101[/c] [c]1499608201[/c] [c]1499604101[/c] [c]1499604601[/c] [c]1499612101[/c] [c]1499613101[/c] and these [c]1499616503[/c] were the words which were written, saying: [c]1499901201[/c] [quote]4becc78236bbe[/quote]</p>'
                        chrono: coc|16
                        duration: 14
                        quotes:
                          - parent: 4becc78236bbe
                            parentSlug: gadianton/129
                            slug: gadianton/133
                            heading: Feeling for your welfare
                            content: <p>Therefore I have written this epistle, sealing it with mine own hand, feeling for your welfare, because of your firmness in that which ye believe to be right, [c]1500004101[/c] and your noble spirit in the field of battle.</p>
                            duration: 13
                          - parent: 4becc78236bbe
                            parentSlug: gadianton/129
                            slug: gadianton/138
                            heading: Summary
                            content: <p>And I write this epistle unto you, Lachoneus, and I hope that ye will deliver up your lands and your possessions, without the shedding of blood, [c]1500404801[/c] [c]1500513101[/c] that this my people may recover their rights and government, who have dissented away from you because of your wickedness in retaining from them their rights of government, [c]1500411101[/c] and except ye do this, I will avenge their wrongs. I am Giddianhi.</p>
                            duration: 24
                          - parent: 4becc78236bbe
                            parentSlug: gadianton/129
                            slug: gadianton/137
                            heading: Conclusion
                            content: <p>And behold, I am Giddianhi; [c]1500413101[/c] and I am the governor of this the secret society of Gadianton; [c]1500604601[/c] [c]1500404601[/c] which society and the works thereof I know to be good; [c]1500413102[/c] and they are of ancient date [c]1500416502[/c] and they have been handed down unto us. [c]1500404101[/c] </p>
                            duration: 15
                          - parent: 4becc78236bbe
                            parentSlug: gadianton/129
                            slug: gadianton/136
                            heading: Compliance leads to security
                            content: <p>And behold, I swear unto you, if ye will do this, with an oath, ye shall not be destroyed; [c]1499617103[/c] [c]1500304101[/c] [c]1500304601[/c] but if ye will not do this, I swear unto you with an oath, that on the morrow month I will command that my armies shall come down against you, and they shall not stay their hand and shall spare not, but shall slay you, and shall let fall the sword upon you even until ye shall become extinct. [c]1500318101[/c] [c]1500104801[/c] [c]1500316501[/c] [c]1500311101[/c] </p>
                            duration: 25
                          - parent: 4becc78236bbe
                            parentSlug: gadianton/129
                            slug: gadianton/135
                            heading: Unite with us
                            content: <p>Or in other words, yield yourselves up unto us, and unite with us and become acquainted with our secret works, [c]1500111101[/c] [c]1500204601[/c] and become our brethren that ye may be like unto us— [c]1500118101[/c] not our slaves, but our brethren and partners of all our substance. [c]1500204101[/c] </p>
                            duration: 15
                          - parent: 4becc78236bbe
                            parentSlug: gadianton/129
                            slug: gadianton/134
                            heading: Surrender
                            content: <p>Therefore I write unto you, desiring that ye would yield up unto this my people, your cities, your lands, and your possessions, [c]1500113101[/c] rather than that they should visit you with the sword and that destruction should come upon you. [c]1500004601[/c] [c]1500104101[/c] </p>
                            duration: 14
                          - parent: 4becc78236bbe
                            parentSlug: gadianton/129
                            slug: gadianton/132
                            heading: Assumed nephite loss
                            content: <p>And I, knowing of their unconquerable spirit, having proved them in the field of battle, and knowing of their everlasting hatred towards you because of the many wrongs which ye have done unto them, therefore if they should come down against you they would visit you with utter destruction. [c]1499804801[/c] [c]1499904101[/c] [c]1499904601[/c] </p>
                            duration: 19
                          - parent: 4becc78236bbe
                            parentSlug: gadianton/129
                            slug: gadianton/131
                            heading: Preparing to destroy the Nephites
                            content: <p>And it seemeth a pity unto me, most noble Lachoneus, that ye should be so foolish and vain as to suppose that ye can stand against so many brave men who are at my command, who do now at this time stand in their arms, and do await with great anxiety for the word—Go down upon the Nephites and destroy them. [c]1499804601[/c] [c]1499804101[/c] </p>
                            duration: 20
                          - parent: 4becc78236bbe
                            parentSlug: gadianton/129
                            slug: gadianton/130
                            heading: Introduction
                            content: <p>Lachoneus, most noble and chief governor of the land, [c]1499704601[/c] behold, I write this epistle unto you, [c]1499718101[/c] [c]1499707201[/c] and do give unto you exceedingly great praise because of your firmness, and also the firmness of your people, in maintaining that which ye suppose to be your right and liberty; [c]1499617102[/c] yea, ye do stand well, as if ye were supported by the hand of [c]1499716501[/c] a god, [c]1499604801[/c] [c]1499705401[/c] [c]1499704101[/c] in the defence of your liberty, and your property, and your country, or that which ye do call so.</p>
                            duration: 27
