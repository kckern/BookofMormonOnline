                    type: 'N'
                    narration:
                      description: As man named {Lachoneus|lachoneus1} becomes chief judge, {Nephi|nephi2} hands the {Nephite|nephites} records down to his son, also named {Nephi|nephi3}, then leaves [Zarahemla|zarahemla], and is never heard from again.
                      text:
                        guid: 4becc78234492
                        slug: gadianton/112
                        heading: 3 Nephi 1:1–3, 2:9
                        content: <p>Now it came to pass that the ninety and first year had passed away and it was six hundred years from the time that Lehi left Jerusalem; [c]1494717104[/c] [c]1494701201[/c] [c]1494705401[/c] [c]1494701202[/c] [c]1494711101[/c] [c]1494702701[/c] [c]1494704601[/c] [c]1494713101[/c] and it was in the year that Lachoneus was the chief judge [c]1494705402[/c] and the governor over the land. [c]1494707201[/c] [c]1494713102[/c] And Nephi, the son of Helaman, [c]1494817101[/c] [c]1494913101[/c] had departed out of the land of Zarahemla, [c]1494704802[/c] [c]1494912101[/c] giving charge unto his son Nephi, who was his eldest son, concerning the plates of brass, and all the records which had been kept, [i]3340[/i] and all those things which had been kept sacred from the departure of Lehi out of Jerusalem. [c]1498518101[/c] [c]1494818102[/c] [c]1494704801[/c] [c]1494717103[/c] Then he departed out of the land, and whither [c]1494916501[/c] he went, no man knoweth; [c]1494918101[/c] [c]1494917101[/c] [c]1494716501[/c] [c]1494803101[/c] [c]1494905401[/c] [c]1494913102[/c] [c]1498504101[/c] and his son Nephi did keep the [c]1494916502[/c] records in his stead, [i]2991[/i] [c]1494812101[/c] [c]1494804601[/c] yea, the record of this people. [c]1494818101[/c] [i]1787[/i]</p> <hr /> <p>And Nephi, [c]1494907201[/c] who was the father of Nephi, [c]1498411101[/c] [c]1494704101[/c] who had the charge of the records, did not return to the land of Zarahemla, [c]1498508201[/c] [c]1494804101[/c] and could nowhere be found in all the land. [c]1494811101[/c] [c]1498504601[/c] [c]1494904601[/c] [c]1494712101[/c] </p>
