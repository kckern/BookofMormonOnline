                        slug: gadianton/23
                        heading: Helaman 3:36
                        content: <p>And it came to pass that the fifty and second year ended in peace also, [c]1453313102[/c] save it were the exceedingly great pride which had gotten into the hearts of the people; and it was because of their exceedingly great riches and their prosperity in the land; [c]1453304601[/c] [c]1453313101[/c] and it did grow upon them from day to day. [c]1453304101[/c] </p>
