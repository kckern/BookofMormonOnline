                  - weight: 2
                    type: 'N'
                    narration:
                      description: To their shock, all of the cities had been deserted, and there are no resources to obtain, people to kill, or anything to plunder.
                      text:
                        guid: 4becc782389f2
                        slug: gadianton/148
                        heading: 3 Nephi 4:2–4
                        content: <p>But behold, there were no wild beasts nor game in those lands which had been deserted by the Nephites, and there was no game for the robbers save it were in the wilderness. [c]1502311101[/c] [c]1502304101[/c] [c]1502304601[/c] And the robbers could not exist save it were in the wilderness, for the want of food; [c]1502217102[/c] [v]117[/v] [c]1502509101[/c] for the Nephites had left their lands desolate, [c]1502517101[/c] [i]3360[/i] and had gathered their flocks and their herds and all their substance, and they were in one body. [c]1502412101[/c] </p> <p>Therefore, there was no chance for the robbers to plunder and to obtain food, [c]1502518101[/c] [c]1502204801[/c] [c]1502504101[/c] [c]1502504601[/c] [c]1502202701[/c] save it were to come up in open battle against the Nephites; and the Nephites being in one body, and having so great a number, and having reserved for themselves provisions, and horses [v]136[/v] and cattle, and flocks of every kind, that they might subsist for the space of seven years, [i]3361[/i] [c]1502513102[/c] [c]1502512101[/c] in the which time they did hope to destroy the robbers from off the face of the land; and thus the eighteenth year did pass away. [c]1502411101[/c] [c]1502513101[/c] </p>
                        duration: 51
