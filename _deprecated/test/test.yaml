                  - weight: 6
                    type: 'N'
                    narration:
                      description: The {Nephites|nephites} again pray for protection.
                      text:
                        guid: 4becc7823a1a4
                        slug: gadianton/159
                        heading: 3 Nephi 4:30
                        content: <p>And they did rejoice and cry again with one voice, [c]1505107202[/c] saying:</p> <blockquote><p>“May the God of Abraham, [c]1505105401[/c] and the God of Isaac, and the God of Jacob, protect this people in righteousness, [c]1505107201[/c] so long as they shall call on the name of their God for protection. [c]1505017101[/c]” [c]1504811101[/c] [c]1505104601[/c] [c]1505104101[/c] </p> </blockquote>
                        duration: 14
                        quotes: []
                        people:
                          - slug: isaac
                            name: Isaac
                            title: Son of Abraham
                          - slug: jacob1
                            name: Jacob1
                            title: Son of Isaac, Father of Israel
                          - slug: nephites
