                      description: Converted {Lamanites|lamanites} join the {Nephites|nephites}; their curse is lifted, and they become fair.
                      text:
                        guid: 4becc782366b5
                        slug: gadianton/127
                        heading: 3 Nephi 2:12–16
                        content: <p>Therefore, all the Lamanites who had become converted unto the Lord did unite with their brethren, [c]1498809101[/c] [c]1498804601[/c] the Nephites, and were compelled, for the safety of their lives and their women and their children, to take up arms against those Gadianton robbers, yea, and also to maintain their rights, and the privileges of their church and of their worship, and their freedom and their liberty. [c]1498816502[/c] [c]1498816501[/c]</p> <p>And it came to pass that before this thirteenth year had passed away the Nephites were threatened with utter destruction because of this war, [c]1498904101[/c] [c]1498904601[/c] which had become exceedingly sore. And it came to pass that those Lamanites who had united with the Nephites were numbered among the Nephites; And their curse was taken from them, [c]1498711101[/c] [c]1499105401[/c] [c]1498804101[/c] [c]1498708201[/c] and their skin became white like unto the Nephites ; [c]1499118101[/c] [c]1498804801[/c] [c]1498501101[/c] [c]1499113101[/c] [c]1499002701[/c] [c]1499004601[/c] [c]1499112101[/c]</p> <p>And their young men and their daughters became exceedingly fair, [c]1499004101[/c] and they were numbered among the Nephites, [c]1499204601[/c] and were called Nephites. [i]3349[/i] [c]1499205401[/c] [c]1499204101[/c] And thus ended the thirteenth year.</p>
