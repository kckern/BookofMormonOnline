                      description: '{Gidgiddoni|gidgiddoni} refuses, and insists on leading a defensive military tactic.'
                      text:
                        guid: 4becc78237d5a
                        slug: gadianton/143
                        heading: 3 Nephi 3:21
                        content: <p>But Gidgiddoni saith unto them:</p> <blockquote><p>“The Lord forbid; for if we should go up against them the Lord would deliver us into their hands; [c]1501518101[/c] [c]1501504101[/c] [c]1501612101[/c] therefore we will prepare ourselves in the center of our lands, [c]1501613101[/c] [c]1500601101[/c] and we will gather all our armies together, [i]3357[/i] [c]1501503101[/c] and we will not go against them, but we will wait till they shall come against us; [c]1501404801[/c] [c]1501505401[/c] therefore as the Lord liveth, if we do this he will deliver them into our hands.” [c]1501611101[/c] [c]1501504601[/c] [c]1501509101[/c] </p> </blockquote>
