                      text:
                        guid: 4becc7823804d
                        slug: gadianton/144
                        heading: 3 Nephi 3:22
                        content: <p>And it came to pass in the seventeenth year, in the latter end of the year, the proclamation of Lachoneus had gone forth throughout all the face of the land, and they had taken their horses, [v]136[/v] [c]1501713101[/c] and their chariots, [c]1501704101[/c] and their cattle, and all their flocks, and their herds, and their grain, and all their substance, [i]3358[/i] [c]1501704601[/c] and did march forth by thousands and by tens of thousands, until they had all gone forth to the place which had been appointed that they should gather themselves together, to defend themselves against their enemies.</p>
                        duration: 29
                        quotes: []
