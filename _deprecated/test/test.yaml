                  - weight: 21
                    type: 'N'
                    narration:
                      description: The converted guards go around and preach to the other {Lamanites|lamanites}, many of whom believe, repent, and agree to give back captured {Nephite|nephites} lands and live in peace.
                      text:
                        guid: 4becc7822e51d
                        slug: gadianton/69
                        heading: Helaman 5:50–52
                        content: <p>And it came to pass that they did go forth, and did minister unto the people, [c]1461018101[/c] [c]1461004101[/c] [c]1461004601[/c] declaring throughout all the regions round about all the things which they had heard and seen, [i]1769[/i] insomuch that the more part of the Lamanites were convinced of them, [c]1461006401[/c] because of the greatness of the evidences which they had received.</p> <p>And as many as were convinced did lay down their weapons of war, [c]1461004801[/c] [i]1770[/i] [c]1461011101[/c] [c]1461104601[/c] [c]1461104101[/c] and also their hatred and the tradition of their [c]1461116501[/c] fathers. And it came to pass that they did yield up unto the Nephites the lands of their [c]1461216501[/c] possession. [c]1461117101[/c] [i]1771[/i] [c]1461211101[/c] [c]1461212101[/c] [c]1461204601[/c] [c]1461207201[/c] [c]1461209101[/c] [c]1461204101[/c] </p>
