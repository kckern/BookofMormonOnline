                  - weight: 6
                    type: 'N'
                    narration:
                      description: '{Nephi|nephi2} and {Lehi|lehi4}’s charismatic and powerful preaching convinces many of their errors, and leads many to repentance.'
                      text:
                        guid: 4becc7822b995
                        slug: gadianton/47
                        heading: Helaman 5:17
                        content: <p>And it came to pass that they did preach with great power, [c]1457408201[/c] [c]1457704601[/c] insomuch that they did confound many of those dissenters who had gone over from the Nephites, [c]1457711101[/c] [c]1457712101[/c] [c]1457704101[/c] insomuch that they came forth and did confess their sins and were baptized unto repentance, and immediately returned to the Nephites to endeavor to repair unto them the wrongs which they had done. [c]1457716501[/c]</p>
                        duration: 22
                        quotes: []
