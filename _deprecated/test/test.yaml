                        slug: gadianton/142
                        heading: 3 Nephi 3:20
                        content: <p>Now the people said unto Gidgiddoni:</p> <blockquote><p>“Pray unto the Lord, [c]1500608201[/c] and let us go up upon the mountains and into the wilderness, that we may fall upon the robbers and destroy them in their own lands. [c]1501417102[/c]” [c]1501511101[/c] </p></blockquote>
