                      text:
                        guid: 4becc782277a0
                        slug: gadianton/11
                        heading: Helaman 3:6–7
                        content: <p>And now no part of the land was desolate, [c]1450304101[/c] save it were for timber; [c]1450316501[/c] but because of the greatness of the destruction of the people who had before inhabited the land it was called desolate. [c]1450216504[/c] [c]1450312101[/c] [c]1450304601[/c] And there being but little timber upon the face of the land, nevertheless the people who went forth became exceedingly expert in the working of cement; [c]1450418101[/c] [i]3305[/i] [c]1450405301[/c] [c]1450412101[/c] [c]1450406401[/c] [c]1450413101[/c] therefore they did build houses of cement, [v]56[/v] [c]1450211101[/c] [c]1450404601[/c] [c]1450404101[/c] [c]1450413102[/c] in the which they did dwell.</p>
