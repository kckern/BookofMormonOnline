                        notes:
                          - id: '1452419301'
                            text: The narrator comments on the universality of God’s mercy, drawing on distinctive biblical phrasing. The three “thus we see” observations are evocative, even if they do not exactly fit the narrative.
                          - id: '1452518101'
                            title: 'What is the “gate of heaven”? '
                            text: <p class="commentary">“Assisted; relieved” (Webster, <em>American Dictionary</em>).</p></div>
                          - id: '1452519301'
                            title: “Gate of heaven”
                            text: Only here and Gen 28.17.
                          - id: '1452619201'
                            title: “and lead the man of Christ in a strait”
                            text: '&#119979; <em>whosoever will lay hold</em>; 1920 whosoever will may lay hold'
                          - id: '1452619202'
                            text: '&#119979;, 1981 strait [though the 1920 reading <em>straight</em> is probably correct; see the discussion in ATV]'
                          - id: '1452619301'
                            text: The image of <i>lay(ing) hold upon the word of God</i> to follow a <i>straight and narrow</i> path echoes Lehi’s vision, along with Nephi’s interpretation; see 1 Ne 8.19–22;11.24–25.
                          - id: '1452619302'
                            title: “The word of God, which is quick and powerful, which shall divide asunder”
                            text: 'Heb 4.12, where the image of a sword is explicit. In that verse, God’s word could be lethal, separating spirits from bodies; here it cuts through the devil’s ploys and allows Christians to make their way to heaven. There is thus a double image here: from the perspective of Heb 4.12, <i>lay hold</i> suggests wielding the word of God like a weapon against the devil; from the perspective of 1 Ne 8, one may <i>lay hold</i> of the word as if it were a handrail leading one to God’s kingdom.'
                          - id: '1452619303'
                            text: <i>“Quick and powerful”</i>, “living and active” (NRSV).
                          - id: '1452619304'
                            title: “Wiles of the devil”
                            text: Only Eph 6.11 and here, where it is conflated with “snare of the devil” from 1 Tim 3.7.
                          - id: '1452619305'
                            title: “The man of Christ”
                            text: Unique here.
                          - id: '1452719301'
                            title: “In the kingdom of heaven, to sit down with Abraham, and Isaac, and with Jacob”
                            text: Mt 8.11; Alma 5.24; 7.25. The two BoM parallels include all “the holy prophets” in that gathering, which is here changed to <i>all our holy fathers” (unique here), perhaps referring to the luminaries of Nephite history.
