                        notes:
                          - id: '1464619301'
                            text: In this series of three “thus we see” comments, the second and third expand on elements in the first. There was a similar series at Helaman 3.27–29, toward the beginning of original ch. II (which ends here).
                          - id: '1464619302'
                            title: “Statutes and commandments”
                            text: See Helaman 3.20n. The narrator has used Deuteronomistic phrasing before to describe the righteousness of converted Lamanites; see Alma 25.14.
                          - id: '1464619303'
                            text: <i>“Walk in truth and uprightness before him”</i> echoes a description of King David at 1 Kings 3.6.
                          - id: '1464711101'
                            title: “Because of Their Easiness and Willingness to Believe in His Words”
                            text: <p>Now we come to a verse that is the highest possible compliment to the Lamanites.</p>
                          - id: '1464719301'
                            text: This was also the narrator’s assessment at Helaman 4.24.
                          - id: '1464819301'
                            title: “Easiness”
                            text: 'WB: “readiness to comply; prompt compliance.”'
                  - weight: 8
                    type: 'N'
                    narration:
                      description: The {Lamanites|lamanites} initiate outreach programs to help the {Nephites|nephites} repent, but they are largely ineffective—the {Nephites|nephites} continue increasing in wickedness.
                      text:
                        guid: 4becc782311b6
                        slug: gadianton/90
                        heading: Helaman 6:37–41
                        content: <p>And it came to pass that the Lamanites did hunt the band of robbers of Gadianton; [c]1464904601[/c] [c]1464904101[/c] [c]1464912101[/c] and they did preach the word of God among the more wicked part of them, [c]1464908201[/c] insomuch that this band of robbers was utterly destroyed from among the Lamanites. [c]1464916502[/c] [c]1464916501[/c] [c]1464911101[/c] </p> <p>And it came to pass on the other hand, that the Nephites did build them up and support them, [c]1465016501[/c] [c]1465107201[/c] beginning at the more wicked part of them, until they had overspread all the land of the Nephites, and had seduced the more part of the righteous until they had come down to believe in their works and partake of their spoils, [c]1465004601[/c] and to join with them in their secret murders and combinations. [c]1465011101[/c] [c]1463001201[/c] </p> <p>And thus they did obtain the sole management of the government, [c]1465012101[/c] insomuch that they did trample under their feet and smite and rend and turn their backs upon [c]1465116501[/c] the poor and the meek, [c]1465012102[/c] [c]1465104101[/c] and the humble followers of God. [c]1465104801[/c] [c]1465104601[/c] And thus we see that they were in an awful state, and ripening for an everlasting destruction. [c]1464318101[/c] [c]1464604801[/c] [c]1465204601[/c] [c]1465204101[/c] And it came to pass that thus ended the sixty and eighth year of the reign of the judges over the people of Nephi. [c]1464904801[/c] [c]1464606401[/c] </p>
                        duration: 63
