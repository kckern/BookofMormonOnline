                        notes:
                          - id: '1498819301'
                            title: “Compelled…to take up arms”
                            text: It is not clear whether the compulsion came from the dire circumstances or from the Nephites, but in either case this marks the end of the pacifism that characterized the Anti-Nephi-Lehite converts and their spiritual followers (Alma 24.5–27; Hel 5.51; 15.9).
                          - id: '1499019301'
                            text: After taking up weapons (in contrast to Alma 53.14–15), these Lamanite converts will become indistinguishable from the Nephites. Once again, lighter skin color is associated with righteousness, or at least with the religious heritage of the Nephites—since the Nephites themselves have not always been righteous; cf. 3 Nephi 2:18. The fact that the transformation seems more pronounced among their children suggests that intermarriage was a factor in ethnic assimilation.
                          - id: '1499019302'
                            title: “Their curse”
                            text: See 2 Ne 5.21–23;Alma 3.6–10.
                          - id: '1499205401'
                            title: “And Were Called Nephites”
                            text: <p>Were called Nephites] See Jacob 1:14.</p>
                          - id: '1499219201'
                            title: “And thus ended the thirteenth year”
                            text: +13 years; see v. 11 above
                  - weight: 3
                    type: 'N'
                    narration:
                      description: The {Nephites|nephites} fight, are are able to regain some of their territory.
                      text:
                        guid: 4becc782368dd
                        slug: gadianton/128
                        heading: 3 Nephi 2:17–19
                        content: <p>And it came to pass in the commencement of the fourteenth year, the war between the robbers and the people of Nephi did continue and did become exceedingly sore; [c]1499304101[/c] nevertheless, the people of Nephi did gain some advantage of the robbers, [c]1499316501[/c] insomuch that they did drive them back out of their lands into the mountains and into their secret places.</p> <p>And thus ended the fourteenth year. And in the fifteenth year [c]1499504601[/c] [c]1499504101[/c] they did come forth against the people of Nephi; [c]1499416501[/c] [c]1499304601[/c] and because of the wickedness of the people of Nephi, and their many contentions and dissensions, the Gadianton robbers did gain many advantages over them. [i]3350[/i] [c]1499311101[/c] And thus ended the fifteenth year, and thus were the people in a state of many afflictions; [c]1499302701[/c] and the sword of destruction did hang over them, [c]1499518101[/c] [c]1499305401[/c] insomuch that they were about to be smitten down by it, and this because of their iniquity. [c]1499304801[/c] [c]1499507201[/c] </p>
