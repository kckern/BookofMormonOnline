                        notes:
                          - id: '1463019201'
                            title: “had been formed by Kishkumen and Gadianton”
                            text: See Hel 2.1–11 for the story of their origins. At the end of that passage, dated to a period some twenty-five years previous, the robbers fled into the wilderness; nothing has been reported of them since, until this verse.
                          - id: '1463019301'
                            text: See Helaman 2.1–11for the story of the Gadianton band’s origins. At the end of that passage, dated to a period some twenty-five years previous, the robbers fled into the wilderness; nothing has been reported of them since, until this verse. It is unclear why the robbers were named after Gadianton rather than Kishkumen, their first founder, though in Helaman 6:26 it appears that their oaths and rituals had been created by Gadianton; cf. Helaman 11.26.
                  - weight: 4
                    type: 'N'
                    narration:
                      description: The {Lamanites|lamanites} try to counter the influence of the {Gadianton|gadianton} robbers, but it is of no use.
                      text:
                        guid: 4becc7822fc68
                        slug: gadianton/80
                        heading: Helaman 6:20–21
                        content: <p>And now it came to pass that when the Lamanites found that there were robbers among them they were exceedingly sorrowful; [c]1463204601[/c] and they did use every means [c]1463216501[/c] in their power to destroy them off the face of the earth. [c]1463216502[/c] But behold, Satan did stir up the hearts of the more [c]1463316501[/c] part of the Nephites, [c]1463205301[/c] [c]1463204101[/c] [c]1463313101[/c] insomuch that they did unite with those bands of robbers, [c]1463308201[/c] and did enter into their covenants and their oaths, that they would protect and preserve one another in whatsoever difficult circumstances they should be placed, [c]1463318101[/c] [c]1463204801[/c] [c]1463316502[/c] that they should not suffer for their murders, [c]1463211101[/c] and their plunderings, and their stealings. [c]1463304601[/c] [c]1463304101[/c] </p>
