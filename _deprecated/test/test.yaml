                        heading: Helaman 5:27–28
                        content: <p>And behold, when they had said these words, the earth shook exceedingly, [c]1458704601[/c] [c]1458704101[/c] and the walls of the prison did shake as if they were about to tumble to the earth; [c]1458617101[/c] but behold, they did not fall. And behold, they that were in the prison were Lamanites and Nephites who were dissenters. [c]1458704801[/c] And it came to pass that they were overshadowed with a cloud of darkness, and an awful solemn fear came upon them. [i]1756[/i] [c]1458611101[/c]</p>
