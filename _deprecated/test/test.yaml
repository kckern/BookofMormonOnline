                        notes:
                          - id: '1464911101'
                            title: “Insomuch That This Band of Robbers Was Utterly Destroyed from Among the Lamanites”
                            text: <p>By way of contrast the Nephites had not fought the Gadiantons, they had joined them.</p>
                          - id: '1464919201'
                            title: “and they did preach the word of God among the more wicked part of them”
                            text: Perhaps Mormon<sup>2</sup> intended to write “among the less wicked part of them,” or perhaps he meant the more wicked part of the Lamanites rather than the robbers; see the discussion in ATV.
                          - id: '1465019301'
                            text: The “down” in <i>come down to believe</i> is unexpected; perhaps it rhetorically balances the <i>build them up</i> earlier in the verse.
                          - id: '1465119201'
                            title: “and the humble followers”
                            text: '&#119979; <em>the meek and humble followers</em>'
                          - id: '1465119301'
                            title: “Sole”
                            text: Unshared, exclusive. The verse combines several metaphors for ill treatment of the poor, though some of the actions may have been literal as well.
                          - id: '1465319201'
                            title: “the sixty and eighth year of the reign of the judges over the people of Nephi”
                            text: −24 years; see v. 33 above
