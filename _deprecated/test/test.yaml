                      text:
                        guid: 4becc7822e13e
                        slug: gadianton/67
                        heading: Helaman 5:46–47
                        content: '<p>And it came to pass that there came a voice unto them, yea, a pleasant voice, as if it were a whisper, [c]1460612101[/c] saying: </p> <blockquote><p>“Peace, peace be unto you, [i]1767[/i] [c]1460705302[/c] [c]1460712101[/c] [c]1460604101[/c] <br />_because of your faith in my Well Beloved, [c]1460705301[/c] [c]1460604601[/c] <br />_who was from the foundation of the world.” [c]1460716501[/c] [c]1460713101[/c] </p> </blockquote>'
