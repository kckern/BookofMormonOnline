                        content: <p>And it came to pass in the fifty and third year of the reign of the judges, Helaman died, and his eldest son Nephi began to reign in his stead. [c]1453418101[/c] [i]3308[/i] [c]1453404101[/c] [c]1453407201[/c] And it came to pass that he did fill the judgment–seat with justice and equity; [c]1453211101[/c] yea, he did keep the commandments of God, [c]1453404601[/c] and did walk in the ways of his father. [c]1453104801[/c] </p>
