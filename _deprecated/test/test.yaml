                            title: “That same being who did entice our first parents”
                            text: See Gen 3.1–5. The phrase <i>that same being”
                          - id: '1463919301'
                            text: On Cain’s murder of Abel, see Gen 4.1–16. The biblical account says nothing about Satan or a plot to keep the killing secret, though the idea appears in more detail in the LDS Book of Moses at Helaman 5.28–31, 47–52.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: The {devil|satan} has been the motivating influence of many previous evil deeds.
                      text:
                        guid: 4becc782305e6
                        slug: gadianton/84
                        heading: Helaman 6:28
                        content: <p>And also it is that same being who put it into the hearts of the people to build a tower sufficiently high that they might get to heaven. [c]1464004101[/c] And it was that same being who led on the people who came from that tower into this land; [c]1464016501[/c] who spread the works of darkness and abominations over all the face of the land, until he dragged the people down to an entire destruction, and to an everlasting hell.</p>
