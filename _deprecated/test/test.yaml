                      text:
                        guid: 4becc78238307
                        slug: gadianton/145
                        heading: 3 Nephi 3:23–24
                        content: <p>And the land which was appointed was the land of Zarahemla, [c]1501813101[/c] and the land which was between the land Zarahemla and the land Bountiful, [c]1501816501[/c] [c]1501813102[/c] [c]1501804601[/c] yea, to the line which was between the land Bountiful and [c]1501816503[/c] the land Desolation. [c]1501816502[/c] [c]1501711101[/c] [c]1501813103[/c] </p> <p>And there were a great many thousand people who were called Nephites, [c]1501818101[/c] [c]1501907201[/c] who did gather themselves together in this land. [c]1501804101[/c] Now Lachoneus did cause that they should gather themselves together in the land southward, because of the great curse which was upon the land northward. [c]1501904601[/c] [c]1501904101[/c] </p>
