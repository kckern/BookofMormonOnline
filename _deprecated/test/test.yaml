                            text: <p>This was a decisive victory and it changed everything.</p>
                          - id: '1504519301'
                            title: “Being aware of their design”
                            text: The source of Gidgiddoni’s information is unspecified; it could have come from scouts or spies or revelation; see 3 Nephi 3.19.
                  - weight: 5
                    type: 'N'
                    narration:
                      description: The {Gadianton robbers|gadianton-robbers} surrender, {Zemnarihah|zemnarihah} is executed, and the righteous pray for protection and grace.
                      text:
                        guid: 4becc78239f91
                        slug: gadianton/158
                        heading: 3 Nephi 4:27–29
                        content: '<p>And there were many thousands who did yield themselves up prisoners unto the Nephites, and the remainder of them were slain. And their leader, Zemnarihah, [c]1504907201[/c] was taken and hanged upon a tree, [i]3367[/i] [c]1504905401[/c] [c]1504804601[/c] [c]1504913101[/c] [c]1504804101[/c] [c]1504912101[/c] yea, even upon the top thereof until he was dead. [c]1504917102[/c] And when they had hanged him until he was dead they did fell the tree to the earth, [v]120[/v] [i]3368[/i] and did cry with a loud voice, saying: [c]1504913102[/c] </p> <blockquote><p>“May the Lord preserve his people in righteousness and in holiness of heart, [c]1504918101[/c] [c]1504904801[/c] [c]1505013101[/c] that they may cause to be felled to the earth all who shall seek to slay them because of power and secret combinations, [c]1505004101[/c] even as this man hath been [c]1504916501[/c] felled to the earth.” [c]1505004601[/c] </p> </blockquote>'
                        duration: 37
                        quotes: []
