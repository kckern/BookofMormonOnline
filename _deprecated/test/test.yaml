                      description: The church sees significant growth and progress, with tens of thousands baptized, and an unprecedented outpouring of blessings.
                      text:
                        guid: 4becc782286b6
                        slug: gadianton/18
                        heading: Helaman 3:24–26
                        content: <p>And it came to pass that in this same year there was exceedingly great prosperity in the church, [c]1452101201[/c] [c]1452006401[/c] [c]1452109101[/c] insomuch that there were thousands who did join themselves unto the church and were baptized unto repentance. [c]1452017102[/c] [c]1452111101[/c] And so great was the prosperity of the church, [c]1452105301[/c] [c]1452104101[/c] [c]1452104601[/c] and so many the blessings which were poured out upon the people, that even the high priests and the teachers were themselves astonished beyond measure. [c]1452118101[/c] [c]1452212101[/c] And it came to pass that the work of the Lord did prosper [c]1452316501[/c] unto the baptizing and uniting to the church of God, [i]3307[/i] [c]1451911101[/c] [c]1452204101[/c] many souls, yea, even tens of thousands. [c]1452004801[/c] [c]1451405301[/c] </p>
