              - title: Helaman’s Tenure as Judge
                slug: gadianton/helamans-tenure-as-judge
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: Despite some unrest among the {Nephite|nephites} citizens, {Helaman|helaman3} continues to rule as chief judge with fairness and honor.
                      text:
                        guid: 4becc7822802d
                        slug: gadianton/15
                        heading: Helaman 3:18–20
                        content: <p>The forty and sixth year of the reign of the judges ended; [c]1451416501[/c] [c]1451504101[/c] and it came to pass that there was still great [c]1451616501[/c] contention in the land, [c]1451604601[/c] [c]1451404601[/c] yea, even in the forty and seventh year, and also in the forty and [c]1451616502[/c] eighth year. [c]1451604101[/c] </p> <p>Nevertheless Helaman did fill the judgment–seat with justice and equity; [i]3306[/i] [c]1451411101[/c] [c]1451708201[/c] [c]1451704601[/c] yea, he did observe to keep the statutes, and the judgments, and the commandments of God; and he did do that which was right in the sight of God continually; [c]1451718101[/c] [c]1451704101[/c] [c]1451701201[/c] and he did walk after the ways of his father, insomuch that he did prosper in the land.</p>
                        chrono: roj_plural|46-48
