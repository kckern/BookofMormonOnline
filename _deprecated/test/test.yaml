                      description: '{Nephi|nephi2} and {Lehi|lehi4} are at the center of the pillar of fire, yet are not harmed.'
                      text:
                        guid: 4becc7822dd55
                        slug: gadianton/65
                        heading: Helaman 5:44
                        content: <p>And Nephi and Lehi [c]1460416501[/c] were in the midst of them; yea, they were encircled about; yea, they were as if [c]1460416502[/c] in the midst of a flaming fire, [i]3317[/i] [c]1458308201[/c] yet it did harm them not, neither did it take hold upon the walls of the prison; and they were filled with that joy which is unspeakable and full of glory. [c]1460317101[/c] [c]1460405301[/c]</p>
