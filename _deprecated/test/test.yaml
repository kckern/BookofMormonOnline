                  - weight: 20
                    type: 'N'
                    narration:
                      description: They all look up, see {angels|angels-to-nephi-and-lehi} coming out of heaven, and are charged to go forth faithfully.
                      text:
                        guid: 4becc7822e341
                        slug: gadianton/68
                        heading: Helaman 5:48–49
                        content: <p>And now, when they heard this they cast up their eyes as if to behold from whence the voice came; and behold, they saw the heavens open; [c]1460804101[/c] [c]1460804601[/c] and angels came down out of heaven and ministered unto them. [c]1460818101[/c] [i]1768[/i] [c]1460805301[/c] And there were about three hundred souls who saw and heard these things; [c]1460604801[/c] [c]1460916501[/c] [c]1460311101[/c] [c]1460805302[/c] and they were [c]1460916502[/c] bidden to go forth and marvel not, [c]1460911101[/c] [c]1460904601[/c] neither should they doubt. [c]1460904101[/c] </p>
                        duration: 21
