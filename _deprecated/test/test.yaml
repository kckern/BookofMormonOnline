                        notes:
                          - id: '1512905401'
                            title: “Even His Brother Did He Raise from the Dead”
                            text: This was his brother Timothy, a man later chosen to serve as one of the Nephite Twelve (see 3 Nephi 19:4).
                          - id: '1512919201'
                            title: “after he had been stoned and suffered death by the people”
                            text: Timothy; see 3 Ne 19.4
                          - id: '1512919301'
                            text: Nephi<sub >3</sub> is one of the most spirit-infused prophets in the BoM (cf. 3 Nephi 8.1), and also one of the least successful (3 Nephi 7:21). The only references to exorcism among the Nephites in the entire BoM occur in 3 Nephi 7:19 and 22.
                          - id: '1512919302'
                            title: “His brother”
                            text: Timothy; see 3 Nephi 19.4.
                          - id: '1512919303'
                            text: There is a shift here in BoM terminology with these first two instances of <i>in the name of Jesus</i>—a phrase that will recur seventeen more times before the end of the BoM (with one stray occurrence at Jacob 4.6). In the Bible, the phrase appears only in Acts (6x). The related expression “in the name of Christ” appears at 2 Ne 32.9; 33.12; and Enos 1.15, along with four more instances in Morm–Moro.
                  - weight: 3
                    type: 'N'
                    narration:
                      description: Only a few people convert back to the {Lord|god}, but those people enjoy blessings and miracles from {God|god}.
                      text:
                        guid: 4becc7823d763
                        slug: gadianton/184
                        heading: 3 Nephi 7:21–22
                        content: <p>And it came to pass that the thirty and first year did pass away, and there were but few who were converted unto the Lord; [c]1513104101[/c] [c]1513102701[/c] but as many as were converted did truly signify unto the people that they had been visited by the power and Spirit of God, which was in Jesus Christ, in whom they believed. [c]1513101201[/c] And as many as had devils cast out from them, and were healed of their sicknesses and their infirmities, [c]1513216501[/c] did truly manifest unto the people that they had been wrought upon by the Spirit of God, [c]1513104601[/c] and had been healed; [c]1513118101[/c] and they did show forth signs also and did do some miracles among the people. [c]1513104801[/c] [c]1513111101[/c] [c]1513105401[/c] </p>
                        duration: 36
                        quotes: []
                        people:
