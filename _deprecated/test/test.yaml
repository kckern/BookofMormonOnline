                  - weight: 3
                    type: 'N'
                    narration:
                      description: People begin to forget the signs and wonders they saw, and regress back into unbelief.
                      text:
                        guid: 4becc78235d7d
                        slug: gadianton/123
                        heading: 3 Nephi 2:1–2
                        content: <p>And it came to pass that thus passed away the ninety and fifth [c]1497716502[/c] year also, and the people began to forget those signs and wonders which they had heard, [c]1497711101[/c] [c]1497704101[/c] [c]1497702701[/c] and began to be less and less astonished at a sign [c]1497705401[/c] or a wonder from heaven, [c]1497712101[/c] insomuch that they began to be hard in their hearts, and blind in their minds, [c]1497818102[/c] [c]1497704801[/c] [c]1497717103[/c] [c]1497717102[/c] [c]1497712102[/c] and began to disbelieve all which they had heard and seen— [c]1497717104[/c] [c]1497716501[/c]Imagining up some vain thing in their hearts, [c]1497718101[/c] [c]1497704601[/c] [c]1497804101[/c] [c]1497701201[/c] that it was wrought by men and by the power of the devil, to lead away and deceive the hearts of the people; and thus did Satan get possession of the hearts of the people again, [c]1497818101[/c] [i]3348[/i] [c]1497811101[/c] [c]1497805401[/c] [c]1497812101[/c] insomuch that he did blind their eyes and lead them away to believe that the doctrine of Christ was a foolish and a vain thing. [c]1497807201[/c] </p>
