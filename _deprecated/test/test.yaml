                        notes:
                          - id: '1454519301'
                            text: This section offers another perspective on the events of Helaman 4:4–10. Note that Helaman 4:10 and 17 both end in the sixty-first year; cf. Alma 50.35–40; Hel 11.32–35. In this passage Mormon introduces the idea of the pride cycle, as it comes to the conclusion of its first iteration. There will be four more repetitions of the cycle.
                          - id: '1454519302'
                            title: “Who professed to belong to the church of God”
                            text: The same people who were mentioned at Helaman 3.33.
                          - id: '1454619201'
                            title: “and deserting”
                            text: '&#119979; <em>dissenting</em>'
                          - id: '1454619301'
                            text: This list offers a comprehensive overview of BoM ethical standards, which cover social justice, religious adherence, and criminal law. The condemnation of those who enjoy their wealth while neglecting the poor and the needy is characteristic of BoM morality.
                          - id: '1454719301'
                            title: “Boastings in their own strength”
                            text: never end well for the Nephites; see Mos 11.19;Morm 3.9;4.8. <i>They were left in their own strength” By God, in response to their boasting that they already had what they needed.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: '{Moronihah|moronihah1}, {Nephi|nephi2}, and {Lehi|lehi4} join forces in preaching repentance to the {Nephites|nephites}; as the people repent, {Moronihah|moronihah1} is able to regain one half of their original land.'
                      text:
                        guid: 4becc7822a060
                        slug: gadianton/30
                        heading: Helaman 4:14–17
                        content: <p>But behold, Moronihah did preach many things unto the people because of their iniquity, [c]1454804601[/c] [c]1454812101[/c] and also Nephi and Lehi, who were the sons of Helaman, did preach many things unto the people, [i]3310[/i] yea, and did prophesy many things unto them concerning their iniquities, and what should come unto them if they did not repent of their sins. [c]1454817102[/c] [c]1454805301[/c] And it came to pass that they did repent, and inasmuch as they did repent they did begin to prosper. [c]1454905301[/c] [c]1455007201[/c]</p> <p>For when Moronihah saw that they did repent he did venture to lead them forth from place to place, [c]1454804801[/c] [c]1454804101[/c] and from city to city, even until they had regained the one–half of their property and the one–half of all their lands. [c]1455016502[/c] [c]1455016501[/c] [c]1454811101[/c] And thus ended the sixty and first year of the reign of the judges.</p>
                        duration: 46
