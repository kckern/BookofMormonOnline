                        notes:
                          - id: '1458019301'
                            text: Several elements of this incident—including an earthquake, unnatural darkness, and a quiet yet piercing voice from heaven repeating a message three times—prefigure the coming of Jesus to the combined Nephites and Lamanites at 3 Ne 8 and 11.
                          - id: '1458019302'
                            text: The <i>land of Nephi</i> has been in Lamanite hands for nearly 200 years.
                          - id: '1458119301'
                            title: “That same prison”
                            text: See Mos 7.7;21.23; this detail appears to have been included as an intriguing historical coincidence.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: As the {Lamanites|lamanites} come into the prison to execute {Nephi|nephi2} and {Lehi|lehi4}, a wall of fire and flames encircle {Nephi|nephi2} and {Lehi|lehi4}.
                      text:
                        guid: 4becc7822c03a
                        slug: gadianton/50
                        heading: Helaman 5:23
                        content: <p>And it came to pass that Nephi and Lehi were encircled about as if by fire, [i]1754[/i] [i]1079[/i] [c]1458305301[/c] [c]1458006401[/c] [c]1458304101[/c] even insomuch that they durst not lay their hands upon them for fear lest they should be burned. Nevertheless, Nephi and Lehi were not burned; [c]1458318101[/c] and they were as standing in the midst of fire [c]1458316501[/c] and were not burned. [c]1458201101[/c]</p>
