                            text: Several elements of this incident—including an earthquake, unnatural darkness, and a quiet yet piercing voice from heaven repeating a message three times—prefigure the coming of Jesus to the combined Nephites and Lamanites at 3 Ne 8 and 11.
                          - id: '1458019302'
                            text: The <i>land of Nephi</i> has been in Lamanite hands for nearly 200 years.
                          - id: '1458119301'
                            title: “That same prison”
