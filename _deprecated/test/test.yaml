                    narration:
                      description: The {Nephites|nephites} also periodically dispatched troops to eliminate {Gadianton robbers|gadianton-robbers}—seeing his efforts are futile, {Zemnarihah|zemnarihah} orders a withdrawal, and he begins to lead his people to the [land northward|land-of-desolation].
                      text:
                        guid: 4becc78239b2b
                        slug: gadianton/156
                        heading: 3 Nephi 4:21–23
                        content: <p>And the Nephites were continually marching out by day and by night, and falling upon their armies, and cutting them off by thousands and by tens of thousands. And thus it became the desire of the people of Zemnarihah to withdraw from their design, [c]1504302701[/c] because of the great destruction which [c]1504316501[/c] came upon them by night and by day. And it came to pass that Zemnarihah did give command unto his people that they should withdraw themselves from the siege, [c]1504416501[/c] [c]1504304601[/c] [c]1504304101[/c] and march into the furthermost parts of the land northward. [c]1504204801[/c] [c]1504416503[/c] [i]3365[/i] [c]1504413101[/c] </p>
