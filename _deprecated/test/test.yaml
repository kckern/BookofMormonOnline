                        notes:
                          - id: '1495019201'
                            title: “And it came to pass that in the commencement of the ninety and second year”
                            text: '#ERROR!'
                          - id: '1495019301'
                            text: This episode may function as a typological precedent for latter-day readers who might feel that the time for Jesus’s second coming has passed (compare 3 Nephi 1:6 with 3 Nephi 29.2–3; the book of 3 Nephi is framed by concerns about unfulfilled prophecies of Christ’s coming). Of course, Christians have been responding to skeptics of Christ’s return since NT times; see 2 Pet 3.1–13.
                          - id: '1495119301'
                            title: “Which were spoken by Samuel”
                            text: See Hel 14.2. The chronological ambiguity noted at Hel 16.9n has consequences here.
                  - weight: 3
                    type: 'N'
                    narration:
                      description: Controversy spreads through the land—the people become anxious to see the night that will be light as day.
                      text:
                        guid: 4becc782348d0
                        slug: gadianton/114
                        heading: 3 Nephi 1:7–8
                        content: <p>And it came to pass that they did make a great uproar throughout the land; [c]1495004801[/c] [i]3341[/i] and the people who believed began to be very sorrowful, [c]1495305401[/c] [c]1495204601[/c] lest by any means those things which had been spoken might not come to pass. [i]1790[/i] But behold, they did watch steadfastly for that day and that night and that day which [c]1495416502[/c] should be as one day as if there were no night, [c]1495409101[/c] [c]1495413101[/c] that they might know that their faith had not been [c]1495416501[/c] vain. [i]1791[/i] [c]1495311101[/c] [c]1495404101[/c]</p>
