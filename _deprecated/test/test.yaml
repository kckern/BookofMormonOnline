                  - weight: 2
                    type: 'N'
                    narration:
                      description: Together, the {Nephites|nephites} and {Lamanites|lamanites} prosper substantially,  partially due to the abundance of precious ore in the land.
                      text:
                        guid: 4becc7822f238
                        slug: gadianton/75
                        heading: Helaman 6:9–11
                        content: <p>And it came to pass that they became exceedingly rich, both the Lamanites and the Nephites; and they did have an exceeding plenty of gold, and of silver, [c]1461904801[/c] [c]1462304601[/c] and of all manner of precious metals, [c]1462116501[/c] both in the land south and in the land north. [c]1461917102[/c] [c]1461911101[/c] </p> <p>Now the land south was called Lehi and the land north was called Mulek, [c]1462204801[/c] [c]1462213101[/c] [c]1462212101[/c] [c]1462204601[/c] which was after the son of Zedekiah; [v]119[/v] for the Lord did bring Mulek into the land north, and Lehi into the land south. And behold, there was all manner of gold in both these lands, [c]1462304101[/c] and of silver, and of precious ore of every kind; [c]1462313101[/c] and there were also curious workmen, who did work all kinds of ore and did refine it; and thus they did become rich. [c]1462004601[/c] </p>
