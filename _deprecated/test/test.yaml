                        notes:
                          - id: '1502319301'
                            text: Without settled agriculture or domesticated animals, the robbers lead a hunter-gatherer existence that, given the terrain and their numbers, is unsustainable unless supplemented by plunder.
                          - id: '1502519301'
                            title: “For the space of seven years”
                            text: The robbers are defeated within four years (3 Nephi 5.4–7), though the Nephites do not return to their personal lands for eight years, at which time they still have some provisions left; see 3 Nephi 6.1–2. Seven years of provisions echoes the story of Joseph in Egypt; see Gen 41.35–36.
                  - weight: 3
                    type: 'N'
                    narration:
                      description: Seeing that there is nothing to rob and plunder, and that the risk is too high to try to homestead or colonize the deserted land, {Giddianhi|giddianhi} decides to attack the {Nephites|nephites} and {Lamanites|lamanites} in their central location.
                      text:
                        guid: 4becc78238c16
                        slug: gadianton/149
                        heading: 3 Nephi 4:5–6
                        content: <p>And it came to pass [c]1502616501[/c] that in the nineteenth year Giddianhi found that it was expedient that he should go up to battle against the Nephites, [c]1502604601[/c] [c]1502604101[/c] for there was no way [c]1502616502[/c] that they could subsist save it were to plunder and rob and murder. [c]1502517101[/c] And they durst not spread themselves upon the face of the land insomuch that they could raise grain, [c]1502712101[/c] lest the Nephites should come upon them and slay them; therefore Giddianhi gave commandment unto his armies that in this year they should go up to battle against the Nephites. [i]3362[/i] </p>
                        chrono: coc|19
                        duration: 29
                        quotes: []
