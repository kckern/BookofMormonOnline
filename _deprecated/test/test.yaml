                        notes:
                          - id: '1496919301'
                            text: <i>“Baptism”</i> is connected to <i>“remission of sins”</i> at Mk 1.4; Lk 3.3; Acts 2.38; and seven times in the BoM. This verse is the first time the combination occurs in the BoM, aside from 2 Ne 31.17.
                  - weight: 5
                    type: 'N'
                    narration:
                      description: Some erroneously teach that the law of {Moses|moses} should not be observed, not understanding that it had not yet been fulfilled.
                      text:
                        guid: 4becc78235645
                        slug: gadianton/120
                        heading: 3 Nephi 1:24–26
                        content: <p>And there were no contentions, [c]1497009101[/c] save it were a few that began to preach, [c]1497211101[/c] [c]1497004101[/c] endeavoring to prove by the scriptures that it was no more expedient to observe the law of Moses. [c]1497003101[/c] [c]1497004601[/c] Now in this thing they did err, having not understood the scriptures. [c]1497004801[/c] [c]1497005401[/c] [c]1497104101[/c] But it came to pass that they soon became converted, and were convinced of the error which they were in, for it was made known unto them that the law was not yet fulfilled, [c]1497104801[/c] [c]1497011101[/c] and that it must be fulfilled in every whit; yea, the word came unto them that it must be fulfilled; [c]1497018101[/c] yea, that one jot or tittle should not pass away till it should all be fulfilled; [c]1497116501[/c] [c]1497104601[/c] therefore in this same year were they brought to a knowledge of their error and did confess their faults. And thus the ninety and second year did pass away, bringing glad tidings [i]1803[/i] unto the people [c]1497216501[/c] because of the signs which did come to pass, according to the words of the prophecy of all the holy prophets. [c]1497216502[/c] </p>
                        duration: 56
