                        slug: gadianton/51
                        heading: Helaman 5:24–25
                        content: <p>And when they saw that they were encircled about with a pillar of fire, [i]3314[/i] [c]1458405301[/c] and that it burned them not, [i]1185[/i] their hearts did take courage. [c]1458317102[/c] [c]1458304601[/c] For they saw that the Lamanites durst not lay their hands upon them; [c]1458304801[/c] neither durst they come near unto them, but stood as if they were struck dumb with amazement. [c]1458011101[/c] </p>
