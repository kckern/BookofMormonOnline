                          - id: '1461819301'
                            text: Nephi will return six years later; his story continues at Helaman 7.1. There is no record of Lehi’s return, though he seems to be back in Zarahemla at Helaman 11.19, 23. The people in the land northward are those described at Helaman 3.3–12; cf. Alma 63.4–6.
              - title: Nephite and Lamanite Intermixing
                slug: gadianton/nephite-and-lamanite-intermixing
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: Diplomatic relations between {Nephites|nephites} and {Lamanites|lamanites} improve dramatically, evidenced by a free–trade agreement established between them.
                      text:
                        guid: 4becc7822f031
                        slug: gadianton/74
                        heading: Helaman 6:7–8
                        content: <p>And behold, there was peace in all the land, [i]3318[/i] [c]1461904101[/c] [c]1461906401[/c] [c]1461907201[/c] insomuch that the Nephites did go into whatsoever part of the land they would, [c]1461918101[/c] whether among the Nephites or the Lamanites. And it came to pass that the Lamanites did also go whithersoever they would, whether it were among the Lamanites or [c]1462016501[/c] among the Nephites; [c]1461916501[/c] and thus they did have free intercourse one with another, [c]1462018101[/c] [c]1461905301[/c] [c]1462013101[/c] to buy and to sell, [c]1462012101[/c] [c]1462004101[/c] and to get gain, according to their desire. [i]1772[/i] [c]1461913101[/c]</p>
                        duration: 27
                        quotes: []
