              - title: Signs Fulfilled
                slug: gadianton/signs-fulfilled
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: '{Nephi|nephi3}, greatly worried, prays mightily—{Jesus|jesus-christ} answers him, informing him that he will be born the following day.'
                      text:
                        guid: 4becc78234dab
                        slug: gadianton/116
                        heading: 3 Nephi 1:10–14
                        content: <p>Now it came to pass that when Nephi, [c]1495517101[/c] the son of Nephi, [i]1793[/i] saw this wickedness of his people, his heart was exceedingly sorrowful. [i]3342[/i] [c]1495605401[/c] [c]1495602701[/c] And it came to pass that he went out and bowed himself down upon the earth, [i]2993[/i] and cried mightily to his God in behalf of his people, [i]1794[/i] [c]1495604101[/c] [c]1495604601[/c] yea, those who were about to be de stroyed because of their faith in the tradition of their fathers. [c]1495404801[/c] [c]1495705401[/c] And it came to pass that he cried mightily unto the Lord, all that day; [c]1495816501[/c] [c]1495611101[/c] and behold, the voice of the Lord [c]1495805401[/c] came unto him, [i]1795[/i] saying:</p> <blockquote><p>“Lift up your head and be of good cheer; [c]1495717101[/c] [i]3343[/i] [c]1495808201[/c] for behold, the time is at hand, [c]1495804601[/c] [c]1495912101[/c] and on this night shall the sign be given, [c]1495804101[/c] [c]1495911101[/c] [c]1495913101[/c] and on the morrow come I into the world, [i]1189[/i] [c]1495803101[/c] [c]1495912102[/c] [c]1495907201[/c] to show unto the world that I will fulfill all that which I have caused to be spoken by the mouth of my holy prophets. [c]1496018101[/c] [c]1495916501[/c] [c]1495805402[/c] </p> <p>“Behold, I come unto my own, [i]2996[/i] to fulfill all things which I have made known [c]1496005403[/c] unto the children of men from the foundation of the world, [c]1496005401[/c] and to do the will, both of the Father and of the Son— [c]1496016501[/c] of the Father because of me, [c]1496012101[/c] [c]1496004601[/c] and of the Son because of my flesh. [c]1496005402[/c] [c]1496004101[/c] And behold, the time is at hand, and this night shall the sign be given.” [v]133[/v] [i]2994[/i] [c]1495809101[/c] </p> </blockquote>
