                  - weight: 3
                    type: 'N'
                    narration:
                      description: The non-believers attribute the vindicated prophesies to luck and coincidence.
                      text:
                        guid: 4becc78233d6d
                        slug: gadianton/109
                        heading: Helaman 16:15–16
                        content: <p>Nevertheless, the people began to harden their hearts, all save it were the most believing part of them, both of the Nephites and also of the Lamanites, and began to depend upon their own strength and upon their own wisdom, [c]1493604601[/c] [c]1493604101[/c] [c]1493601201[/c] [c]1493613101[/c] [c]1493612101[/c] saying:</p> <blockquote> <p>“Some things they may have guessed right, [c]1493712101[/c] <br />_among so many; [i]2989[/i] <br />_but behold, <br />_we know that all these great and marvelous [c]1493716501[/c] works <br />_cannot come to pass, [c]1493517102[/c] of which has been spoken.”</p> </blockquote>
                        duration: 24
                        quotes: []
                        people:
                          - slug: nephite-skeptics
                            name: Nephite Skeptics
                            title: Doubters of Prophetic Messages
                        places: []
                        refs: []
                        notes:
                          - id: '1493719301'
                            text: Skeptics suggest that a few accurate predictions may be ascribed to coincidence or shrewdness, while the bulk of prophecies remain wildly implausible.
                  - weight: 4
                    type: 'N'
                    narration:
                      description: The non believers argue that the {Messianic|jesus-christ} prophesies are not reasonable, and wonder why {Jesus|jesus-christ} won’t come and appear to them as well.
                      text:
                        guid: 4becc78233fa1
                        slug: gadianton/110
                        heading: Helaman 16:17–21
                        content: <p>And they began to reason and to contend among themselves, [c]1493618101[/c] [c]1493816501[/c] [c]1493912101[/c] [c]1493611101[/c] saying:</p> <blockquote> <p>“That it is not reasonable that such a being as a Christ shall come; [c]1493804101[/c] [c]1493605301[/c] [c]1493804601[/c] if so, and he be the Son of God, the Father of heaven and of earth, as it has been spoken, why will he not show himself unto us as well as unto [c]1493916501[/c] them who shall be at Jerusalem?</p> <p><span>“</span>Yea, why will he not show himself in this land as well as in the land [c]1494016501[/c] of Jerusalem? [c]1494004601[/c] [c]1494004101[/c] [c]1494012101[/c] But behold, we know that this is a wicked tradition, which has been handed down unto us by our fathers, to cause us that we should believe in some great and marvelous thing which should come to pass, but not among us, but in a land which is far distant, a land which we know not; therefore they can keep us in ignorance, for we cannot witness with our own eyes that they are true. [c]1493504801[/c] [c]1494104601[/c] [c]1494104101[/c] </p> <p><span>“</span>And they will, by the cunning and the mysterious arts of the evil one, [c]1494105301[/c] [c]1494204601[/c] [c]1494204101[/c] [c]1493301101[/c] work some great mystery which we cannot understand, [c]1494005301[/c] which will keep us down to be servants to their words, and also servants unto them, for we depend upon them to teach us the word; and thus will they keep us in ignorance if we will yield ourselves unto them, all the days of our lives.”</p> </blockquote>
                        duration: 72
                        quotes: []
                        people:
                          - slug: jesus-christ
                            name: Jesus Christ
                            title: Holy One of Israel
                          - slug: nephite-skeptics
