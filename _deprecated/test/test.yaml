                  - weight: 1
                    type: 'N'
                    narration:
                      description: '{Nephite|nephites} dissenters are driven out of the land, and entice the king of {Lamanites|lamanites} to go to war  against the {Nephites|nephites}, but the {Lamanites|lamanites} are fearfully reluctant.'
                      text:
                        guid: 4becc782295d1
                        slug: gadianton/25
                        heading: Helaman 4:1–3
                        content: <p>And it came to pass in the fifty and fourth year there were many dissensions in the church, and there was also a contention among the people, [c]1453504801[/c] [c]1453517102[/c] [c]1453504601[/c] [c]1453504101[/c] insomuch that there was much bloodshed. [c]1453417101[/c] [c]1453511101[/c] [c]1453604101[/c] And the rebellious part were slain and driven out of the land, [c]1453505301[/c] and they did go unto the king of the Lamanites. And it came to pass that they did endeavor to stir up the Lamanites to war against the Nephites; [c]1453704601[/c] but behold, the Lamanites were exceedingly afraid, [c]1453716501[/c] insomuch that they would not hearken to the words of those dissenters. [c]1453604601[/c] </p>
                        chrono: roj|54
                        duration: 31
