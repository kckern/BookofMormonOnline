                    type: 'N'
                    narration:
                      description: The following year, {Nephite|nephites} dissenters, now merged with the {Lamanites|lamanites}, initiate guerilla attacks on the {Nephites|nephites}.
                      text:
                        guid: 4becc78231647
                        slug: gadianton/91
                        heading: Helaman 11:24–25
                        content: <p>And it came to pass that in the eightieth year of the reign of the judges over the people of Nephi, there were a certain number of the dissenters from the people of Nephi, [c]1479406401[/c] [c]1479404101[/c] who had some years before gone over unto the Lamanites, and taken upon themselves the name of Lamanites, [c]1479416501[/c] and also a certain number who were real descendants of the Lamanites, being stirred up to anger by them, or by those dissenters, therefore they commenced a war with their brethren.</p> <p>And they did commit murder and plunder; [c]1479104801[/c] [c]1479417102[/c] and then they would retreat back into the mountains, [i]1124[/i] and into the wilderness and secret places, hiding themselves that they could not be discovered, receiving daily an addition to their numbers, inasmuch as there were dissenters that went forth unto them. [c]1479516501[/c] [v]117[/v] [i]1773[/i] [c]1479411101[/c] [c]1479405301[/c] [c]1479409101[/c]</p>
                        chrono: roj|80
