                        notes:
                          - id: '1459519301'
                            text: The resurrected Jesus refers to this event as being “baptized with fire and with the Holy Ghost” at 3 Ne 9.20, and Moroni reiterates this interpretation at Ether 12.14.
                          - id: '1459519302'
                            text: Unexpectedly, someone who had left the church plays a key, positive role in this episode.
                          - id: '1459605301'
                            title: “They Did Shine Exceedingly, Even As the Faces of Angels”
                            text: Compare this experience with that of Moses (Exodus 34:29-35), Abinadi (Mosiah 13:5), and Stephen (Acts 6:15).
                          - id: '1459619301'
                            title: “Turned him about”
                            text: Apparently in an attempt to flee, he was facing the exit, as were the people in Helaman 5:37.
                          - id: '1459619302'
                            title: “Faces…shine exceedingly”
                            text: A detail reminiscent of Moses at Ex 34.29–35, and Abinadi at Mos 13.5.
                          - id: '1459919301'
                            title: “They do converse with the angels”
                            text: An example of the phenomenon described by Alma at Alma 12.29; cf. Helaman 5:11 above.
                  - weight: 11
