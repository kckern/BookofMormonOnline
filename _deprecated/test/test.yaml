                        notes:
                          - id: '1495919301'
                            text: 'The Lord’s words are framed by an inclusio: <i>behold, the time is at hand and on this night shall the sign be given</i>.'
                          - id: '1495919302'
                            text: Note that the premortal Christ is speaking on the day before he is born; he is not, as yet, fully embodied.
                          - id: '1495919303'
                            title: “Lift up your head and be of good cheer, for behold, the time is at hand”
                            text: cf. Mos 7.18; 24.13, 16.
                          - id: '1495919304'
                            title: “Be of good cheer”
                            text: See Alma 17.31n.
                          - id: '1496019301'
                            title: “I come unto my own”
                            text: Jn 1.11; see 3 Ne 9.16n.
                          - id: '1496019302'
                            text: <i>“Of the Father because of me”</i> suggests that the premortal Christ identifies with the Father, while Jesus in the flesh is the Son. In any case, their wills are aligned. This represents a slight revision of Mos 15.1–7, where the will of the Son was subject to the will of the Father; here they are acting in complete harmony.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: That night, the sun goes down, but there is no darkness; many of the non–believers are astounded, and begin believing.
                      text:
                        guid: 4becc78234ff5
                        slug: gadianton/117
                        heading: 3 Nephi 1:15–18
                        content: <p>And it came to pass that the words which came unto Nephi were fulfilled, according as they had been spoken; for behold, at the going down of the sun there was no darkness; [c]1495717101[/c] [c]1496117102[/c] [i]3344[/i] [c]1496107201[/c] [c]1496104601[/c] and the people began to be astonished because there was no darkness when the night came. [c]1496116501[/c] [i]1796[/i] [c]1496311101[/c] [c]1496108201[/c] [c]1496104101[/c]</p> <p>And there were many, who had not believed the words of the prophets, [c]1496216501[/c] [c]1496105401[/c] who fell to the earth and became as if they were dead, [c]1495804801[/c] [i]1797[/i] [c]1496212101[/c] [c]1496204101[/c] [c]1496204601[/c] for they knew that the great plan of destruction which they had laid for those who believed in the words of the prophets had been frustrated; [c]1496118101[/c] [c]1496216502[/c] for the sign which had been given was already at hand.</p> <p>And they began to know that the Son of God must shortly appear; [c]1496218101[/c] [c]1496302701[/c] yea, in fine, all the people upon the face of the whole earth from the west to the east, [c]1496304601[/c] both in the land north and in the land south, were so exceedingly astonished that they fell to the earth. [c]1496316501[/c] [c]1496304101[/c] For they knew that the prophets had testified of these things for many years, and that the sign which had been given was already at hand; and they began to fear because of their iniquity and their unbelief. [i]1798[/i] [c]1496404601[/c] [c]1496404101[/c] [c]1496011101[/c]</p>
