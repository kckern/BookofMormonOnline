                      description: 609 years have passed since {Lehi|lehi1} left [Jerusalem|jerusalem-1].
                      text:
                        guid: 4becc78236180
                        slug: gadianton/125
                        heading: 3 Nephi 2:5–8
                        content: <p>And also an hundred years had passed away since the days of Mosiah, who was king over the people of the Nephites. [c]1498004801[/c] [c]1498017102[/c] And six hundred and nine years had passed away since Lehi left Jerusalem. [c]1498405401[/c] And nine years had passed away from the time [c]1498316501[/c] when the sign was given, [c]1498004601[/c] which was spoken of by the prophets, that Christ should come into the world. [c]1498108201[/c] Now the Nephites began to reckon their time from this period when the sign was given, [c]1498418101[/c] [c]1498311101[/c] [c]1498412101[/c] [c]1498004101[/c] [c]1498413101[/c] or from the coming of Christ; [c]1498413102[/c] therefore, nine years had passed away. [c]1498109101[/c] [c]1498103101[/c] [c]1498101101[/c]</p>
