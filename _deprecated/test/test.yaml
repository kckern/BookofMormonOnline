                  - weight: 6
                    type: 'N'
                    narration:
                      description: '{Lachoneus|lachoneus1} orders that all the {Nephites|nephites} and {Lamanites|lamanites} gather everything and everyone to a central location; he warns them to repent in order to be saved.'
                      text:
                        guid: 4becc782376d9
                        slug: gadianton/140
                        heading: 3 Nephi 3:13–16
                        content: <p>Yea, he sent a proclamation among all the people, [i]3353[/i] that they should gather together their women, and their children, their flocks and their herds, and all their substance, save it were their land, unto one place. [c]1500804601[/c] [c]1500804101[/c] And he caused that fortifications should be built round about them, and the strength thereof should be exceedingly great. [i]1125[/i] [c]1500705401[/c] And he caused that armies, both of the Nephites and of the Lamanites, or of all them who were numbered among the Nephites, [c]1500913101[/c] should be placed as guards round about to watch them, [i]3354[/i] and to guard them from the robbers day and night. [c]1500916501[/c] Yea, he said unto them:</p> <blockquote><p>“As the Lord liveth, [c]1501018101[/c] except ye repent of all your iniquities, and cry unto the Lord, ye will in no wise be delivered out of the hands of those Gadianton robbers.” [c]1501016501[/c] [c]1501004101[/c] </p> </blockquote> <p>And so great and marvelous were the [c]1501116501[/c] words and prophecies of Lachoneus that they did cause fear to come upon all the people; [c]1501004601[/c] and they did exert themselves in their might to do according to the words of Lachoneus. [i]3355[/i] [c]1500811101[/c] </p>
