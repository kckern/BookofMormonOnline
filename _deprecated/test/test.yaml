                          - id: '1450019301'
                            text: Internal conflict leads to out-migration. The new pioneers are following the example of those at Alma 63.4–9; cf. Helaman 50.29.
                          - id: '1450119301'
                            text: The land northward is described as well watered, but deforested and sparsely inhabited due to environmental degradation caused by the Jaredites, more than a century earlier. The earliest reference to their land being called “Desolation” was at Alma 22.30–32.
