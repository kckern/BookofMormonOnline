                            significant: 0
                        notes:
                          - id: '1493919301'
                            text: Readers familiar with the basic narrative of the BoM will recognize the irony in these words, since Christ will appear to the Nephites during the lifetime of the children of those making these statements. Although Nephi<sub >1</sub> and Alma had prophesied that Christ would show himself to the Nephites after his resurrection (1 Ne 12.1–12; 2 Ne 26.1–9; Alma 16.20), Samuel did not mention this event, at least not in the prophecies recorded in the book of Helaman. Note also that at 3 Ne 11.8 the people seem surprised when the Lord appears.
                          - id: '1493919302'
                            title: “As it has been spoken”
                            text: See Helaman 14.12; cf.Mos 3.8.
                          - id: '1494019201'
                            title: “in the land of Jerusalem”
                            text: Although Nephi<sup>1</sup> and Alma<sup>2</sup> had prophesied that Christ would show himself to the Nephites after his resurrection (1 Ne 12.1–12; 2 Ne 26.1–9; Alma 16.20), Samuel<sup>2</sup> did not mention this event, at least not in the prophecies recorded here; note also that at 3 Ne 11.8 the people seem surprised when the Lord appears.
                          - id: '1494105301'
                            title: “The Cunning and the Mysterious Arts of the Evil One”
                            text: <p>Compare the rationalizations of Laman and Lemuel in 1 Nephi 16:38.</p>
                          - id: '1494119301'
                            text: The suspicion that Christian leaders were using religion to take advantage of the faithful was also articulated by Korihor at Alma 30.12–13, 23–27, 31 (Helaman 30.23 has the only other occurrence of “keep [someone] in ignorance”).
                          - id: '1494119302'
                            text: These nonbelievers recognize the convenience of a prophecy whose fulfillment cannot be verified.
                          - id: '1494119303'
                            title: “Cannot witness with our own eyes”
                            text: Once again, seeing is equated with believing; see Mos 1.6nand Korihor’s words at Alma 30.15.
                          - id: '1494219301'
                            title: “Cunning…arts”
                            text: 1 Ne 16.38, in a similar accusation made against Nephi<sub >1</sub>.
                  - weight: 5
                    type: 'N'
                    narration:
                      description: Despite the ongoing signs and wonders, many people still remain in a state on unbelief and wickedness.
                      text:
                        guid: 4becc782341ca
                        slug: gadianton/111
                        heading: Helaman 16:22–25
                        content: <p>And many more things did the people imagine up in their hearts, [c]1494313101[/c] which were foolish and vain; [c]1493804801[/c] and they were much disturbed, for Satan did stir them up to do iniquity continually; [c]1494318101[/c] [c]1494304101[/c] [c]1494312101[/c] [c]1494309101[/c] yea, he did go about spreading rumors and contentions [c]1494305301[/c] [c]1494504601[/c] upon all the face of the land , [c]1494312102[/c] that he might harden the hearts of the people against that which was good and against that which should come. [c]1494301201[/c] </p> <p>And notwithstanding the signs and the wonders which were wrought among the people of the Lord, and the many miracles which they did, [c]1494307201[/c] Satan did get great hold upon the hearts of the people upon all the face of the land. [c]1494211101[/c] [c]1494304601[/c] [c]1494607201[/c] And thus ended the ninetieth year of the reign of the judges over the people of Nephi. [c]1494304801[/c] And thus ended the book of Helaman, [c]1494504101[/c] according to the record of Helaman and his sons.</p>
