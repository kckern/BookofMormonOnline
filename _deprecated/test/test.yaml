                      text:
                        guid: 4becc782387f1
                        slug: gadianton/147
                        heading: 3 Nephi 4:1
                        content: <p>And it came to pass that in the latter end of the eighteenth year those armies of robbers had prepared for battle, [c]1502216501[/c] [c]1502204101[/c] [c]1502205401[/c] and began to come down and to sally forth from the hills, and out of the mountains, and the wilderness, and their strongholds, and their secret places, [c]1502204601[/c] and began to take possession of the lands, both which were in the land south and which were in the land north, [c]1502213101[/c] and began to take possession of all the lands which had been deserted by the Nephites, [c]1502216502[/c] and the cities which had been left [c]1502216504[/c] desolate. [c]1502216503[/c] [c]1502211101[/c] </p>
