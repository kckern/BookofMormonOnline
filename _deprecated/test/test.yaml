                            title: “Those robbers who had entered into a covenant”
                            text: See 3 Nephi 5.4. It is not clear, given the ethnic mixing of the past few decades, why some robbers would choose to continue to identify as Lamanites.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: Thanks to the exceptional leadership of {Lachoneus|lachoneus1} and {Gidgiddoni|gidgiddoni}, the whole civilization enjoys peace and order.
                      text:
                        guid: 4becc7823acdb
                        slug: gadianton/165
                        heading: 3 Nephi 6:4–6
                        content: <p>And they began again to prosper and [c]1508416501[/c] to wax great; [c]1508402701[/c] and the twenty and sixth and seventh years passed away, and there was great order in the land; and they had formed their laws according to equity and justice. [c]1508405401[/c] And now there was nothing in all the land to hinder the people from prospering continually, [c]1508518101[/c] [c]1508104801[/c] [c]1508404601[/c] [c]1508404101[/c] except they should fall into [c]1508516501[/c] transgression. [c]1508507201[/c] And now it was Gidgiddoni, and the judge, Lachoneus, and those who had been appointed leaders, [c]1508607201[/c] who had established this great peace in the land. [c]1508604601[/c] [c]1508604101[/c] </p>
                        duration: 29
                        quotes: []
                        people:
                          - slug: gidgiddoni
                            name: Gidgiddoni
                            title: Nephite commander, prophet
                          - slug: lachoneus1
                            name: Lachoneus1
                            title: Nephite chief judge
                        places: []
                        refs:
                          - verse_id: 36099
                            ref: 3ne 3:1
                            type: xref
                            significant: 0
                          - verse_id: 36116
                            ref: 3ne 3:18
                            type: xref
                            significant: 0
                        notes:
                          - id: '1508619301'
                            text: It is surprising that Nephi<sub >3</sub> is not mentioned here—his ministering was last reported at 3 Nephi 1.23—but his activities will be recounted at 3 Nephi 7.15–26.
                  - weight: 3
                    type: 'N'
                    narration:
                      description: '{Nephite|nephites} industry expands, and cities are built, rebuilt, and inter–city highways are built.'
                      text:
                        guid: 4becc7823aeee
                        slug: gadianton/166
                        heading: 3 Nephi 6:7–9
                        content: <p>And it came to pass that there were many cities built anew, and there were many old cities repaired. And there were many highways cast up, and many roads made, [c]1508813101[/c] which led from city to city, and from land to land, [c]1508813102[/c] and from place to place. [i]3373[/i] And thus passed away the twenty and eighth year, and the people had continual peace. [c]1508404801[/c] [c]1508311101[/c] [c]1508704601[/c] [c]1508704101[/c] </p>
                        duration: 20
                        quotes: []
                        people:
                          - slug: nephites
                            name: Nephites
                            title: Descendants of Nephi1 and his followers, later any person who accepts gospel
                        places: []
                        refs:
                          - verse_id: 36252
                            ref: 3ne 8:13
                            type: xref
                            significant: 0
                        notes:
                          - id: '1508819301'
                            text: These highways and roads are the constructions that will be “broken up” and “spoiled” at 3 Nephi 8.13. WB explains the term “highway” as “either because it is a great or public road, or because the earth was raised to form a dry path.”
              - title: Nephite Moral Decline
                slug: gadianton/nephite-moral-decline
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: The industry and prosperity leads some {Nephites|nephites} to become prideful, and true believers are persecuted.
                      text:
                        guid: 4becc7823b1be
                        slug: gadianton/167
                        heading: 3 Nephi 6:10–13
                        content: <p>But it came to pass in the twenty and ninth year there began to be some disputings among the people; and some were lifted up [c]1509016501[/c] unto pride and boastings [c]1509005401[/c] because of their exceedingly great riches, [i]3374[/i] [c]1509005402[/c] [c]1509201201[/c] [c]1509002701[/c] [c]1509112101[/c] yea, even unto great persecutions; [c]1509004101[/c] For there were many merchants in the land, [c]1509004801[/c] [c]1509113101[/c] and also many lawyers, and many officers. [c]1509104601[/c] [c]1509104101[/c] </p> <p>And the people began to be distinguished by ranks, [c]1509204101[/c] [c]1509105401[/c] [c]1509208201[/c] [c]1509212101[/c] according to their riches and their [c]1509216501[/c] chances for learning, [c]1509218101[/c] yea, some were ignorant because of their poverty, [c]1509018101[/c] [c]1509205401[/c] and others did receive great learning because of their riches. [c]1509011101[/c] [c]1509001101[/c]</p> <p>Some were lifted up in pride, [c]1509318101[/c] [c]1509312101[/c] and others were exceedingly humble; [c]1509304101[/c] some did return railing for railing, [c]1509304601[/c] while others would receive railing and persecution and all manner of afflictions, and would not turn and revile again, [c]1509312102[/c] but were humble and penitent before God. [c]1509311101[/c] [c]1509302701[/c] [c]1509201202[/c] </p>
                        duration: 51
