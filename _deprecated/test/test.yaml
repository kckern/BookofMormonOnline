                        notes:
                          - id: '1453919301'
                            text: These military losses were more serious than any in the Amalickiahite wars, and Moronihah will retake territories much more quickly than Captain Moroni, yet these events receive comparatively little attention from the narrator. Perhaps Mormon saw fewer moral lessons in the specific details, or he was simply less interested in Moronihah than in his father, Captain Moroni.
                          - id: '1453919302'
                            text: Following a similar strategy as in their last campaign, the Lamanites are much more successful this time as the Nephites lose their capital region and are forced to retreat north to Bountiful.
                  - weight: 3
                    type: 'N'
                    narration:
                      description: '{Moronihah|moronihah1} and the {Nephite|nephites} army are able to secure and defend the territory north of [Bountiful|land-bountiful], but the {Lamanites|lamanites} conquer everything in the south.'
                      text:
                        guid: 4becc782299b0
                        slug: gadianton/27
                        heading: Helaman 4:6–8
                        content: <p>And the Nephites and the armies of Moronihah were driven even [c]1454016501[/c] into the land of Bountiful; [c]1453911101[/c] [c]1454004101[/c] And there they did fortify against the Lamanites, [i]3309[/i] [c]1454113102[/c] [c]1454004601[/c] from the west sea, even unto the east; [c]1453704801[/c] [c]1454004801[/c] [c]1454113101[/c] it being a day’s journey for a [c]1454116501[/c] Nephite, [c]1454112101[/c] on the line which they had fortified and stationed their armies to defend their north country.</p> <p>And thus those dissenters of the Nephites, with the help of a numerous army of the Lamanites, had obtained all the possession of the Nephites which was in the land southward. [c]1454216501[/c] [c]1454204101[/c] [c]1454213101[/c] And all this was done in the fifty and eighth and ninth years of the reign of the judges. [c]1454013101[/c] </p>
                        chrono: roj|59
                        duration: 36
