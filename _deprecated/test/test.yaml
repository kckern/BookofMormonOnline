                        guid: 4becc7822eb5f
                        slug: gadianton/72
                        heading: Helaman 6:4–5
                        content: <p>And it came to pass that many of the Lamanites did come down into the land of Zarahemla, [c]1461604801[/c] [c]1461605301[/c] and did declare unto the people of the Nephites the manner of their conversion, and did exhort them to faith and repentance. [c]1461517101[/c] Yea, and many did preach with exceedingly great power and authority, [c]1461605302[/c] [c]1461704601[/c] [c]1461704101[/c] unto the bringing down many of them into the depths of humility, [c]1461607201[/c] to be the humble followers of God and [c]1461716501[/c] the Lamb. [c]1461605303[/c] [c]1461604601[/c] </p>
                        duration: 26
                        quotes: []
