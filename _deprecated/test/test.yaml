                            title: “More Especially Their Women and Their Children”
                            text: <p>Only as the people repented and turned back to the Lord did they have any peace.</p>
                          - id: '1480419301'
                            title: “Great evil”
                            text: Great disaster, see Mos 7.25n.
                          - id: '1480519201'
                            title: “And thus ended the eighty and first year of the reign of the judges”
                            text: This paragraph appears to be an editorial summary since the eighty-first year ends in both v. 32 and v. 35.
                          - id: '1480519301'
                            text: 'This paragraph appears to be an editorial summary since the eighty-first year ends in both Helaman 11:32 and Helaman 11:35; cf. Alma 50.35–40: Hel 4.10–17.'
                  - weight: 5
                    type: 'N'
                    narration:
                      description: The {Nephites|nephites}’ morals again decay, and they show no sign of repentance.
                      text:
                        guid: 4becc78231e99
                        slug: gadianton/95
                        heading: Helaman 11:36–38
                        content: <p>And in the eighty and second year they began again to forget the Lord their God. [c]1480204801[/c] And in the eighty and third year they began to wax strong in iniquity. [c]1480504601[/c] [c]1480504101[/c] And in the eighty and fourth year they did not mend their ways. [c]1480417101[/c] And it came to pass in the eighty and fifth year they did wax stronger and stronger in their pride, [c]1480318101[/c] and in their wickedness; [c]1479101201[/c] [c]1480613101[/c] and thus they were ripening again for destruction. [c]1480606401[/c] and thus ended the eighty and [c]1480816501[/c] fifth year. [c]1480704601[/c] [c]1480411101[/c] </p>
                        chrono: roj_plural|82-85
