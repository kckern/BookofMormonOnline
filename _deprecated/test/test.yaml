                  - weight: 3
                    type: 'N'
                    narration:
                      description: '{Nephite|nephites} militias are sent into the jungle several times and they successfully disperse the {Gadianton|gadianton-robbers} forces.'
                      text:
                        guid: 4becc78231a82
                        slug: gadianton/93
                        heading: Helaman 11:28–32
                        content: <p>And it came to pass that it was expedient that there should be a stop put to this work of destruction; therefore they sent an army of strong men into the wilderness and upon the mountains to search out this band of robbers, [c]1479611101[/c] [c]1479804601[/c] [c]1479806401[/c] [c]1479804101[/c] and to destroy them. But behold, it came to pass that in that same year they were driven back even into their own lands. And thus ended the eightieth year of the reign of the judges over the people of Nephi.</p> <p>And it came to pass in the commencement of the eighty and first year they did go forth again against this band of robbers, [c]1480004101[/c] and did destroy many; and they were also visited with much destruction. [c]1480016501[/c] And they were again obliged to return out of the wilderness and out of the mountains unto their own lands, because of the exceeding greatness of the numbers of those robbers who infested the mountains and the wilderness. [c]1480004601[/c] And it came to pass that thus ended this year.</p>
