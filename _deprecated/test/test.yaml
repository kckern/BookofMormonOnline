                  - weight: 4
                    type: 'N'
                    narration:
                      description: '{Gidgiddoni|gidgiddoni} plans an ambush, and the next day, {Zemnarihah|zemnarihah} is met in the front and rear by {Nephite|nephites} troops.'
                      text:
                        guid: 4becc78239d76
                        slug: gadianton/157
                        heading: 3 Nephi 4:24–26
                        content: <p>And now, Gidgiddoni being aware of their design, [c]1504502701[/c] and knowing of their weakness because of the want of food, and the great slaughter which had been made among them, therefore he did send out his armies in the night–time, [c]1504504601[/c] and did cut off the way of their retreat, [i]3366[/i] [c]1504504101[/c] and did place his armies in the way of their retreat. [c]1504516501[/c]</p> <p>And this did they do in the night–time, and got on their march beyond the robbers, [c]1504504801[/c] [c]1504616501[/c] so that on the morrow, when the robbers began their march, they were met by the armies of the Nephites both in their front and in their rear. And the robbers who were on the south were also cut off in their places of retreat. And all these things were done by command of Gidgiddoni. [c]1504111101[/c] </p>
