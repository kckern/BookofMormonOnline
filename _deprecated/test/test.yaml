                            title: “and they did use every means in their power to destroy them off”
                            text: Possibly <em>from off</em>
                          - id: '1463319301'
                            text: As an organization bound together by covenants of loyalty and mutual assistance, the Gadianton robbers can be viewed as a clandestine, negative counterpart to the church of God (note that the robbers swear their oaths “by their everlasting Maker” at Helaman 1.11).
                  - weight: 5
                    type: 'N'
                    narration:
                      description: The {Gadianton|gadianton} robbers are meticulously organized with secret signs, pacts, and the like, to keep their underground enterprise alive.
                      text:
                        guid: 4becc7822fe53
                        slug: gadianton/81
                        heading: Helaman 6:22–24
                        content: <p>And it came to pass that they did have their signs, yea, their secret signs, and their secret words; [c]1463404101[/c] [c]1463312101[/c] and this that they might distinguish a brother who had entered into the covenant, that whatsoever wickedness his brother should do he should not be injured by his brother, [c]1463313102[/c] nor by those who did belong to his band, who had taken this covenant. [c]1463416501[/c] And thus they might murder, and plunder, and steal, and commit whoredoms and all manner of wickedness, [c]1463518101[/c] [c]1463404601[/c] contrary to the laws of their country and also the laws of their God. [c]1463404801[/c] [c]1463411101[/c] </p> <p>And whosoever of those who belonged to their band should reveal unto the world of their wickedness and their abominations, should be tried, not according to the laws of their country, but according to the laws of their wickedness, which had been given by Gadianton and Kishkumen. [c]1463611101[/c] [c]1463206401[/c] [c]1463612101[/c] </p>
