                            title: “Sanctification”
                            text: Or becoming holy, was a theologically significant term in early 19th-c. America; this is its only appearance in the BoM. In Christian theology it was often paired with “justification,” which is absent from the BoM. Preachers in the 18th–19th c. often spoke of sanctifying one’s heart, though the expression is not biblical.
