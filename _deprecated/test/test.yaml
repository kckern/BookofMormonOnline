                    narration:
                      description: The church sees significant growth and progress, with tens of thousands baptized, and an unprecedented outpouring of blessings.
                      text:
                        guid: 4becc782286b6
                        slug: gadianton/18
                        heading: Helaman 3:24–26
                        content: <p>And it came to pass that in this same year there was exceedingly great prosperity in the church, [c]1452101201[/c] [c]1452006401[/c] [c]1452109101[/c] insomuch that there were thousands who did join themselves unto the church and were baptized unto repentance. [c]1452017102[/c] [c]1452111101[/c] And so great was the prosperity of the church, [c]1452105301[/c] [c]1452104101[/c] [c]1452104601[/c] and so many the blessings which were poured out upon the people, that even the high priests and the teachers were themselves astonished beyond measure. [c]1452118101[/c] [c]1452212101[/c] And it came to pass that the work of the Lord did prosper [c]1452316501[/c] unto the baptizing and uniting to the church of God, [i]3307[/i] [c]1451911101[/c] [c]1452204101[/c] many souls, yea, even tens of thousands. [c]1452004801[/c] [c]1451405301[/c] </p>
                        duration: 35
                        quotes: []
                        people:
                          - slug: saints-of-the-church
                            name: Saints of the Church
                            title: Devout Followers of Christ
                        places: []
                        refs: []
                        notes:
                          - id: '1452119301'
                            text: This era of righteousness and prosperity was short-lived, to be replaced a decade later by wickedness and warfare; see Helaman 4.11–13.
                  - weight: 5
                    type: 'N'
                    narration:
                      description: The {Lord|god}’s mercy is bountifully poured out upon the {Nephites|nephites}, because the gates of heaven are open to all.
                      text:
                        guid: 4becc782288a9
                        slug: gadianton/19
                        heading: Helaman 3:27–30
                        content: <p>Thus we may see that the Lord is merciful unto all who will, [c]1452406401[/c] in the sincerity of their hearts, [c]1452404601[/c] call upon his holy name. [c]1452404801[/c] [c]1452405301[/c] Yea, thus we see that the gate of heaven is open unto all, [c]1452518101[/c] [c]1452404101[/c] [c]1452512101[/c] even to those who will believe on the name of Jesus Christ, [c]1452618101[/c] [a]108[/a] [c]1452507201[/c] [c]1452504601[/c] [c]1452504101[/c] who is the Son of God. Yea, we see that whosoever will [c]1452616502[/c] may lay hold [c]1452605303[/c] upon the word of God, [c]1452601201[/c] [c]1452604101[/c] which is quick and powerful, [c]1452605302[/c] which shall divide asunder all the cunning and the snares and the wiles of the devil, [c]1452604601[/c] and lead the man of Christ in a strait and narrow course across that everlasting gulf of misery which is prepared to engulf the wicked— [c]1452616501[/c] [c]1452707201[/c] [c]1452608201[/c] [c]1452612101[/c] </p> <p>And land their souls, yea, their immortal souls, at the right hand of God in the kingdom of heaven, [c]1452716501[/c] to sit down with Abraham, and Isaac, and with Jacob, [c]1452701201[/c] [c]1452713101[/c] and with all our holy fathers, to go no more out. [c]1452718101[/c] [c]1452605301[/c] </p>
