                      text:
                        guid: 4becc7822b57e
                        slug: gadianton/45
                        heading: Helaman 5:13
                        content: <p>And it came to pass that these were the words which Helaman taught to his sons; [c]1457204801[/c] [c]1457217102[/c] [c]1457217104[/c] [c]1457217103[/c] [c]1457304601[/c] yea, he did teach them many things which are not written, and also many things which are written. </p>
