                      text:
                        guid: 4becc78228437
                        slug: gadianton/17
                        heading: Helaman 3:22–23
                        content: <p>And it came to pass that the wars and contentions began to cease, in a small degree, among the people of the Nephites, in the latter end of the forty and eighth year of the reign of the judges over the people of Nephi.</p> <p>And it came to pass in the forty and ninth year of the reign of the judges, there was continual peace established in the land, [c]1451916501[/c] [c]1451904601[/c] all save it were the secret combinations which Gadianton the robber had established [c]1452016501[/c] in the more settled parts of the land, [c]1461301101[/c] [c]1445001201[/c] [c]1451904101[/c] [c]1452013101[/c] which at that time were not known unto those who were at the head of government; [c]1452018101[/c] [c]1452016502[/c] therefore they were not destroyed out of the land.</p>
