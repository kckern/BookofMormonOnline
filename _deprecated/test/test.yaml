                  - weight: 10
                    type: 'N'
                    narration:
                      description: One guard named {Aminadab|aminadab}, an ex–Nephite, sees {Nephi|nephi2} and {Lehi|lehi4}’s faces through the mists of darkness; they are looking upward, speaking to someone.
                      text:
                        guid: 4becc7822d01a
                        slug: gadianton/58
                        heading: Helaman 5:35–36, 39
                        content: <p>Now there was one among them who was a Nephite by birth, [c]1459504101[/c] who had once belonged to the church of God but had dissented from them. [c]1459511101[/c] And it came to pass that he turned him about, and behold, he saw through the cloud of darkness the faces of Nephi and Lehi; [c]1459518101[/c] [c]1459616502[/c] [i]1760[/i] and behold, they did shine exceedingly, [c]1459617101[/c] [c]1459904101[/c] even as the faces of angels. [i]3316[/i] [c]1459605301[/c] [c]1459604601[/c] [c]1459604101[/c] And he beheld that they did lift [c]1459616501[/c] their eyes to heaven; [c]1459612101[/c] and they were in the attitude as if talking or lifting their voices to some being whom they beheld. [i]1761[/i]</p> <hr /> <p>Now the man’s name was Aminadab… [c]1459504601[/c] [c]1459607201[/c] [c]1459913101[/c] [c]1459501201[/c] </p>
