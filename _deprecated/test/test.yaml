                      description: The {Lord|god}’s mercy is bountifully poured out upon the {Nephites|nephites}, because the gates of heaven are open to all.
                      text:
                        guid: 4becc782288a9
                        slug: gadianton/19
                        heading: Helaman 3:27–30
                        content: <p>Thus we may see that the Lord is merciful unto all who will, [c]1452406401[/c] in the sincerity of their hearts, [c]1452404601[/c] call upon his holy name. [c]1452404801[/c] [c]1452405301[/c] Yea, thus we see that the gate of heaven is open unto all, [c]1452518101[/c] [c]1452404101[/c] [c]1452512101[/c] even to those who will believe on the name of Jesus Christ, [c]1452618101[/c] [a]108[/a] [c]1452507201[/c] [c]1452504601[/c] [c]1452504101[/c] who is the Son of God. Yea, we see that whosoever will [c]1452616502[/c] may lay hold [c]1452605303[/c] upon the word of God, [c]1452601201[/c] [c]1452604101[/c] which is quick and powerful, [c]1452605302[/c] which shall divide asunder all the cunning and the snares and the wiles of the devil, [c]1452604601[/c] and lead the man of Christ in a strait and narrow course across that everlasting gulf of misery which is prepared to engulf the wicked— [c]1452616501[/c] [c]1452707201[/c] [c]1452608201[/c] [c]1452612101[/c] </p> <p>And land their souls, yea, their immortal souls, at the right hand of God in the kingdom of heaven, [c]1452716501[/c] to sit down with Abraham, and Isaac, and with Jacob, [c]1452701201[/c] [c]1452713101[/c] and with all our holy fathers, to go no more out. [c]1452718101[/c] [c]1452605301[/c] </p>
