                    type: 'N'
                    narration:
                      description: A large number of disaffected {Nephites|nephites} leave the [land of Zarahemla|land-of-zarahemla] and travel northward to an area filled with large bodies of water;  some land had been rendered useless by its prior inhabitants.
                      text:
                        guid: 4becc78227564
                        slug: gadianton/10
                        heading: Helaman 3:3–5
                        content: <p>And it came to pass in the forty and sixth, [c]1450016501[/c] [c]1450113101[/c] yea, there was much contention and many dissensions; [c]1449818101[/c] [c]1450016502[/c] [c]1449913101[/c] [c]1449806401[/c] [c]1450004601[/c] in the which there were an exceedingly great many who departed out of the land of Zarahemla, [c]1450017102[/c] [i]3304[/i] [c]1450213103[/c] [c]1450004101[/c] and went forth unto the land northward to inherit the land. [c]1450016503[/c] [v]55[/v] [c]1449801101[/c] [c]1450104601[/c] [c]1450104101[/c]</p> <p>And they did travel to an exceedingly great distance, [c]1450013101[/c] [c]1450112101[/c] insomuch that they came to large bodies of water and many rivers. [c]1450004801[/c] [c]1450013103[/c] Yea, and even they did spread forth into all parts of the land, [c]1450213101[/c] into whatever parts it had not been rendered [c]1450216503[/c] desolate [c]1450216502[/c] [c]1450216501[/c] and without timber, [c]1450204101[/c] [c]1450213102[/c] [c]1450204601[/c] because of the many inhabitants who had before inherited the land. [c]1450011101[/c] [c]1450013102[/c] </p>
