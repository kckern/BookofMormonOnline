                            type: xref
                            significant: 0
                        notes:
                          - id: '1503419301'
                            text: The conflict with the robbers has become a war of extermination, with no prisoners taken, but see 3 Nephi 4:27 below and6.3.
                          - id: '1503519301'
                            title: “Who had stood and fought with boldness”
                            text: The narrator grants Giddianhi a modicum of respect.
              - title: Zemnarihah and the Gadianton Demise
                slug: gadianton/zemnarihah-and-the-gadianton-demise
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: A few years pass, and the {Gadianton robbers|gadianton-robbers} appoint a new leader, {Zemnarihah|zemnarihah}, who leads his people to the {Nephites|nephites}, surrounds their city, and plans to cut them off from all outside resources.
                      text:
                        guid: 4becc7823971e
                        slug: gadianton/154
                        heading: 3 Nephi 4:15–17
                        content: <p>And it came to pass that the armies of the Nephites did return again to their place of security. And it came to pass that this nineteenth year did pass away, and the robbers did not come again to battle; neither did they come [c]1503616501[/c] again in the twentieth year.</p> <p>And in the twenty and first year they did not come up to battle, but they came up on all sides to lay siege round about the people of Nephi; [c]1503604801[/c] [c]1503616502[/c] [c]1503713101[/c] [c]1503604601[/c] [c]1503604101[/c] [c]1503602701[/c] for they did suppose that if they should cut off the people of Nephi from their lands, and should hem them in on every side, and if they should cut them off from all their outward privileges, that they could cause them to yield themselves [c]1503716502[/c] up according to their wishes. [c]1503716501[/c] [c]1503511101[/c] Now they had appointed unto themselves another leader, whose name was Zemnarihah; therefore it was Zemnarihah that did cause that this siege should take place.</p>
                        duration: 47
                        quotes: []
                        people:
                          - slug: gadianton-robbers
                            name: Gadianton Robbers
                            title: Secret society
                          - slug: nephites
                            name: Nephites
                            title: Descendants of Nephi1 and his followers, later any person who accepts gospel
                          - slug: zemnarihah
                            name: Zemnarihah
                            title: Captain of Gadianton robbers
                        places: []
                        refs:
                          - verse_id: 36121
                            ref: 3ne 3:23
                            type: xref
                            significant: 0
                        notes:
                          - id: '1503619201'
                            title: “neither did they come again in the twentieth year”
                            text: +19 years; see v. 5 above
                          - id: '1503619301'
                            text: In a change of tactics, the robbers now conduct siege warfare against the Nephite <i>place of security</i>.
                          - id: '1503619302'
                            title: “Outward privileges”
                            text: The ability to travel freely outside their fortifications.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: The plan backfires, because the {Nephites|nephites} have large amounts of food and resources stocked up, whereas the {Gadianton robbers|gadianton-robbers} did not have any resources available to them outside the city limits.
                      text:
                        guid: 4becc78239928
                        slug: gadianton/155
                        heading: 3 Nephi 4:18–20
                        content: <p>But behold, this was an advantage [c]1503916501[/c] to the Nephites; for it was impossible for the robbers to lay siege sufficiently long to have any effect upon the Nephites, [c]1503904101[/c] [c]1503912101[/c] because of their much provision which they had laid up in store, [c]1503904601[/c] And because of the scantiness of provisions among the robbers—for behold, they had nothing save it were meat for their subsistence, [c]1503804801[/c] [c]1503916502[/c] which meat they did obtain in the wilderness; [c]1503811101[/c] And it came to pass that the wild game became scarce in the wilderness—insomuch that the robbers were about to perish with hunger. [c]1503718101[/c] </p>
