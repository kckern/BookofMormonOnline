              - title: Rejection and Unbelief
                slug: gadianton/rejection-and-unbelief
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: Time passes, and the majority of the {Nephites|nephites} continue to live in sin.
                      text:
                        guid: 4becc78233978
                        slug: gadianton/107
                        heading: Helaman 16:10–12
                        content: <p>And thus ended also the eighty and seventh year of the reign of the judges, the more part of the people remaining in their pride and wickedness, [c]1493104601[/c] [c]1493104101[/c] [c]1493011101[/c] and the lesser part walking more circumspectly before God. [c]1493116501[/c] [c]1493105301[/c] And these [c]1493216501[/c] were the conditions also, in the eighty and eighth year of the reign of the judges. And there was but little alteration in the affairs of the people, save it were the people began to be more hardened in iniquity, [c]1493204601[/c] [c]1493204101[/c] and do more and more of that which was contrary to the commandments of God, [c]1493104801[/c] in the eighty and ninth year of the reign of the judges.</p>
