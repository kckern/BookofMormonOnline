              - title: Nephite Expansion and Industry
                slug: gadianton/nephite-expansion-and-industry
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: The {Gadianton|gadianton-robbers} conflict being over, the {Nephites|nephites} decentralize out of [Zarahemla|zarahemla], and repopulate the land.
                      text:
                        guid: 4becc7823aab8
                        slug: gadianton/164
                        heading: 3 Nephi 6:1–3
                        content: <p>And now it came to pass that the people of the Nephites did all return to their own lands in the twenty and sixth year, [c]1508104101[/c] every man, with his family, his flocks and his herds, his horses [v]136[/v] and his cattle, and all things whatsoever did belong unto them. [i]3372[/i] [c]1508104601[/c] </p> <p>And it came to pass that they had not eaten up all their provisions; therefore they did take with them all that they had not devoured, of all their grain of every kind, and their gold, and their silver, and all their precious things, and they did return to their own lands and their possessions, both on the north and on the south, both on the land northward and on the land southward. [c]1508111101[/c] </p> <p>And they granted unto those robbers who had entered into a covenant to keep the peace of the [c]1508316501[/c] land, [c]1508105401[/c] who were desirous to remain Lamanites, [c]1508304601[/c] [c]1508304101[/c] lands, according to their numbers, that they might have, with their labors, wherewith to subsist upon; [c]1508117102[/c] and thus they did establish peace in all the land.</p>
                        duration: 54
                        quotes: []
