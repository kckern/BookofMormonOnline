                            title: “Into the land of Zarahemla, among the Lamanites”
                            text: The old Nephite capital of Zarahemla had been captured four years earlier (Helaman 4.4–8) and was still in the hands of the Lamanites.
              - title: Nephi and Lehi in Prison
                slug: gadianton/nephi-and-lehi-in-prison
