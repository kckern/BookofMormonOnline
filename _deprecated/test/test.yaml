                      text:
                        guid: 4becc7822700e
                        slug: gadianton/8
                        heading: Helaman 2:12–14
                        content: <p>And more of this Gadianton shall be spoken hereafter. [c]1449507202[/c] [c]1449506401[/c] And thus ended the forty and second year of the reign of the judges over the people of Nephi. [c]1449504601[/c] And behold, in the end of this book ye shall see that this Gadianton did prove the overthrow, [c]1449504101[/c] [c]1449707202[/c] [c]1449613101[/c] yea, [c]1449604101[/c] almost the entire destruction of the people of Nephi. [c]1449618101[/c] [c]1449605301[/c] [c]1449707201[/c] [c]1449612101[/c] Behold I do not mean the end of the book of Helaman, [c]1449507201[/c] [c]1449604601[/c] but I mean the end of the book of Nephi, from which I have taken all the account which I have written. [c]1449511101[/c] </p>
