                            significant: -1
                        notes:
                          - id: '1463719301'
                            text: Mormon, noting the similarities between Jaredite secret combinations and the Gadianton robbers, is eager to absolve Helaman from any suspicion that he might have disclosed specifics from records in his safekeeping; cf. Alma 63.12. Rather, the similarities are attributed to the influence of Satan in creating such organizations; indeed, at Helaman 8.28, Satan is identified as a cofounder of the Gadianton robbers.
                          - id: '1463719302'
                            text: See Alma 37.27–32.
              - title: Nephite Moral Decay
                slug: gadianton/nephite-moral-decay
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: The ideas behind the {Gadianton secret society|gadianton-robbers} were not obtained from any existing available record, but were revealed by the {devil|satan}.
                      text:
                        guid: 4becc78230338
                        slug: gadianton/83
                        heading: Helaman 6:26–27
                        content: <p>Now behold, those secret oaths and covenants did not come forth unto Gadianton from the records which were delivered unto Helaman; [c]1463808201[/c] but behold, they were put into the heart of Gadianton by that same being who did entice our first parents to partake of the forbidden fruit—Yea, [c]1463813101[/c] that same being who did plot with Cain, [c]1463704801[/c] [c]1463704601[/c] [c]1463905301[/c] that if he would murder his brother Abel it should not be known unto the world. [c]1463918101[/c] [c]1463912101[/c] And he did plot with Cain and his followers from that time forth. [c]1463711101[/c] [c]1463704101[/c] </p>
                        duration: 29
