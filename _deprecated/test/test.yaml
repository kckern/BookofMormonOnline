                  - weight: 3
                    type: 'N'
                    narration:
                      description: '{Nephi|nephi2} and {Lehi|lehi4} are inspired and fueled by the words of their late father {Helaman|helaman3}, who taught that true happiness and prosperity comes from following and believing {Jesus|jesus-christ}.'
                      text:
                        guid: 4becc7822ad47
                        slug: gadianton/36
                        heading: Helaman 5:5–12
                        content: '<p>For they remembered the words which their father Helaman spake unto them. [i]1751[/i] [c]1456505301[/c] [c]1456509101[/c] [c]1456406401[/c] [c]1456504601[/c] [c]1456504101[/c] And these are the words which he spake: [quote]4becc7822adf7[/quote]</p>'
                        duration: 7
                        quotes:
                          - parent: 4becc7822adf7
                            parentSlug: gadianton/36
                            slug: gadianton/37
                            heading: Remember the commandments
                            content: <p>Behold, my sons, I desire that ye should remember to keep the commandments of God; [c]1456617101[/c] and I would that ye should declare unto the people these words.</p>
                            duration: 9
                          - parent: 4becc7822adf7
                            parentSlug: gadianton/36
                            slug: gadianton/38
                            heading: Nephi and Lehi’s namesake
                            content: <p>Behold, I have given unto you the names of our first parents who came out of the land of Jerusalem; [c]1456618101[/c] [c]1456604101[/c] [c]1456613101[/c] and this I have done that when you remember your names ye may remember them; [c]1456605301[/c] [c]1456508201[/c] [c]1456604601[/c] [c]1456613102[/c] [c]1456612101[/c] [c]1456501201[/c] [c]1456609101[/c] and when ye remember them ye may remember their works; [c]1456608201[/c] and when ye remember their works ye may know how that it is said, and also written, that they were good. [c]1456616503[/c] [c]1456616502[/c]</p>
                            duration: 23
                          - parent: 4becc7822adf7
                            parentSlug: gadianton/36
                            slug: gadianton/39
                            heading: Maintaining heritage
                            content: <p>Therefore, my sons, I would that ye should do that which is good, [c]1456704601[/c] [c]1456704101[/c] that it may be said of you, and also written, even as it has been said and written of them. [c]1456504801[/c] [c]1456517102[/c] [c]1456617101[/c] [c]1456616501[/c] [c]1456707201[/c] </p>
                            duration: 10
                          - parent: 4becc7822adf7
                            parentSlug: gadianton/36
                            slug: gadianton/40
                            heading: Treasure in heaven
                            content: <p>And now my sons, behold I have somewhat more to desire of you, [c]1456816501[/c] which desire is, that ye may not do these things that ye may boast, but that ye may do these things to lay up for yourselves a treasure in heaven, [c]1456805301[/c] [c]1456804601[/c] [c]1456812101[/c] [c]1456804101[/c] yea, which is eternal, and which fadeth not away; yea, that ye may have that precious gift of eternal life, [c]1456805302[/c] [c]1456807201[/c] which we have reason to suppose hath been given to our fathers. [c]1456816502[/c]</p>
                            duration: 26
                          - parent: 4becc7822adf7
                            parentSlug: gadianton/36
                            slug: gadianton/41
                            heading: The blood of Jesus
                            content: <p>O remember, [c]1456901202[/c] remember, [c]1456904601[/c] [c]1456907202[/c] my sons, the words which king Benjamin spake unto his people; [c]1456518101[/c] yea, remember that there is no other way nor means whereby [c]1456916501[/c] man can be saved, [c]1456912101[/c] [c]1456905301[/c] [c]1456901201[/c] only through the atoning blood of Jesus Christ, [c]1456804801[/c] [c]1456917101[/c] [c]1456907201[/c] who shall come, yea, remember that he cometh to redeem the world. [c]1456911101[/c] </p>
                            duration: 21
                          - parent: 4becc7822adf7
                            parentSlug: gadianton/36
                            slug: gadianton/42
                            heading: Redemption from sin
                            content: <p>And remember also the words which Amulek spake unto Zeezrom, in the city of Ammonihah; for he said unto him that the Lord surely should come to redeem his people, [a]42[/a] [c]1457004601[/c] but that he should not come to redeem them in their sins, [c]1457018101[/c] [c]1457003101[/c] but to redeem them from their sins. [c]1456918101[/c] [c]1457008201[/c] [c]1456901101[/c] [c]1457005301[/c]</p>
                            duration: 17
                          - parent: 4becc7822adf7
                            parentSlug: gadianton/36
                            slug: gadianton/43
                            heading: Power from the Father
                            content: <p>And he hath power given unto him from the Father [c]1457105301[/c] to redeem them from their sins because of repentance; [c]1457104601[/c] therefore he hath sent his angels to declare the tidings of the conditions of repentance, [c]1457105302[/c] [c]1457107201[/c] which bringeth unto the power of the Redeemer, [c]1457104101[/c] unto the salvation of their souls. [c]1457116501[/c] [c]1457105303[/c]</p>
                            duration: 18
                          - parent: 4becc7822adf7
                            parentSlug: gadianton/36
                            slug: gadianton/44
                            heading: The rock of our Redeemer
                            content: <p>And now, my sons, remember, [c]1456906401[/c] remember that it is upon the rock of our Redeemer, [a]60[/a] [c]1457205301[/c] [c]1457204601[/c] who is Christ, [c]1457209101[/c] the Son of God, that ye must build your foundation; [c]1457218101[/c] [c]1457004801[/c] [c]1457217102[/c] [c]1457217104[/c] [c]1456917101[/c] [a]15[/a] [c]1457207201[/c] [c]1457208201[/c] [c]1457201201[/c] [c]1457204101[/c] [c]1457212101[/c] that when the devil shall send forth his mighty winds, yea, his shafts in the whirlwind, yea, when all his hail and his mighty storm shall beat upon you, [c]1457201202[/c] it shall have no power over you [c]1457216501[/c] to drag you down to the gulf of misery and endless wo, because of the rock upon which ye are built, which is a sure foundation, [a]110[/a] a foundation whereon if men build they cannot fall. [c]1457211101[/c] </p>
                            duration: 38
