                      text:
                        guid: 4becc7822cc31
                        slug: gadianton/56
                        heading: Helaman 5:32
                        content: <p>And behold the voice came again, saying:</p> <blockquote> <p>“Repent ye, repent ye, <br />_for the kingdom of heaven is at hand; [c]1458917102[/c] [c]1458009101[/c] <br />_and seek no more to destroy my servants.”</p></blockquote> <p>And it came to pass that the earth shook again, and the walls trembled.</p>
