                          - verse_id: 1455
                            ref: gen 48:3
                            type: xref
                            significant: 0
                          - verse_id: 31976
                            ref: 2ne 9:46
                            type: xref
                            significant: 0
                        notes:
                          - id: '1505219301'
                            text: <i>“Break forth…in singing”</i> occurs five times in Isaiah’s prophecies (three of which are quoted in the BoM); this is the only place where the phrase describes actual singing.
                          - id: '1505305402'
                            title: “Hosanna”
                            text: This is both a statement of praise and a supplication. It means “Save us now; save, we pray!”
                          - id: '1505319201'
                            title: “Yea, they did cry, “Hosanna”
                            text: Hebrew “Help!” or “Save us!”; this appeal for deliverance eventually became an expression of praise.
                          - id: '1505319301'
                            text: Similar praise will be heard at 3 Nephi 11.17, after Jesus’s arrival among the Nephites, but the context here suggests a closer connection to Gen 14.20, celebrating Abraham’s military victory.
                          - id: '1505419301'
                            text: The image of hearts so full to overflowing that fluid escapes through the eyes is striking; see Alma 26.11for a similar idea.
                          - id: '1505419302'
                            title: “Everlasting destruction”
                            text: Referring both to irreversible annihilation as a people and to eternal damnation as individuals.
                  - weight: 8
                    type: 'N'
                    narration:
                      description: The {Nephites|nephites} all believe in the prophesies, have faith in {Christ|jesus-christ}, repent, and live righteously.
                      text:
                        guid: 4becc7823a5c8
                        slug: gadianton/161
                        heading: 3 Nephi 5:1–3
                        content: <p>And now behold, there was not a living soul among all the people of the Nephites who did doubt [c]1505501201[/c] in the least the words of all the holy prophets [c]1505516502[/c] [c]1505516501[/c] who had spoken; [c]1505518101[/c] [c]1505517102[/c] [c]1505704601[/c] [c]1505704101[/c] [c]1505501202[/c] [c]1505512101[/c] [c]1505502701[/c] for they knew that it must needs be that they must be fulfilled.</p> <p>And they knew that it must be expedient that Christ had come, [c]1505504801[/c] [c]1505604601[/c] because of the many signs which had been given, according to the words of the prophets; and because of the things which had come to pass already they knew [c]1505616501[/c] that it must needs be that all things should come to pass according to that which had been spoken. [c]1505505401[/c] Therefore they did forsake all their sins, and their abominations, [c]1505705401[/c] [c]1505504101[/c] and their whoredoms, [c]1505705402[/c] and did serve God with all diligence day and night. [c]1505707201[/c] [c]1505511101[/c] [c]1505504601[/c] </p>
                        duration: 40
                        quotes: []
                        people:
                          - slug: jesus-christ
                            name: Jesus Christ
                            title: Holy One of Israel
                          - slug: nephites
                            name: Nephites
                            title: Descendants of Nephi1 and his followers, later any person who accepts gospel
                        places: []
                        refs: []
                        notes:
                          - id: '1505519301'
                            text: This is a very strong claim about the depth and universality of belief among the surviving Nephites. Physical deliverance has led to yet another reevaluation of the significance of signs, along with prophecies concerning destruction and salvation; cf. 3 Nephi 2.1–3.
                          - id: '1505719301'
                            title: “Serve God with all diligence”
                            text: At Mos 7.33 divine deliverance was promised as a reward for such service, but here the order is reversed; service to God is offered as a grateful response to deliverance.
                  - weight: 9
                    type: 'N'
                    narration:
                      description: The {Nephites|nephites} preach the gospel to their {Gadianton|gadianton-robbers} prisoners; those who believe and repent are set free.
                      text:
                        guid: 4becc7823a7db
                        slug: gadianton/162
                        heading: 3 Nephi 5:4–6
                        content: <p>And now it came to pass that when they had taken all the robbers prisoners, [i]3370[/i] insomuch that none did escape who were not slain, they did cast their prisoners into prison, and did cause the word of God to be preached unto them; [c]1505804101[/c] [c]1505804601[/c] [c]1505805401[/c] and as many as would repent of their sins and [c]1505716501[/c] enter into a covenant that they would murder no more were set at liberty. [c]1505904101[/c] [c]1505812101[/c] </p> <p>But as many as there were who did not enter into a covenant, and who did still continue to have those secret murders in their hearts, [c]1505916501[/c] yea, as many as were found breathing out threatenings against their brethren were condemned and punished according to the law. [c]1505818101[/c] [c]1505904601[/c] [c]1505501101[/c] And thus they did put an end to all those wicked, and secret, and abominable combinations, [c]1505804801[/c] [c]1506004601[/c] [c]1505508201[/c] [c]1506004101[/c] [c]1505802701[/c] in the which there was so much wickedness, and so many murders committed. [c]1505811101[/c] </p>
                        duration: 45
                        quotes: []
                        people:
