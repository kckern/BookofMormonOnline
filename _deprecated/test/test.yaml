                      description: The northern {Nephites|nephites} establish a timber import industry, and are able to develop many cities.
                      text:
                        guid: 4becc78227d5a
                        slug: gadianton/14
                        heading: Helaman 3:10–12
                        content: <p>And it came to pass as timber was exceedingly scarce in the land northward, [c]1450713101[/c] they did send forth much by the way of shipping. [c]1450704601[/c] [c]1450704101[/c] And thus they did enable the people in the land northward that they [c]1450816501[/c] might build many cities, [c]1450718101[/c] [c]1450511101[/c] both of wood and of cement. [v]56[/v] [c]1450807201[/c] And it came to pass that there were many of the people of Ammon, [c]1450907201[/c] [c]1450904101[/c] who were Lamanites by birth, [c]1450904601[/c] [c]1450913101[/c] did also go forth into this [c]1450916501[/c] land.</p>
