                        slug: gadianton/171
                        heading: 3 Nephi 6:20–21
                        content: <p>And there began to be men inspired from heaven and sent forth, [c]1510004601[/c] standing among the people in all the land, preaching and testifying boldly [c]1510005401[/c] of the sins and iniquities of the people, [i]3375[/i] [c]1510002701[/c] and testifying unto them concerning the redemption which the Lord would make for his people, [c]1510013101[/c] or in other words, the resurrection of Christ; and they did testify boldly of his death and sufferings. [c]1509911101[/c] [c]1510005402[/c] [c]1510004101[/c]</p> <p>Now there were many of the people who were exceedingly angry because of those who testified of these things; [c]1509704801[/c] and those who were angry were chiefly the chief judges, [c]1510102701[/c] and they who had been high priests and lawyers; [c]1510104601[/c] [c]1510104101[/c] yea, all those who were lawyers were angry with those who testified of these things. </p>
                        duration: 40
                        quotes: []
                        people: []
                        places: []
                        refs: []
                        notes:
                          - id: '1510019301'
                            text: The <i>men inspired from heaven</i>, identified as prophets in 3 Nephi 6:25, appear to come from outside established church hierarchy, particularly since they are opposed by high priests (3 Nephi 6:21, 27).
                  - weight: 3
                    type: 'N'
                    narration:
                      description: Many of the preachers are apprehended and illegally executed without due process or authoritative approval.
                      text:
                        guid: 4becc7823bd19
                        slug: gadianton/172
                        heading: 3 Nephi 6:22–23
                        content: <p>Now there was no lawyer nor judge nor high priest that could have power to condemn any one to death save their condemnation was signed by the governor of the land.</p> <p>Now there were many of those who testified of the things pertaining to Christ [c]1510316501[/c] who testified boldly, [c]1510018101[/c] who were taken and put to death secretly by the judges, [c]1510202701[/c] [c]1510312101[/c] [c]1510204601[/c] [c]1510204101[/c] that the knowledge of their death came not unto the governor of the land until after their death. [c]1510205401[/c] </p>
                        duration: 15
                        quotes: []
                        people:
                          - slug: jesus-christ
                            name: Jesus Christ
                            title: Holy One of Israel
                        places: []
                        refs:
                          - verse_id: 35732
                            ref: hel 6:17
                            type: xref
                            significant: 0
                          - verse_id: 36227
                            ref: 3ne 7:14
                            type: xref
                            significant: 0
                          - verse_id: 36273
                            ref: 3ne 9:9
                            type: xref
                            significant: 0
                        notes:
                          - id: '1510219301'
                            text: These illegal executions seem similar to the secret murders contemplated at 3 Nephi 5.5; in other words, the Nephite elite have become equivalent to the robbers; cf. Hel 6.29–30.
                  - weight: 4
                    type: 'N'
                    narration:
                      description: The judges who ordered the executions are summoned by the governor.
                      text:
                        guid: 4becc7823bf2e
                        slug: gadianton/173
                        heading: 3 Nephi 6:24–25
                        content: <p>Now behold, this was contrary to the laws of the land, that any man should be put to death except they had power from the governor of the land—therefore a complaint came [c]1510516501[/c] up unto the land of Zarahemla, [c]1510111101[/c] [c]1510404101[/c] [c]1510402701[/c] to the governor of the land, against these judges who had condemned the prophets of the Lord [c]1510516502[/c] unto death, [c]1510511101[/c] not according to the law. [c]1510104801[/c] [c]1510404601[/c] </p>
                        duration: 19
                        quotes: []
                        people: []
                        places: []
                        refs:
                          - verse_id: 36227
                            ref: 3ne 7:14
                            type: xref
                            significant: -1
                        notes:
                          - id: '1510519301'
                            text: Zarahemla has been reestablished as the Nephite capital; see Hel 5.16n.
                  - weight: 5
                    type: 'N'
                    narration:
                      description: Corruption, nepotism, and conspiracy abound, and the guilty parties somehow are not convicted of any crimes.
                      text:
                        guid: 4becc7823c129
                        slug: gadianton/174
                        heading: 3 Nephi 6:26–29
                        content: <p>Now it came to pass that they were taken and brought up before the judge to be judged of the crime which they had done, [c]1510616501[/c] according to the law which had been given by the people. [c]1510718101[/c] Now it camfe to pass that those judges had many friends and kindreds; [c]1510704601[/c] [c]1510704101[/c] and the remainder, yea, even almost all the lawyers and the high priests, did gather themselves together, and unite with the kindreds of those judges who were to be tried according to the law. [c]1510611101[/c] </p> <p>And they did enter into a covenant one with another, [c]1509017102[/c] [c]1510813101[/c] yea, even into that covenant which was given by them of old, which covenant was given and administered by the devil, [c]1510008201[/c] [c]1510904601[/c] [c]1510805401[/c] to combine against all righteousness. Therefore they did combine against the people of the Lord, and enter into a covenant to destroy them, [i]3376[/i] and to deliver those who were guilty of murder from the grasp of justice, [c]1510913101[/c] which was about to be administered according to the law. [c]1510811101[/c] </p>
                        duration: 51
                        quotes: []
                        people: []
                        places: []
                        refs:
                          - verse_id: 35741
                            ref: hel 6:26
                            type: xref
                            significant: 0
                          - verse_id: 37297
                            ref: ether 8:9
                            type: xref
                            significant: 0
                        notes:
                          - id: '1510619301'
                            title: “Before the judge”
                            text: That is, a higher judge. It is not clear in what sense the law had been <i>given by the people</i>, but the narrator is alluding to the governmental safeguards outlined at Mos 29.28.
                          - id: '1510819301'
                            title: “Covenant…of old…against all righteousness”
                            text: See Hel 6.21–30;Ether 8.15–16.
                          - id: '1510819302'
                            title: “Grasp of justice”
                            text: Only here and Alma 42.14, perhaps with a suggestion that judges who subvert human justice will themselves be unable to escape divine justice.
              - title: Societal Disintegration
                slug: gadianton/societal-disintegration
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: The corrupt judges conspire and plot to kill the governors and establish a king over the people.
                      text:
                        guid: 4becc7823c41e
                        slug: gadianton/175
                        heading: 3 Nephi 6:30
                        content: <p>And they did set at defiance the law and the rights of their country; [c]1511012101[/c] and they did covenant one with another to destroy the governor, and to establish a king over the land, [c]1510904101[/c] that the land should no more be at liberty but should be subject unto kings. [c]1510604801[/c] [c]1511009101[/c] [c]1511007201[/c] </p>
                        duration: 16
                        quotes: []
                        people: []
                        places: []
                        refs:
                          - verse_id: 7375
                            ref: 1sam 8:5
                            type: xref
                            significant: 0
                          - verse_id: 33352
                            ref: mosiah 23:6
                            type: xref
                            significant: 0
                          - verse_id: 35125
                            ref: alma 51:5
                            type: xref
                            significant: 0
                          - verse_id: 36225
                            ref: 3ne 7:12
                            type: xref
                            significant: 0
                        notes:
                          - id: '1511019301'
                            text: The desire of some for a restored monarchy has been threatening the Nephite system of judges for more than a century (see Alma 2.2). The incompatibility of kings and “a land of liberty” was articulated earlier at Mos 29.30–32.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: They are not successful in establishing a king, but they do kill the chief judge.
                      text:
                        guid: 4becc7823c613
                        slug: gadianton/176
                        heading: 3 Nephi 7:1
                        content: <p>Now behold, I will show unto you that they did not establish a king over the land; [c]1511102701[/c] but in this same year, yea, the thirtieth year, they did destroy upon the judgment seat, [c]1511117102[/c] [c]1511105401[/c] yea, did murder the chief judge of the land. [i]3377[/i] [c]1511112101[/c] [c]1511104601[/c] [c]1511104101[/c] </p>
                        duration: 14
                        quotes: []
                        people: []
                        places: []
                        refs: []
                        notes:
                          - id: '1511119301'
                            title: “I will show unto you”
                            text: A proleptic comment from the editor.
                          - id: '1511119302'
                            title: “The chief judge”
                            text: Lachoneus<sub >2</sub>; see 3 Nephi 6.19.
                  - weight: 3
                    type: 'N'
                    narration:
                      description: The {Nephite|nephites} society disassembles, and the people group into factions.
                      text:
                        guid: 4becc7823c7ef
                        slug: gadianton/177
                        heading: 3 Nephi 7:2–3
                        content: <p>And the people were divided one against another; [c]1511202701[/c] and they did separate one from another into tribes, [c]1511212101[/c] [c]1511203101[/c] [c]1511213101[/c] [c]1511204101[/c] every man according to his family and his kindred and friends; and thus they did destroy the government of the land. [c]1511111101[/c] [c]1511212102[/c] [c]1511204601[/c] And every tribe did appoint a chief or a leader over them; [c]1511218101[/c] [c]1511104801[/c] [c]1511117102[/c] and thus they became tribes and leaders of tribes. [c]1511216501[/c]</p>
                        duration: 20
                        quotes: []
                        people:
                          - slug: nephites
                            name: Nephites
                            title: Descendants of Nephi1 and his followers, later any person who accepts gospel
                        places: []
                        refs: []
                        notes:
                          - id: '1511219301'
                            text: The dissolution of society into tribes is unexpected, and the clan or lineage basis for these new social groups is unknown. At least at the beginning, they included friends as well as relatives.
                          - id: '1511219302'
                            title: “Thus they did destroy the government”
                            text: The <i>they</i> seems to refer to those in the secret combinations of 3 Nephi 6.26–7.1 rather than to the tribes; this interpretation will be supported by the heavenly voice at 3 Nephi 9.9.
                          - id: '1511319201'
                            title: “and thus they became tribes”
                            text: ATV <em>and thus there became tribes</em>
                  - weight: 4
                    type: 'N'
                    narration:
                      description: The government and legal system also disintegrates, and the {Nephites|nephites} are left in autonomous tribes—the social disassembly takes place in less than six years.
                      text:
                        guid: 4becc7823c9e9
                        slug: gadianton/178
                        heading: 3 Nephi 7:4–8
                        content: <p>Now behold, there was no man among them save he had much family and many kindreds and friends; [c]1511304101[/c] therefore their tribes became exceedingly great. [c]1511204801[/c] [c]1511304601[/c] Now all this was done, and there were no wars as yet among them; and all this iniquity had come upon the people because they did yield themselves unto the power of Satan. [c]1511311101[/c] [c]1511108201[/c] [c]1511504101[/c] And the regulations of the government were destroyed, [c]1511504801[/c] [c]1511504601[/c] because of the secret combination of the friends and [c]1511616502[/c] kindreds of those who murdered the prophets. [c]1511616501[/c] [c]1511604101[/c] </p> <p>And they did cause a great contention in the land, insomuch that the more righteous part of the people [c]1511716502[/c] had nearly all become wicked; [c]1511704601[/c] [c]1511704101[/c] yea, there were but few righteous men among them. [c]1511716503[/c] [c]1511716501[/c] And thus six years had not passed away since the more part of the people had turned from their righteousness, [c]1511716504[/c] [i]2999[/i] like the dog to his vomit, or like the sow to her wallowing in the mire. [c]1511805401[/c] [c]1511611101[/c] [c]1511812101[/c] [c]1511813101[/c] </p>
                        duration: 50
                        quotes: []
                        people:
                          - slug: nephites
                            name: Nephites
                            title: Descendants of Nephi1 and his followers, later any person who accepts gospel
                          - slug: people-of-jacob
                            name: People of Jacob
                            title: Jacobite Secret Combination Members
                          - slug: satan
                            name: Satan
                            title: The Devil
                        places: []
                        refs:
                          - verse_id: 17153
                            ref: prov 26:11
                            type: xref
                            significant: 0
                        notes:
                          - id: '1511819201'
                            title: “or like the sow to her wallowing in the mire”
                            text: That is, it had been less than six years since the Nephites decisively defeated the robbers; see 3 Ne 6.1.
                          - id: '1511819301'
                            title: “Six years had not passed away”
                            text: That is, it had been less than six years since the Nephites had decisively defeated the robbers; see 3 Nephi 6.1.
                          - id: '1511819302'
                            text: <i>“Like the dog to his vomit, or like the sow to her wallowing in the mire”</i>, 2 Pet 2.22 (the first part is quoted from Prov 26.11).
              - title: Jacob and the New Secret Combination
                slug: gadianton/jacob-and-the-new-secret-combination
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: The organization behind the corrupt judges appoints a leader, {Jacob|jacob4}, to be their king, with a sworn oath to destroy all governmental order.
                      text:
                        guid: 4becc7823cca1
                        slug: gadianton/179
                        heading: 3 Nephi 7:9–11
                        content: <p>Now this secret combination, which had brought so great iniquity upon the people, did gather themselves together, and did place at their head a man whom they did call Jacob; [c]1511905401[/c] [c]1512007201[/c] [c]1511902701[/c] And they did call him their king; [c]1512118101[/c] [i]3379[/i] [c]1511904601[/c] [c]1511904101[/c] therefore he became a king over this wicked band; and he was one of the chiefest who had given his voice against the prophets who testified of Jesus.</p> <p>And it came to pass that they were not so strong in [c]1512116501[/c] number as the tribes of the people, who were united together save it were their leaders did establish their laws, every one according to his tribe; nevertheless they were enemies; notwithstanding they were not a righteous people, yet they were united in the hatred of those who had entered into a covenant to destroy the government. [c]1511904801[/c] [c]1512116503[/c] [c]1512116502[/c] [c]1511911101[/c] [c]1512104601[/c] [c]1512104101[/c] </p>
                        duration: 44
                        quotes: []
                        people:
                          - slug: jacob4
                            name: Jacob4
                            title: Late Gadianton leader
                          - slug: jesus-christ
                            name: Jesus Christ
                            title: Holy One of Israel
                        places: []
                        refs:
                          - verse_id: 36273
                            ref: 3ne 9:9
                            type: xref
                            significant: -1
                        notes:
                          - id: '1511919301'
                            text: This was the plan of the original conspirators at 3 Nephi 6.30; see 3 Nephi 9.9for the ultimate fate of this group.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: Seeing that his faction was not as powerful as other {Nephite|nephites} tribes, {Jacob|jacob4} leads his people to the [land northward|land-of-desolation], in an attempt to gather recruits and strengthen his forces.
                      text:
                        guid: 4becc7823cea8
                        slug: gadianton/180
                        heading: 3 Nephi 7:12–13
                        content: <p>Therefore, Jacob seeing that their enemies were more numerous than they, he being the king of the band, therefore he commanded his people that they should take their flight into the northernmost part of the land, [c]1512204801[/c] [c]1512204601[/c] [c]1512213101[/c] [c]1512102701[/c] and there build up unto themselves a kingdom, [c]1512204101[/c] until they were joined by dissenters, (for he flattered them that there would be many dissenters) and they become sufficiently strong to contend with the tribes of the people; [c]1512216501[/c] and they did so.</p> <p>And so speedy was their march that it could not be impeded until they had gone forth out of the reach of the people. And thus ended the thirtieth year; and thus were the affairs of the people of Nephi. [c]1512211101[/c] </p>
                        duration: 39
                        quotes: []
                        people:
                          - slug: jacob4
                            name: Jacob4
                            title: Late Gadianton leader
                          - slug: nephites
                            name: Nephites
                            title: Descendants of Nephi1 and his followers, later any person who accepts gospel
                        places:
                          - slug: land-of-desolation
                            name: Land of Desolation
                            info: Land Northward
                        refs:
                          - verse_id: 36213
                            ref: 3ne 6:30
                            type: xref
                            significant: 0
                          - verse_id: 36273
                            ref: 3ne 9:9
                            type: xref
                            significant: -1
                        notes:
                          - id: '1512219301'
                            text: The strategy is similar to that of another would-be king, Amalickiah (Alma 46.4–5, 29), and the flight northward is reminiscent of Morianton and his people (Alma 50.29), as well as Zemnarihah and his robbers (3 Nephi 4.22–23).
                          - id: '1512319201'
                            title: “And thus ended the thirtieth year”
                            text: '#ERROR!'
                  - weight: 3
                    type: 'N'
                    narration:
                      description: While the {Nephite|nephites} tribes remained independent, they agree to peace treaties, to avoid war.
                      text:
                        guid: 4becc7823d09f
                        slug: gadianton/181
                        heading: 3 Nephi 7:14
                        content: <p>And it came to pass in the thirty and first year that they were divided into tribes, every man according to his family, kindred and friends; [c]1512404601[/c] nevertheless they had come to an agreement that they would not go to war one with another; but they were not united as to their laws, and their manner of government, for they were established according to the [c]1512416501[/c] minds of those who were their chiefs and their leaders. [c]1512404101[/c] But they did establish very strict laws that one tribe should not trespass against another, insomuch that in some degree they had peace in the land; nevertheless, their hearts were turned from the Lord their God, and they did stone the prophets and did cast them out from among them. [i]3380[/i] [c]1512411101[/c] </p>
                        duration: 40
                        quotes: []
                        people:
                          - slug: nephites
                            name: Nephites
                            title: Descendants of Nephi1 and his followers, later any person who accepts gospel
                        places: []
                        refs:
                          - verse_id: 36206
                            ref: 3ne 6:23
                            type: xref
                            significant: 0
                        notes:
                          - id: '1512419301'
                            text: The new tribes are no more supportive of Christian prophets than were the corrupt judges who formed a secret combination in 3 Nephi 6.20–30; cf. 3 Nephi 7.6, 10.
              - title: Nephi’s Spiritual Ministry
                slug: gadianton/nephis-spiritual-ministry
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: '{Nephi|nephi3}, having seen the rapid decline in righteousness among the {Nephites|nephites}, goes out and begins to preach to the people.'
                      text:
                        guid: 4becc7823d377
                        slug: gadianton/182
                        heading: 3 Nephi 7:15–17
                        content: <p>And it came to pass that Nephi—having been visited by angels and also [c]1512516501[/c] the voice of the Lord, therefore having seen angels, and being eye–witness, and having had power given unto him that he might know concerning the ministry of Christ, [c]1512517102[/c] [c]1512509101[/c] [c]1512512101[/c] and also being eye–witness to their quick return from righteousness unto their wickedness and abominations; [c]1512516502[/c] [i]3381[/i] [c]1512511101[/c] </p> <p>Therefore, being grieved for the hardness of their hearts and the blindness of their minds—went forth among them in that same year, and began to testify, [c]1512604101[/c] [c]1512504601[/c] boldly, repentance and remission of sins through faith on the Lord Jesus Christ. [c]1512616501[/c] [c]1512501201[/c] And he did minister many things unto them; [c]1512404801[/c] [c]1512504801[/c] [i]3000[/i] [c]1512704601[/c] [c]1512504101[/c] and all of them cannot be written, and a part of them would not suffice, therefore they are not written in this book. And Nephi did minister with power and with great authority. [c]1512518101[/c] [c]1512505401[/c] [c]1512611101[/c] [c]1512508201[/c] [c]1512502701[/c] </p>
                        duration: 51
                        quotes: []
                        people:
                          - slug: angels-to-nephi3
                            name: Angels to Nephi3
                            title: Heavenly Counsel to Nephi
                          - slug: nephi3
