              - title: Rise of the Gadianton Robbers
                slug: gadianton/rise-of-the-gadianton-robbers
                rows:
                  - weight: 1
                    type: 'N'
                    narration:
                      description: Not long after, {Cezoram|cezoram}, the chief judge, is murdered in cold blood along with  his successor, {his son|cezorams-son}.
                      text:
                        guid: 4becc7822f6e0
                        slug: gadianton/77
                        heading: Helaman 6:15
                        content: <p>And it came to pass that in the sixty and sixth year of the reign of [c]1462716501[/c] the judges, behold, Cezoram [c]1462716502[/c] was murdered by an unknown hand as he sat upon the judgment–seat. [c]1462604601[/c] [c]1462712101[/c] [c]1462705301[/c] [c]1462604101[/c] [c]1462707201[/c] And it came to pass that in the same year, that his son, who [c]1462716503[/c] had been appointed by the people in his stead, [c]1462713101[/c] was also murdered. [c]1462706401[/c] And thus ended the sixty and sixth year. </p>
                        chrono: roj|66
                        duration: 22
                        quotes: []
                        people:
                          - slug: cezoram
                            name: Cezoram
                            title: Wicked chief judge of Nephites
                          - slug: cezorams-son
                            name: Cezoram's Son
                            title: Short-lived Nephite Judge
                        places: []
                        refs:
                          - verse_id: 35664
                            ref: hel 5:1
                            type: xref
                            significant: 0
                          - verse_id: 35734
                            ref: hel 6:19
                            type: xref
                            significant: 0
                        notes:
                          - id: '1462719301'
                            text: Cezoram had been appointed chief judge four years earlier, at Helaman 5.1. The assassination of two chief judges in a single year is surprising in light of Helaman 6:7–14. There seems to be an underlying current of social dislocation, resentment, or resistance that the narrator has passed over in his account of economic progress and social harmony.
                  - weight: 2
                    type: 'N'
                    narration:
                      description: The abundance and prosperity of the people had once again caused them to become prideful, and they fall back into a wicked state.
                      text:
                        guid: 4becc7822f8b5
                        slug: gadianton/78
                        heading: Helaman 6:16–17
                        content: <p>And in the commencement of the sixty and seventh year the people began to grow exceedingly wicked again. [c]1462711101[/c] [c]1462108201[/c] [c]1462804601[/c] [c]1462804101[/c] For behold, the Lord had blessed them so long with the riches of the world that they had not been stirred up to anger, [c]1462704801[/c] [c]1462901201[/c] [c]1462913101[/c] to wars, nor [c]1462916501[/c] to bloodshed; [c]1462916502[/c] therefore they began to set their hearts upon their riches; [c]1462905301[/c] [c]1462901202[/c] [c]1462912101[/c] yea, they began to seek to get gain that they might be lifted up one above another; [c]1462904601[/c] [c]1462904101[/c] therefore they began to commit secret murders, [c]1462718101[/c] [c]1462911101[/c] and to rob and to plunder, that they might get gain. [i]3320[/i] [c]1462907201[/c] </p>
                        chrono: roj|67
                        duration: 31
                        quotes: []
                        people: []
                        places: []
                        refs:
                          - verse_id: 36206
                            ref: 3ne 6:23
                            type: xref
                            significant: 0
                          - verse_id: 36273
                            ref: 3ne 9:9
                            type: xref
                            significant: 0
                        notes:
                          - id: '1462819301'
                            text: Apparently, gaining wealth had distracted the people from warfare, though their pursuit of riches has led to pride and crime.
                          - id: '1462919301'
                            text: The phrase <i>secret murder(s)</i> has hitherto occurred only at Alma 37.22, in a discussion of secret combinations among the Jaredites; its reappearance here is ominous.
                  - weight: 3
                    type: 'N'
                    narration:
                      description: '{Gadianton|gadianton}’s band resurfaces, leading the way of robbing, murdering, and wickedness.'
                      text:
                        guid: 4becc7822fa8a
                        slug: gadianton/79
                        heading: Helaman 6:18–19
                        content: <p>And now behold, those murderers and plunderers were a band who had been formed by Kishkumen and Gadianton. [c]1462917102[/c] [i]3321[/i] [c]1463013101[/c] And now it had come to pass that there were many, even among the Nephites, of Gadianton’s band. [c]1463011101[/c] But behold, they were more numerous among the more wicked part of the Lamanites. And they were called Gadianton’s robbers and murderers. [c]1463004601[/c] [c]1463004101[/c] [c]1463012101[/c] And it was they who did murder the chief judge Cezoram, [c]1463104101[/c] and his son, [c]1463104601[/c] while in the judgment–seat; and behold, they were not found. [c]1462904801[/c] </p>
                        duration: 33
