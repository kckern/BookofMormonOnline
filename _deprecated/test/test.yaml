                          - id: '1448519301'
                            text: Helaman is the third chief judge in two years. The office of chief judge was transferred from Alma to Nephihah and his descendants at Alma 4.20; here it reverts to the lineage of Alma. Helaman<sub >3</sub>’s son Nephi<sub >2</sub> will yield the judgeship to yet another family at Helaman 5.1.
                  - weight: 2
