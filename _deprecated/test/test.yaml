                          - id: '1464019302'
                            title: “Led on”
                            text: Misled. The phrase is grammatically separate from <i>into this land</i> (which further identifies the people who came from the tower) since the Jaredites were led to the promised land by God rather than by Satan (cf. Ether 6.5–11; 7.27). The destruction of the Jaredites is attributed to their <i>works of darkness and abominations</i> (as at Alma 37.21–23), which originated with Satan.
