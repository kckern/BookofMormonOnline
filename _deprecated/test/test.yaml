                    type: 'N'
                    narration:
                      description: Wickedness continues to abound, and the {Gadianton|gadianton-robbers} forces continue to increase to the point that the {Nephites|nephites} and {Lamanites|lamanites} feel compelled to team up and fight back.
                      text:
                        guid: 4becc78236494
                        slug: gadianton/126
                        heading: 3 Nephi 2:10–11
                        content: <p>And it came to pass that the people did still remain in wickedness, [c]1498002701[/c] notwithstanding the much preaching and prophesying which was sent among them; and thus passed away the tenth year also; and the eleventh year also passed away in iniquity. And it came to pass in the thirteenth year there began to be wars and [c]1498716501[/c] contentions throughout all the land; for the Gadianton robbers had become so numerous, [c]1498702701[/c] [c]1498704601[/c] and did slay so many of the people, [c]1498504801[/c] [c]1498611101[/c] [c]1498704101[/c] and did lay waste so many cities, and did spread so much death and carnage throughout the land, [c]1498712101[/c] that it became expedient that all the people, both the Nephites and the Lamanites, should take up arms against them. [c]1498705401[/c] </p>
