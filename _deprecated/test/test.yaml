                            text: The robbers enforced secrecy with their own tribunals, according to rules laid down by their founders.
                  - weight: 6
                    type: 'N'
                    narration:
                      description: '{Alma|alma2} had specifically warned about this kind of organization and the dangers which accompany it.'
                      text:
                        guid: 4becc7823009d
                        slug: gadianton/82
                        heading: Helaman 6:25
                        content: <p>Now behold, it is these secret oaths and covenants which Alma commanded his son should not go forth unto the world, [c]1463716501[/c] [c]1463705301[/c] [c]1463703101[/c] lest they should be a means of bringing down the people unto destruction. </p>
                        duration: 12
                        quotes: []
                        people:
                          - slug: alma2
                            name: Alma2
                            title: Son of Alma1, first chief judge, high priest
                        places: []
                        refs:
                          - verse_id: 34722
                            ref: alma 37:29
                            type: xref
                            significant: 0
                          - verse_id: 36105
                            ref: 3ne 3:7
                            type: xref
                            significant: -1
                          - verse_id: 36206
                            ref: 3ne 6:23
                            type: xref
                            significant: -1
                          - verse_id: 36273
                            ref: 3ne 9:9
                            type: xref
                            significant: -1
                          - verse_id: 37666
                            ref: moro 9:20
                            type: xref
                            significant: -1
                        notes:
                          - id: '1463719301'
                            text: Mormon, noting the similarities between Jaredite secret combinations and the Gadianton robbers, is eager to absolve Helaman from any suspicion that he might have disclosed specifics from records in his safekeeping; cf. Alma 63.12. Rather, the similarities are attributed to the influence of Satan in creating such organizations; indeed, at Helaman 8.28, Satan is identified as a cofounder of the Gadianton robbers.
                          - id: '1463719302'
                            text: See Alma 37.27–32.
              - title: Nephite Moral Decay
