                  - weight: 3
                    type: 'N'
                    narration:
                      description: Peace, prosperity, abundance, and blessing underscore the lives of both the {Nephites|nephites} and {Lamanites|lamanites}.
                      text:
                        guid: 4becc7822f437
                        slug: gadianton/76
                        heading: Helaman 6:12–14
                        content: <p>They did raise grain in abundance, both in the north and in the south; [c]1462413101[/c] and they did flourish exceedingly, [c]1462413102[/c] both in the north and in the south. And they did multiply and wax exceedingly strong in the land. And they did raise many flocks and herds, [c]1462304801[/c] [c]1462404601[/c] [c]1462404101[/c] yea, many fatlings. Behold their women did toil and spin, and did make all manner of cloth, [c]1462511101[/c] [c]1462504101[/c] [c]1462513102[/c] of fine–twined linen and cloth of every kind, [c]1462513101[/c] [c]1462503101[/c] [c]1462504601[/c] to clothe their nakedness. And thus the sixty and fourth year did pass away in peace. [c]1462607201[/c] And in the sixty and fifth year they did also have great joy and peace, yea, much preaching and many prophecies concerning that which was to come. [c]1462616501[/c] And thus passed away the sixty and fifth year.</p>
                        chrono: roj_plural|64-65
                        duration: 45
                        quotes: []
