                    narration:
                      description: '{Helaman’s servant|helamans-servant} maintains his cover, and agrees to lead {Kishkumen|kishkumen} to {Helaman|helaman3}.'
                      text:
                        guid: 4becc78226a07
                        slug: gadianton/5
                        heading: Helaman 2:8
                        content: <p>And when the servant [c]1449116501[/c] of Helaman had known all the heart of Kishkumen, [c]1449108201[/c] and how that it was his object to murder, and also that it was the object of all those who belonged to his band to murder, and to rob, and to gain power, [c]1449105301[/c] (and this was their secret plan, and their combination) the servant of Helaman said unto Kishkumen:</p> <blockquote><p>“Let us go forth unto the judgment–seat.” [c]1448918101[/c] </p></blockquote>
