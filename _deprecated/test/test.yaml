                  - weight: 1
                    type: 'N'
                    narration:
                      description: '{Gadianton|gadianton-robbers} forces strengthen, recruiting many {Nephites|nephites} and causing havoc among the people.'
                      text:
                        guid: 4becc7823593a
                        slug: gadianton/121
                        heading: 3 Nephi 1:27–28
                        content: <p>And it came to pass that the ninety and third year did also pass away in peace, save it were for the Gadianton robbers, [c]1497302701[/c] who dwelt upon the mountains, [c]1497318101[/c] who did infest the land; [c]1497316501[/c] [c]1497204101[/c] [c]1497312101[/c] for so strong were their holds and their secret places that the people could not overpower them; [i]3347[/i] therefore they did commit many murders, [c]1497204601[/c] and did do much slaughter among the people. And it came to pass that in the ninety and fourth year they began to increase in a great degree, because there were many dissenters of the Nephites [c]1497305401[/c] [c]1497404101[/c] who did flee unto them, [c]1497311101[/c] which did cause much sorrow unto those Nephites who did remain in the land.</p>
                        chrono: roj_plural|93-94
