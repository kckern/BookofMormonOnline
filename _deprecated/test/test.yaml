                  - weight: 9
                    type: 'N'
                    narration:
                      description: The voice goes on to say unspeakably marvelous things.
                      text:
                        guid: 4becc7822ce1e
                        slug: gadianton/57
                        heading: Helaman 5:33–34
                        content: <p>And also again the third time the voice came, [c]1459104601[/c] and did speak unto them marvelous words which cannot be uttered by man; [c]1458904801[/c] [c]1459317101[/c] [c]1459305301[/c] [c]1459312101[/c] and the walls did tremble again, and the earth shook as if it were about to divide asunder. And it came to pass that the Lamanites could not flee because of the cloud of darkness which did overshadow them; [c]1459404601[/c] [c]1459404101[/c] yea, and also they were immovable because of the fear which did come upon them. [i]1759[/i] [c]1459211101[/c]</p>
