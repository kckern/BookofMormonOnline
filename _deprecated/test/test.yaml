                  - weight: 5
                    type: 'N'
                    narration:
                      description: '{Lachoneus|lachoneus1} is concerned about the threat, and urges his people to pray fervently for strength to withstand {Giddianhi|giddianhi}’s attack.'
                      text:
                        guid: 4becc782374c2
                        slug: gadianton/139
                        heading: 3 Nephi 3:11–12
                        content: <p>And now it came to pass when Lachoneus received this epistle he was exceedingly astonished, because of the boldness of Giddianhi [c]1500616501[/c] demanding the possession of the land of the Nephites, and also of threatening the people and avenging the wrongs of those that had received no wrong, save it were they had wronged themselves by dissenting away unto those wicked and abominable robbers. [c]1500718101[/c] </p> <p>Now behold, this Lachoneus, the governor, was a just man, [c]1500602701[/c] and could not be frightened by the demands and the threatenings of a robber; [c]1500713101[/c] therefore he did not hearken to the epistle of [c]1500716502[/c] Giddianhi, [c]1500604101[/c] the governor of the robbers, but he did cause that his people should cry unto the Lord for strength against the time that the robbers should come down against them. [c]1500611101[/c] </p>
