                            ref: hel 6:21
                            type: xref
                            significant: 0
                        notes:
                          - id: '1461419301'
                            title: “Hardened and impenitent”
                            text: See Alma 47.36; the Nephites as a whole have now become like the earlier dissenters, and both groups are worse than the Lamanites (the phrase may reflect Rom 2.5).
                          - id: '1461519301'
                            text: Lamanite belief in Christ was quickly followed by the organization of church congregations among them.
