                        notes:
                          - id: '1500819301'
                            text: This would have to have been done quickly to meet Giddianhi’s deadline of one month (3 Nephi 3:8). Ironically, by gathering <i>unto one place</i>, the Nephites are acceding to Giddianhi’s demands to “yield up…your cities, your lands” (3 Nephi 3:6).
                          - id: '1500919201'
                            title: “should be placed”
                            text: Or <em>armies&mdash;both of the Nephites&nbsp;.&nbsp;.&nbsp;. among the Nephites&mdash;should be placed</em>
                          - id: '1501119301'
                            text: The mention of Lachoneus’s prophecies is an indication that he was both a political and spiritual leader; cf. 3 Nephi 3:19 below.
                  - weight: 7
                    type: 'N'
                    narration:
                      description: '{Lachoneus|lachoneus1} places guards around the central area, and places a righteous man name {Gidgiddoni|gidgiddoni} at the command of the guards.'
                      text:
                        guid: 4becc7823790a
                        slug: gadianton/141
                        heading: 3 Nephi 3:17–19
                        content: <p>And it came to pass that Lachoneus did appoint chief captains over all the armies of the Nephites, [i]3356[/i] to command them at the time that the robbers should come down out of the wilderness against them. now the chiefest among all the [c]1501216501[/c] chief captains and the great commander of the armies of the Nephites was appointed, [c]1501211101[/c] [c]1501404601[/c] [c]1501204601[/c] and his name was Gidgiddoni. [c]1501104801[/c] [c]1501204101[/c] </p> <p>Now it was the custom among all the Nephites to appoint for their chief captains, [c]1501412101[/c] (save it were in their times of wickedness) some one that had the spirit of revelation and also [c]1501416501[/c] prophecy; [c]1501418101[/c] therefore, this Gidgiddoni was a great prophet among them, [c]1501416502[/c] [c]1501411101[/c] as also was the chief judge. [c]1501404101[/c] </p>
